<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>宅建QUEST</title>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<div id="status" style="font-family:sans-serif;padding:40px;text-align:center">
  宅建QUESTを起動中…
</div>
<script>
(async()=>{
  try{
    const r=await fetch('./takken-quest-v77-github.zip');
    const z=await JSZip.loadAsync(await r.arrayBuffer());
    const f=z.file('index.html');
    if(!f) throw new Error('index.htmlがZIP内にありません');
    const html=await f.async('string');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.getElementById('status').innerText='起動エラー：'+e.message;
  }
})();
</script>
