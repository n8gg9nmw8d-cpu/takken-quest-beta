    ["その中心線からの水平距離4mの線が道路の境界線とみなされる",["面積要件混同","数字混同"],["kenpei"],"道路の幅員4mと、中心線からの後退距離2mを混同しています。","kenpei"],
    ["敷地の境界線がそのまま道路の境界線とみなされる",["要件不足"],["kenpei"],"みなし境界線まで後退する必要があります。","kenpei"],
    ["セットバックした部分にも、建築物を建築することができる",["条件見落とし"],["kenpei"],"後退部分は道路とみなされ、建築物を建築できません。","kenpei"]],
 ex:"2項道路は中心線から2m後退した線が境界線とみなされ、その部分には建築できません。",
 kid:"昔からある細い道は、幅が4mありません。でも「道路ではない」としてしまうと、その道沿いの家は建て替えができなくなります。そこで、道の真ん中から左右に2mずつ下がった線を道路の境目とみなし、将来的に幅4mの道になるようにします。下がった部分は道路と同じ扱いなので、建物を建てられません。",
 rule:"建築基準法42条2項の道路については、原則としてその中心線からの水平距離2mの線が道路の境界線とみなされます。反対側が崖地・河川等である場合は、その側の境界線から水平距離4mの線が境界線とみなされます。",
 mem:"真ん中から2m下がる（片側が崖なら反対側から4m）。",
 rel:["kenpei"],pre:["kenpei"]},

{id:"h1-017",topic:"kenpei",sub:"前面道路の容積率制限",diff:3,type:"数字・期間・面積",sec:60,freq:3,
 q:"前面道路の幅員による容積率の制限に関する次の記述のうち、正しいものはどれか。",
 c:["前面道路の幅員が12m未満の場合、その幅員に住居系の用途地域では10分の4、その他の地域では10分の6を乗じた値と、都市計画で定められた容積率のうち小さい方が限度となる",
    ["前面道路の幅員が12m未満の場合であっても、都市計画で定められた容積率がそのまま適用される",["要件不足"],["kenpei"],"前面道路の幅員による制限を受けます。","kenpei"],
    ["幅員に乗じる数値は、いずれの用途地域でも10分の6である",["用途地域混同"],["kenpei"],"住居系の用途地域では10分の4です。","kenpei"],
    ["前面道路の幅員による制限は、建蔽率について適用される",["建蔽率と容積率の混同"],["kenpei"],"前面道路の幅員による制限は容積率についてのものです。","kenpei"]],
 ex:"前面道路12m未満では、幅員×係数（住居系4/10・その他6/10）と指定容積率の小さい方が限度です。",
 kid:"建物が大きくなるほど、そこに住んだり働いたりする人が増え、前の道路が混みます。細い道しかない場所に大きなビルを建てると、道がパンクしてしまいます。そこで、前の道が12mより狭いときは、その幅に応じて建てられる大きさを抑えます。住宅の地域は特に静かさを守るため、係数が小さめ（10分の4）です。",
 rule:"前面道路の幅員が12m未満である建築物の容積率は、その幅員のメートル数に、住居系の用途地域では10分の4、その他の地域では10分の6を乗じたもの以下でなければなりません（建築基準法52条2項）。",
 mem:"12m未満は道路幅×4/10（住居系）または6/10。",
 rel:["kenpei"],pre:["kenpei"]},

{id:"h1-018",topic:"kenpei",sub:"建蔽率の制限の適用除外",diff:3,type:"数字・期間・面積",sec:60,freq:3,
 q:"建蔽率の制限に関する次の記述のうち、正しいものはどれか。",
 c:["建蔽率の限度が10分の8とされている地域内で、かつ防火地域内にある耐火建築物等については、建蔽率の制限が適用されない",
    ["建蔽率の限度が10分の8の地域内の耐火建築物等については、10分の1が加算される",["数字混同"],["kenpei"],"この場合は加算ではなく、制限自体が適用されません。","kenpei"],
    ["特定行政庁が指定する角地であっても、建蔽率が緩和されることはない",["要件不足"],["kenpei"],"角地の指定により10分の1が加算されます。","kenpei"],
    ["防火地域内の耐火建築物等と角地の要件を両方満たしても、加算は10分の1にとどまる",["数字混同"],["kenpei"],"両方を満たす場合は合計10分の2が加算されます。","kenpei"]],
 ex:"建蔽率80%地域＋防火地域＋耐火建築物等では制限なし。角地・防火の要件は各10%、両方で20%加算です。",
 kid:"建蔽率は「敷地に対して建物が占めてよい割合」です。もともと8割まで建ててよい地域で、しかも燃えにくい建物を建てるなら、火が広がる心配が小さいので、制限そのものがなくなり敷地いっぱいに建てられます。角地や耐火建築物では、それぞれ1割ずつ上乗せされ、両方そろえば2割上乗せになります。",
 rule:"建蔽率の限度が10分の8とされている地域内で、かつ防火地域内にある耐火建築物等については建蔽率の制限が適用されません。防火地域内の耐火建築物等、または特定行政庁指定の角地では10分の1が加算され、双方に該当する場合は10分の2が加算されます（建築基準法53条）。",
 mem:"8割地域＋防火＋耐火＝制限なし／角地と防火は各1割。",
 rel:["kenpei"],pre:["kenpei"]},

{id:"h1-019",topic:"kenpei",sub:"準防火地域の規模要件",diff:3,type:"数字・期間・面積",sec:55,freq:2,
 q:"準防火地域内の建築物に関する次の記述のうち、正しいものはどれか。",
 c:["地階を除く階数が4以上、または延べ面積が1,500㎡を超える建築物は、耐火建築物等としなければならない",
    ["地階を除く階数が3以上、または延べ面積が100㎡を超える建築物を耐火建築物等としなければならない",["適用区域混同","数字混同"],["kenpei"],"それは防火地域の基準です。準防火地域とは規模要件が異なります。","kenpei"],
    ["準防火地域内では、木造建築物を建築することができない",["適用区域混同"],["kenpei"],"一定の技術的基準に適合すれば木造建築物も建築できます。","kenpei"],
    ["準防火地域内の建築物には、構造上の制限は課されない",["要件不足"],["kenpei"],"規模に応じた構造制限があります。","kenpei"]],
 ex:"準防火地域は階数4以上または1,500㎡超で耐火建築物等（防火地域は階数3以上または100㎡超）。",
 kid:"火事が広がりやすい中心部が「防火地域」、その周りが「準防火地域」です。中心部ほど基準が厳しく、3階建てか100㎡を超えれば燃えにくい建物にしなければなりません。その周りの準防火地域では、4階建てか1,500㎡を超えたときに同じ扱いになります。数字が入れ替わりやすいので、対で覚えます。",
 rule:"準防火地域内においては、地階を除く階数が4以上である建築物または延べ面積が1,500㎡を超える建築物は耐火建築物等としなければなりません（建築基準法61条、施行令136条の2）。",
 mem:"防火＝3階・100㎡／準防火＝4階・1,500㎡。",
 rel:["kenpei"],pre:["kenpei"]},

{id:"h1-020",topic:"kenpei",sub:"用途変更の建築確認",diff:3,type:"数字・期間・面積",sec:55,freq:2,
 q:"建築物の用途変更に関する次の記述のうち、正しいものはどれか。",
 c:["事務所を、その用途に供する部分の床面積が200㎡を超える飲食店に用途変更する場合、建築確認を受けなければならない",
    ["用途変更については、床面積にかかわらず建築確認を受ける必要がない",["要件不足"],["kenpei"],"一定規模の特殊建築物への用途変更には確認が必要です。","kenpei"],
    ["用途変更については、床面積が100㎡を超えれば建築確認が必要となる",["数字混同"],["kenpei"],"基準となる床面積は200㎡超です。","kenpei"],
    ["類似の用途相互間の用途変更であっても、常に建築確認が必要である",["条件見落とし"],["kenpei"],"政令で定める類似の用途相互間の変更は確認が不要です。","kenpei"]],
 ex:"200㎡超の特殊建築物への用途変更には確認が必要（類似用途相互間は不要）。",
 kid:"建物を建てるときだけでなく、使い方を変えるときにも確認が必要になることがあります。たとえば事務所を飲食店に変えると、火を使い、人がたくさん集まるようになるので、避難の設計を見直す必要があります。ただし、床面積が200㎡以下の場合や、似た用途どうしの変更であれば確認はいりません。",
 rule:"建築物の用途を変更して、その用途に供する部分の床面積が200㎡を超える特殊建築物とする場合には、原則として建築確認が必要です。ただし政令で定める類似の用途相互間の用途変更については確認を要しません（建築基準法87条）。",
 mem:"用途変更は200㎡超の特殊建築物／類似用途は不要。",
 rel:["kenpei"],pre:["kenpei"]},

{id:"h1-021",topic:"kokudo",sub:"事前届出と契約締結制限",diff:3,type:"数字・期間・面積",sec:55,freq:2,
 q:"注視区域および監視区域内における土地売買等の契約に関する次の記述のうち、正しいものはどれか。",
 c:["契約を締結しようとする者は、あらかじめ届け出なければならず、届出後一定の期間は契約を締結することができない",
    ["契約を締結した後、2週間以内に届け出れば足りる",["許可と届出の混同"],["kokudo"],"注視区域・監視区域では事前届出が必要です。事後届出と混同しています。","kokudo"],
    ["届出をすれば、その日のうちに契約を締結することができる",["条件見落とし"],["kokudo"],"届出後一定期間は契約締結が制限されます。","kokudo"],
    ["監視区域における届出対象面積は、全国一律に定められている",["面積要件混同"],["kokudo"],"監視区域の届出対象面積は都道府県の規則で引き下げられます。","kokudo"]],
 ex:"注視区域・監視区域は事前届出制で、届出後の一定期間は契約を締結できません。",
 kid:"地価が急に上がりそうな地域では、取引が終わってから知らせても手遅れです。そこで、契約する前に「こういう条件で売り買いします」と届け出て、行政が内容を確認する時間を置きます。その間は契約できません。監視区域では、対象になる面積が通常より小さく設定されることがあります。",
 rule:"注視区域・監視区域内において土地売買等の契約を締結しようとする当事者は、あらかじめ届け出なければならず、届出後一定期間は契約を締結できません。監視区域の届出対象面積は都道府県の規則で定められます。",
 mem:"注視・監視は契約の前に届出／しばらく契約できない。",
 rel:["kokudo"],pre:["kokudo"]},

{id:"h1-022",topic:"kenpei",sub:"建築確認の審査期間",diff:3,type:"数字・期間・面積",sec:55,freq:2,
 q:"建築確認の手続に関する次の記述のうち、正しいものはどれか。",
 c:["建築主事等は、申請に係る建築物の規模等に応じ、法定の期間内に審査を行い、確認済証を交付しなければならない",
    ["建築主事等の審査期間について、法令上の定めは置かれていない",["要件不足"],["kenpei"],"規模に応じた審査期間が定められています。","kenpei"],
    ["確認済証の交付を受ける前であっても、工事に着手することができる",["公告前後の混同"],["kenpei"],"確認済証の交付前に工事に着手することはできません。","kenpei"],
    ["建築確認の申請に対して不適合と判断された場合でも、通知は不要である",["手続混同"],["kenpei"],"適合しない旨等を申請者に通知する必要があります。","kenpei"]],
 ex:"審査期間は法定され、確認済証の交付前に工事へ着手することはできません。",
 kid:"確認の申請を出すと、役所や検査機関が図面を審査します。この審査には、建物の規模に応じた期限が決められており、いつまでも待たされることはありません。そして大事なのは、「確認済証」という合格の紙をもらう前に工事を始めてはいけないということです。",
 rule:"建築主事等は建築確認の申請を受理した場合、建築物の規模等に応じて定められた期間内に審査し、適合すると認めたときは確認済証を交付します。確認済証の交付を受けた後でなければ工事に着手できません（建築基準法6条）。",
 mem:"審査には期限あり／確認済証が出るまで着工できない。",
 rel:["kenpei"],pre:["kenpei"]},

{id:"h1-023",topic:"morido",sub:"規制対象の規模",diff:3,type:"数字・期間・面積",sec:55,freq:2,
 q:"宅地造成等工事規制区域内における工事の許可に関する次の記述のうち、正しいものはどれか。",
 c:["盛土であって高さが1mを超える崖を生ずるものや、切土であって高さが2mを超える崖を生ずるものは、許可の対象となる",
    ["盛土・切土のいずれについても、高さ2mを超える崖を生ずる場合に許可が必要となる",["数字混同"],["morido"],"盛土は1m超、切土は2m超と基準が異なります。","morido"],
    ["崖を生じない工事であれば、規模にかかわらず許可は不要である",["要件不足"],["morido"],"盛土の高さや造成面積による基準もあります。","morido"],
    ["許可が必要となるのは、都市計画区域内で行われる工事に限られる",["適用区域混同"],["morido"],"規制区域は都市計画区域の内外を問わず指定されます。","morido"]],
 ex:"盛土は高さ1m超、切土は高さ2m超の崖を生ずるもの等が許可の対象です。",
 kid:"土を盛る工事と、土を削る工事では、危なさが違います。盛った土はまだ固まっていないので崩れやすく、1mを超える崖ができるだけで許可が必要になります。もともとあった地面を削る切土は比較的しっかりしているため、2mを超えたときに許可が必要です。ほかに、盛土の高さや造成する面積による基準もあります。",
 rule:"宅地造成等工事規制区域内において行われる宅地造成等に関する工事のうち、盛土で高さ1mを超える崖を生ずるもの、切土で高さ2mを超える崖を生ずるもの、盛土と切土を同時に行い高さ2mを超える崖を生ずるもの、盛土の高さが2mを超えるもの、造成面積が500㎡を超えるものなどが許可の対象となります。",
 mem:"盛土は1m超・切土は2m超の崖／面積500㎡超。",
 rel:["morido"],pre:["morido"]},

{id:"h1-024",topic:"toshi",sub:"開発行為の該当性",diff:3,type:"事例",sec:60,freq:3,
 q:"次の行為のうち、都市計画法上の開発行為に該当するものはどれか。",
 c:["宅地分譲のため、山林を造成して複数の区画に区切り、建築物の敷地とする行為",
    ["既存の建築物を取り壊し、同じ敷地に同規模の建築物を建築する行為",["制度混同"],["kenpei"],"土地の区画形質の変更を伴わないため開発行為に当たりません。","toshi"],
    ["農地を耕作の便宜のためにならす行為",["条件見落とし"],["toshi"],"建築物の建築等を目的としないため開発行為に当たりません。","toshi"],
    ["建築物を建てずに資材置場として利用するための整地",["条件見落とし"],["toshi"],"建築目的がないため開発行為に当たりません。","toshi"]],
 ex:"開発行為に当たるには、建築等の目的と、区画形質の変更の双方が必要です。",
 kid:"開発行為かどうかは、2つの点で判断します。①建物を建てるためか ②土地の形や性質を変えるか。山林を切り開いて宅地の区画をつくるのは、どちらも当てはまるので開発行為です。一方、建て替えのように土地はそのままの場合や、資材置場のように建物を建てない場合は当てはまりません。",
 rule:"開発行為とは、主として建築物の建築等の用に供する目的で行う土地の区画形質の変更をいい、建築目的と区画形質の変更の双方を要します（都市計画法4条12項）。",
 mem:"建てるため＋土地の形を変える＝開発行為。",
 rel:["toshi"],pre:["toshi"]},

    ["市街化調整区域内であるから、規模にかかわらず開発許可が必要である",["条件見落とし"],["toshi"],"農林漁業を営む者の居住用建築物のための開発は許可不要とされています。","toshi"],
    ["1,000㎡未満であれば許可不要となる",["面積要件混同","区域混同"],["toshi"],"1,000㎡の基準は市街化区域のものです。","toshi"],
    ["市街化区域内で同じ開発行為を行う場合も、同様に許可が不要である",["区域混同"],["toshi"],"農林漁業用建築物の例外は市街化区域には適用されません。","toshi"]],
 ex:"市街化調整区域等での農林漁業用建築物・農林漁業者の住宅のための開発は許可不要です。",

{id:"h1-026",topic:"toshi",sub:"工事完了公告前の制限",diff:3,type:"事例",sec:60,freq:3,

{id:"h1-027",topic:"toshi",sub:"工事完了公告後の制限",diff:3,type:"事例",sec:60,freq:2,

    ["公告後も、予定建築物を含めて一切の建築物を建築することができない",["公告前後の混同"],["toshi"],"公告後は予定建築物を建築できます。","toshi"],

 rule:"工事完了の公告があった後は、当該開発許可に係る予定建築物等以外の建築物を新築等することができません。ただし、都道府県知事が許可したとき、または当該開発区域内の土地について用途地域等が定められているときは、この限りではありません（都市計画法42条）。",

{id:"h1-028",topic:"kenpei",sub:"建蔽率が異なる地域にわたる敷地",diff:3,type:"事例",sec:60,freq:2,
 q:"建築物の敷地が、建蔽率の限度が異なる2つの地域にわたる場合の建蔽率の限度に関する次の記述のうち、正しいものはどれか。",
 c:["それぞれの地域に属する敷地の部分の割合に応じて按分して計算した値が限度となる",
    ["敷地の過半が属する地域の建蔽率が、敷地全体に適用される",["制度混同"],["kenpei"],"過半主義が適用されるのは用途制限であり、建蔽率は按分計算です。","kenpei"],
    ["いずれか厳しい方の建蔽率が敷地全体に適用される",["制度混同"],["kenpei"],"厳しい方が適用されるのは防火地域と準防火地域にわたる場合です。","kenpei"],
    ["いずれか緩やかな方の建蔽率を選択して適用することができる",["条件見落とし"],["kenpei"],"任意に選択することはできません。","kenpei"]],
 ex:"建蔽率・容積率は按分計算、用途制限は過半主義、防火規制は厳しい方、と処理が分かれます。",
 kid:"敷地が2つの地域にまたがるとき、どう計算するかはルールごとに違います。①建てられる用途は「広い方の地域」に合わせる ②建蔽率や容積率は「面積の割合で計算」する ③防火のルールは「厳しい方」に合わせる。この3つは混ざりやすいので、セットで覚えると確実です。",
 rule:"建築物の敷地が建蔽率の限度が異なる地域にわたる場合、それぞれの地域に属する敷地の部分の面積の割合に応じて按分した数値が建蔽率の限度となります（建築基準法53条2項）。容積率も同様です。",
 mem:"用途は過半・建蔽容積は按分・防火は厳しい方。",
 rel:["kenpei"],pre:["kenpei"]},

{id:"h1-029",topic:"kenpei",sub:"防火地域と防火壁",diff:3,type:"事例",sec:60,freq:2,
 q:"建築物が防火地域と準防火地域にわたる場合の規制に関する次の記述のうち、正しいものはどれか。",
 c:["原則として建築物の全部について防火地域内の規制が適用されるが、防火壁で区画されている場合はその防火壁外の部分について準防火地域の規制が適用される",
    ["建築物の部分ごとに、それぞれの地域の規制が当然に適用される",["条件見落とし"],["kenpei"],"原則は厳しい方の規制が全体に適用されます。","kenpei"],
    ["敷地の過半が属する地域の規制が建築物全体に適用される",["制度混同"],["kenpei"],"過半主義は用途制限の処理です。","kenpei"],
    ["準防火地域内の規制が建築物全体に適用される",["条件見落とし"],["kenpei"],"厳しい方である防火地域の規制が適用されます。","kenpei"]],
 ex:"原則は厳しい防火地域の規制が全体に適用。防火壁で区画された部分は例外です。",
 kid:"1つの建物が2つの地域にまたがると、火事のときに「こちら側だけ燃えにくい」では意味がありません。だから厳しい方（防火地域）のルールを建物全体に適用します。ただし、建物の途中に火を止める壁（防火壁）があれば、そこで区切られた向こう側は別の建物のように扱えるので、ゆるやかな方の規制で足ります。",
 rule:"建築物が防火地域および準防火地域にわたる場合には、原則としてその全部について防火地域内の建築物に関する規定が適用されます。ただし、建築物が防火壁で区画されている場合は、その防火壁外の部分については準防火地域内の規定が適用されます（建築基準法65条）。",
 mem:"またがるときは厳しい方／防火壁があれば分けられる。",
 rel:["kenpei"],pre:["kenpei"]},

    ["自己所有の農地の転用であれば、常に許可を要しない",["農地法条文混同"],["nouchi"],"自己所有の農地の転用にも原則として4条許可が必要です。","nouchi"],
    ["農業用施設への転用には、農地法5条の許可が必要である",["農地法条文混同"],["nouchi"],"権利移動を伴わない自己転用は4条の問題です。","nouchi"]],
 ex:"自己の農地を2アール未満の農業用施設に転用する場合は4条許可が不要です。",

 rule:"耕作の事業を行う者がその農地をその者の耕作の事業に供する2アール未満の農業用施設に供する場合には、農地法4条1項の許可を要しません（農地法施行規則29条1号）。",

    ["あらかじめ農業委員会に届け出れば、許可を受ける必要はない",["農地法条文混同","許可と届出の混同"],["nouchi"],"市街化区域内の特例は4条・5条の転用に関するものです。3条には適用されません。","nouchi"],
    ["市街化区域内であるから、何らの手続も必要ない",["区域混同"],["nouchi"],"3条許可が必要です。","nouchi"],

{id:"h1-032",topic:"kukaku",sub:"仮換地指定の効果",diff:3,type:"事例",sec:60,freq:3,

    ["仮換地の指定により、仮換地の所有権が従前の宅地の所有者に移転する",["換地と仮換地の混同"],["kukaku"],"所有権が移転するのは換地処分の後です。","kukaku"],
    ["仮換地の指定後も、従前の宅地を引き続き使用収益することができる",["換地と仮換地の混同"],["kukaku"],"従前の宅地は使用収益できなくなります。","kukaku"],
    ["仮換地の指定があっても、従前の宅地について抵当権を実行することはできない",["効果混同"],["kukaku"],"従前の宅地に設定された抵当権の実行が妨げられるわけではありません。","kukaku"]],
 ex:"仮換地の指定で使用収益の場所が移りますが、所有権は従前の宅地のままです。",
 kid:"工事の間、いまの土地は掘り返されて使えません。そこで代わりに使う場所（仮換地）が指定されます。ここで大事なのは、「使う場所が変わるだけで、持ち主としての権利はもとの土地のまま」ということ。だから登記も、抵当権も、もとの土地についたままです。持ち主が入れ替わるのは、工事が終わって換地処分がされたあとです。",

    ["土地の取得が2回に分かれている場合、常に別個の取引として扱われる",["条件見落とし"],["kokudo"],"計画的に一団の土地として取得する場合は合算されます。","kokudo"]],

    ["いずれも都道府県知事が行う処分である",["許可権者混同"],["kenpei"],"建築確認は建築主事等または指定確認検査機関が行います。","kenpei"],

    ["開発許可の申請に対する処分については、不服を申し立てることができない",["制度混同"],["toshi"],"開発審査会に対する審査請求ができます。","toshi"]],

     .sort((a,b)=>stableHash(`drill-wrong|${a.q.id}|${a.choiceIndex}`)-stableHash(`drill-wrong|${b.q.id}|${b.choiceIndex}`));
   primary.push(...correct,...wrong.slice(0,2));reserve.push(...wrong.slice(2));all.push(...candidates);

 all.sort((a,b)=>stableHash(`drill-all|${a.q.id}|${a.choiceIndex}`)-stableHash(`drill-all|${b.q.id}|${b.choiceIndex}`)).forEach(take);

 if(!String(q.explanation||"").trim())fatal.push("通常解説欠損");

}

/* ============ P0-3: 問題データ監査（開発者向け） ============ */
function auditQuestions(opt){
 opt=opt||{}; const N=opt.sim||10000;
 const line=(k,v)=>console.log(String(k).padEnd(26)+": "+v);
 const dist=arr=>{const c=[0,0,0,0];arr.forEach(q=>{if(q.correctIndex>=0&&q.correctIndex<=3)c[q.correctIndex]++;});
   return c.map((n,i)=>`${i+1}番目 ${n}件(${arr.length?(n/arr.length*100).toFixed(1):0}%)`).join(" / ");};
 const norm=t=>String(t||"").replace(/[\s\u3000]/g,"").replace(/[（(].*?[)）]/g,"");
 console.group("%c問題データ監査","font-weight:bold;font-size:14px");
 line("全問題数",BANK.length);
 line("四択コア問題数",CORE_BANK.length);
 line("一問一答数",DRILLS.length);
 line("学習出題数",LEARN.length);
 line("模試専用問題数",MOCKQ.length);
 line("安全隔離",QUARANTINED_CORE.length+"問");
 line("内部管理文言",CORE_WARNING.filter(x=>x.warnings.includes("内部管理文言")).length+"問（表示時に除去）");
 line("正解・解説の矛盾疑い",CORE_WARNING.filter(x=>x.warnings.includes("正解と解説の矛盾疑い")).length+"問");
 const cat={};BANK.forEach(q=>cat[q.category]=(cat[q.category]||0)+1);
 Object.keys(cat).forEach(c=>line("　"+c,cat[c]+"問"));
 console.log("--- 正解位置（元データ）---");
 line("四択コア",dist(CORE_BANK));line("一問一答",dist(DRILLS));line("模試専用",dist(MOCKQ));
 // ランダム化後のシミュレーション
 const sim=[0,0,0,0];
 for(let i=0;i<N;i++){const q=BANK[Math.floor(Math.random()*BANK.length)];
   const o=fyShuffle(q.choices.length); sim[o.indexOf(q.correctIndex)]++;}
 console.log("--- 正解位置（ランダム化後 "+N+"回シミュレーション）---");
 line("表示後の分布",sim.map((n,i)=>`${i+1}番目 ${(n/N*100).toFixed(2)}%`).join(" / "));
 const expected=[0,0,0,0];BANK.forEach(q=>{for(let i=0;i<q.choices.length;i++)expected[i]+=1/q.choices.length/BANK.length;});
 const dev=Math.max(...sim.map((n,i)=>Math.abs(n/N-expected[i])));
 line("理論値",expected.map((n,i)=>`${i+1}番目 ${(n*100).toFixed(2)}%`).join(" / "));
 line("理論値からの最大乖離",(dev*100).toFixed(2)+"% "+(dev<0.02?"✅ 均等":"⚠️ 要確認"));
 const shuffleByChoiceCount={};
 [2,4].forEach(len=>{const pool=BANK.filter(q=>q.choices.length===len),counts=new Array(len).fill(0);
   for(let i=0;i<N;i++){const q=pool[Math.floor(Math.random()*pool.length)],o=fyShuffle(len);counts[o.indexOf(q.correctIndex)]++;}
   shuffleByChoiceCount[len]=counts.map(x=>x/N);line(`${len}択だけの表示分布`,counts.map((x,i)=>`${i+1}番目 ${(x/N*100).toFixed(2)}%`).join(" / "));});
 // 不整合チェック
 const errs={問題文欠落:[],選択肢欠落:[],正解番号不正:[],重複ID:[],重複問題文:[],完全一致選択肢セット:[],
   空の解説:[],空の小学生解説:[],空の誤答理由:[],存在しない補講ID:[],存在しない類題ID:[]};
 const ids={},qt={},cs={};
 BANK.forEach(q=>{
  if(!String(q.question||q.q||"").trim())errs.問題文欠落.push(q.id);
  if(!Array.isArray(q.choices)||![2,4].includes(q.choices.length)||q.choices.some(c=>!c||!String(c.text||"").trim()))errs.選択肢欠落.push(q.id);
  if(!(Number.isInteger(q.correctIndex)&&q.correctIndex>=0&&q.correctIndex<q.choices.length))errs.正解番号不正.push(q.id);
  if(ids[q.id])errs.重複ID.push(q.id); ids[q.id]=1;
  const t=norm(q.question||q.q); if(t){if(qt[t])errs.重複問題文.push(q.id+"≒"+qt[t]);qt[t]=q.id;}
  const sg=(q.choices||[]).map(c=>norm(c.text)).sort().join("|");
  if(sg&&q.bank!=="drill"){if(cs[sg])errs.完全一致選択肢セット.push(q.id+"≒"+cs[sg]);cs[sg]=q.id;}
  if(!String(q.explanation||"").trim())errs.空の解説.push(q.id);
  if(!String(q.kidExplanation||"").trim())errs.空の小学生解説.push(q.id);
  (q.choices||[]).forEach((c,i)=>{ if(i===q.correctIndex)return;

function applyMastery(t,ctx){
  let d=0;
  if(ctx.ok){
    if(ctx.conf==="勘")d=2;
    else if(ctx.gapDays>=7)d=25;
    else if(ctx.gapDays>=1)d=25;
    else if(ctx.isSimilar)d=20;
    else if(ctx.firstSeen)d=20;
    else d=Math.min(5,3);
    if(ctx.conf==="自信あり"&&ctx.conf!=="勘")d+=5;
    if(ctx.slow)d-=4;
  } else {
    d = ctx.conf==="自信あり" ? -14 : ctx.firstSeen ? -6 : -9;
  }
  t.m=Math.max(0,Math.min(100,t.m+d));
  return d;
}

   let days=base;if(conf==="勘")days=1;else if(conf==="迷った")days=Math.min(days,qs.correctStreak>=3?3:1);

 }

function topicState(k){const t=S.t[k];if(!t||!t.seen)return"未学習";

  if(t.fastWrong>=2)return"読み飛ばし";
  if((tg["数字混同"]||0)+(tg["期間混同"]||0)>=2)return"数字暗記不足";
  if((tg["例外見落とし"]||0)>=2)return"例外条件の見落とし";
  if((tg["制度混同"]||0)+(tg["前後逆転"]||0)+(tg["原則例外逆転"]||0)>=2)return"混同";
  if(t.first.n>=2&&t.first.ok/t.first.n<0.4)return"知識不足";

function weakScore(k){const t=S.t[k];if(!t||t.seen===0)return-1;
  const fw=t.first.n?1-t.first.ok/t.first.n:0, cw=t.conf.n?t.confWrong/Math.max(1,t.conf.n):0;
  const sw=t.sim.n?1-t.sim.ok/t.sim.n:0, rec=t.recent.slice(-5).filter(x=>!x).length/5;
  const over=dueOver(k)?1:0, forget=t.last?Math.min(1,daysBetween(t.last,today())/14):0;

  const left=S.examDate?Math.max(0,Math.min(1,1-daysBetween(today(),S.examDate)/365)):.5;
  return Math.round((fw*30+cw*25+sw*20+rec*15+over*20+forget*12+imp*10+left*5)*(1-t.m/160));}

function pickQuestion(opt){opt=opt||{};
  const cand=LEARN.filter(q=>{
    if(opt.topic&&q.topic!==opt.topic)return false;
    if(opt.category&&q.category!==opt.category)return false;
    if(opt.minDifficulty&&q.difficulty<opt.minDifficulty)return false;
    if(opt.drill&&q.bank!=="drill")return false;
    if(opt.core&&q.bank==="drill")return false;
    if(opt.excludeIntro&&q.questionType==="超入門")return false;
    if(opt.exclude&&opt.exclude.includes(q.id))return false;
    if(S.recent.includes(q.id))return false;
    return true;});
  if(!cand.length)return null;
  const recentTopics=S.recent.slice(-5).map(id=>BYID[id]&&BYID[id].topic);
  const tg=tagCount(null,40);
  const scored=cand.map(q=>{
    let s=0;const qs=S.q[q.id],t=S.t[q.topic];
    if(qs&&qs.due&&qs.due<=today())s+=50;
    if(qs&&qs.lastOk===false&&qs.conf[qs.conf.length-1]==="自信あり")s+=45;
    const tags=q.choices.flatMap(c=>c.errorTags);
    if(tags.some(x=>(tg[x]||0)>=2))s+=40;
    if(q.isSimilar&&qs&&qs.lastOk===false)s+=35;
    if(q.questionType==="本試験形式")s+=25;
    if(q.bank==="drill")s+=opt.drill?36:-8;
    if(q.frequency)s+=q.frequency*6;
    if(opt.theme&&q.topic===opt.theme)s+=20;
    if(!t||t.seen===0){s+= q.difficulty<=1?15:5;}
    if(qs&&qs.lastAt===today())s-=100;
    if(recentTopics.includes(q.topic))s-=20;
    if(t&&t.m>=85)s-=30;
    // 弱点タイプ別の優先
    const st=t?topicState(q.topic):"未学習";
    if(st==="数字暗記不足"&&/数字|期間/.test(q.subTopic+q.questionType))s+=20;
    if(st==="混同"&&(q.visual&&q.visual.type==="table"))s+=18;
    if(st==="読み飛ばし")s+= q.expectedTimeSec<=40?15:-10;
    if(st==="問題暗記")s+= q.isSimilar?25:(q.questionType==="本試験形式"?15:0);
    if(S.exLevel<=1)s+= q.difficulty<=1?12:-6;
    if(S.exLevel>=3)s+= q.difficulty>=2?8:-8;
    return{q,s:s+Math.random()*6};});
  scored.sort((a,b)=>b.s-a.s);
  return scored[0].q;
}

function buildMenu(){
  const old=normalizeMenu(S.menu);if(old)return old;
  const n=menuSize(),items=[],used=new Set(),concepts=new Set(),drillCap=Math.max(1,Math.round(n/3));
  let drills=0;
  const source=LEARN.filter(q=>!(S.experience==="none"&&q.difficulty>=4)).slice().sort((a,b)=>missionPriority(b)-missionPriority(a));
  const take=q=>{
    if(!q||used.has(q.id)||items.length>=n)return false;
    const concept=q.derivedFrom||q.id;if(concepts.has(concept))return false;
    if(q.bank==="drill"&&drills>=drillCap)return false;
    used.add(q.id);concepts.add(concept);if(q.bank==="drill")drills++;
    items.push({t:missionQuestionType(q),id:q.id,kind:q.bank==="drill"?"drill":"core"});return true;
  };
  // 最優先群：前回誤答・復習期限・模試から指定された論点
  const focus=S.nextFocus&&L[S.nextFocus]?S.nextFocus:null;
  source.filter(q=>(S.q[q.id]&&S.q[q.id].lastOk===false)||(S.q[q.id]&&S.q[q.id].due&&S.q[q.id].due<=today())||(focus&&q.topic===focus))
    .slice(0,Math.max(3,Math.ceil(n*.45))).forEach(take);
  source.forEach(take);
  // 概念重複制限で足りない場合だけ制限を解除して確実に指定問数を作る
  if(items.length<n)source.forEach(q=>{if(!used.has(q.id)&&items.length<n&&(q.bank!=="drill"||drills<drillCap+2)){
    used.add(q.id);if(q.bank==="drill")drills++;items.push({t:missionQuestionType(q),id:q.id,kind:q.bank==="drill"?"drill":"core"});}});
  S.nextFocus=null;
  S.menu={version:SAVE_VERSION,date:today(),target:n,
    items:items.slice(0,n).map((x,i)=>Object.assign(x,{key:`${today()}:${i}:${x.id}`,done:false})),done:0};
  save();return S.menu;
}

function lessonSteps(k){const l=L[k],lv=S.exLevel,st=[];
 const pri=Object.values(Q).find(q=>q.t===k&&!q.sim);
 if(lv<=2){st.push({b:"cheer",h:"日常の例で",t:l.ex});st.push({b:"think",h:"なぜ必要？",t:l.why});}
 if(lv===1){st.push({b:"happy",h:"かんたんに言うと",t:l.what});}
 if(lv>=2)st.push({b:"happy",h:"正式なルール",t:l.rule});
 if(lv>=3){st.push({b:"think",h:"よくある勘違い",t:l.miss});}
 if(lv>=4&&pri&&pri.cm)st.push({b:"surprise",h:"本試験のひっかけ",t:pri.cm});
 if(pri&&pri.v)st.push({b:"happy",h:"図で整理",t:"",v:pri.v});
 st.push({b:"joy",h:"一行まとめ",t:`<b style="font-size:18px">${l.one}</b>`});
 return st;}
function Lesson(k,i){const steps=lessonSteps(k);i=i||0;
 if(i>=steps.length){const q=pickQuestion({topic:k,core:true})||CORE_LEARN.find(x=>x.topic===k);
   if(!q){toast("この論点の問題を準備中です");return go("learn");}return askQ(q.id);}
 const s=steps[i];
 scr(`<div class="wrap"><div class="mini">${L[k].title}　${i+1}/${steps.length}</div>
  <div class="bar"><i style="width:${(i+1)/steps.length*100}%"></i></div>
  ${say(s.b,s.h)}
  <div class="card main"><p style="font-size:17px">${s.t}</p>${s.v?vis(s.v):""}</div>
  <button class="btn" onclick="Lesson('${k}',${i+1})">${i===steps.length-1?"確認問題へ":"わかった、つぎへ"}</button>
  <div class="rowb">
   <button class="btn ghost sm" onclick="Lesson('${k}',${Math.max(0,i-1)})">もう一度</button>

     return Array.isArray(a)&&a.length===n&&a.every(v=>Number.isInteger(v)&&v>=0&&v<n)&&new Set(a).size===a.length;}));

function examBuild(){
 const used=new Set(); const picked=[];
 const sh=a=>{a=a.slice();for(let j=a.length-1;j>0;j--){const r=Math.floor(Math.random()*(j+1));const t=a[j];a[j]=a[r];a[r]=t;}return a;};
 const past=new Set(S.examUsed||[]);            // 過去の模試で出した問題は優先的に避ける
 for(const [cat,n] of EXAM_PLAN){
   // 未出題を最優先。バンク種別より「前回と重ならない」ことを優先して実力判定を守る。
   const tiers=[
     MOCKQ.filter(q=>q.category===cat&&!past.has(q.id)),
     CORE_LEARN.filter(q=>q.category===cat&&q.mockEligible&&!past.has(q.id)),
     CORE_LEARN.filter(q=>q.category===cat&&!past.has(q.id)&&q.questionType!=="超入門"&&!(S.q[q.id]&&S.q[q.id].seen)),
     MOCKQ.filter(q=>q.category===cat),
     CORE_LEARN.filter(q=>q.category===cat&&q.mockEligible)];
   for(const tier of tiers){
     for(const q of sh(tier)){ if(picked.filter(x=>x.category===cat).length>=n)break;
       if(used.has(q.id))continue; used.add(q.id); picked.push(q); }
     if(picked.filter(x=>x.category===cat).length>=n)break;
   }
 }
 return picked;}

let mk=null;
function mockStart(i){i=Number(i)||0;if(i>0&&!hasPremium())return PremiumGate("quickmock");const P=mockPool(),n=Math.min(30,P.length);
 const by=c=>P.filter(q=>q.category===c);
 const hash=s=>{let h=2166136261;for(let x=0;x<s.length;x++){h^=s.charCodeAt(x);h=Math.imul(h,16777619);}return h>>>0;};
 const sh=(a,salt)=>a.slice().sort((x,y)=>hash(`${i}|${salt}|${x.id}`)-hash(`${i}|${salt}|${y.id}`));
 const stable=(a,salt)=>a.slice().sort((x,y)=>hash(`quick-v3|${salt}|${x.id}`)-hash(`quick-v3|${salt}|${y.id}`));
 const take=(cat,count,salt)=>stable(by(cat),salt).slice(i*count,(i+1)*count);
 /* A/B/Cは本当に別セットにする。税その他の候補数に合わせ、各セット12/8/6/4問で重複を避ける。 */
 let qs=[...take("宅建業法",12,1),...take("権利関係",8,2),...take("法令上の制限",6,3),...take("税その他",4,4)];
 const seen=new Set();qs=sh(qs,5).filter(q=>{if(seen.has(q.id))return false;seen.add(q.id);return true;}).slice(0,n);
 mk={i,qs,idx:0,res:[],t0:Date.now()};mq();}
function mq(){if(!mk)return;if(mk.idx>=mk.qs.length)return mockEnd();
 const q=mk.qs[mk.idx];
 askQ(q.id,{mock:true,mockName:`実力チェック セット${["A","B","C"][mk.i]}`,idx:mk.idx,total:mk.qs.length,
  onDone:(ok,sel)=>{mk.res.push({q,ok,sel});mk.idx++;setTimeout(mq,180);}});}
function mockEnd(){if(!mk)return;const run=mk;mk=null;
 const r=run.res,score=r.filter(x=>x.ok).length,total=Math.max(1,run.qs.length),answered=r.length;
 const min=Math.max(1,Math.round((Date.now()-run.t0)/60000));
 const cats={};run.qs.forEach((q,j)=>{const c=cats[q.category]||(cats[q.category]={n:0,o:0});c.n++;if(r[j]&&r[j].ok)c.o++;});
 const answeredCats={};r.forEach(x=>{const c=answeredCats[x.q.category]||(answeredCats[x.q.category]={n:0,o:0});c.n++;if(x.ok)c.o++;});
 const worst=answered>=5?Object.entries(answeredCats).sort((a,b)=>(a[1].o/a[1].n)-(b[1].o/b[1].n))[0]:null;
 const wrongTopics={};r.filter(x=>!x.ok).forEach(x=>wrongTopics[x.q.topic]=(wrongTopics[x.q.topic]||0)+1);
 const wt=Object.entries(wrongTopics).sort((a,b)=>b[1]-a[1]||weakScore(b[0])-weakScore(a[0]))[0]?.[0]||null;
 S.menu=null;if(wt){TS(wt);S.nextFocus=wt;}
 S.mock.push({type:"quick",set:run.i,score,total,answered,at:today(),min,cats});if(S.mock.length>100)S.mock.shift();
 const chest=score/total>=0.7?grantChest("金箱",`quick:${today()}:${run.i}`):""; save();checkAchievements();
 scr(`<div class="wrap">${say(score/total>=0.7?"joy":"think","実力チェックの結果です。")}
  <div class="card"><div class="center" style="font-size:30px;font-weight:900">${score}<span style="font-size:16px"> / ${total}問正解</span></div>
   <div class="center sub">セット${["A","B","C"][run.i]}・所要 ${min}分${answered<total?`・${total-answered}問は未回答`:""}</div>
   <div class="box"><div class="h">分野別</div>${Object.entries(cats).map(([c,v])=>
     `<div style="display:flex;justify-content:space-between"><span>${c}</span><b>${v.o}/${v.n}</b></div>`).join("")}</div>
   ${worst?`<div class="box ng"><div class="h">🎯 次の優先分野</div><b>${worst[0]}</b>${wt?`／次のメニューは「${TOPICNAME(wt)}」から。`:""}</div>`:""}
   ${chest}
   <button class="btn" onclick="go('home')">ホームへ</button>
   <button class="btn ghost sm" onclick="go('learn')">学ぶへ</button></div></div>`);}

   <div class="setting-row"><span>⏳ 復習保護 ×${S.items.tk.review}<small class="sub">　期限を1日延長</small></span><button class="btn ghost sm" style="width:auto;margin:0" onclick="buyTicket('review','coins',180)">🪙180</button></div>
   <div class="setting-row"><span>🛡 連続まもり ×${S.items.tk.guard}<small class="sub">　1日の空白だけ保護</small></span><button class="btn ghost sm" style="width:auto;margin:0" onclick="buyTicket('guard','crystals',5)">💎5</button></div>

  <h2>実績</h2><div class="card">${ach.map(id=>{const a=ACHIEVEMENTS[id],on=S.achievements.includes(id);
    return `<div class="fine-weak" style="${on?"":"background:#f7f9fc"}"><div><strong>${on?a.icon:"🔒"} ${a.name}</strong><span class="sub">${a.desc}</span></div><span class="chip ${on?"gd":"gy"}">${on?"解除":"未解除"}</span></div>`;}).join("")}</div>
  <h2>学習設定</h2><div class="card">
   <div class="setting-row"><span><b>効果音</b><small class="sub">　正誤・レベルアップ</small></span><button class="toggle ${S.settings.sound?"on":"off"}" onclick="toggleSetting('sound')">${S.settings.sound?"ON":"OFF"}</button></div>
   <div class="setting-row"><span><b>触覚フィードバック</b><small class="sub">　対応端末のみ</small></span><button class="toggle ${S.settings.haptics?"on":"off"}" onclick="toggleSetting('haptics')">${S.settings.haptics?"ON":"OFF"}</button></div>
   <div class="setting-row"><span><b>動きを減らす</b><small class="sub">　紙吹雪・画面移動を抑制</small></span><button class="toggle ${S.settings.reducedMotion?"on":"off"}" onclick="toggleSetting('reducedMotion')">${S.settings.reducedMotion?"ON":"OFF"}</button></div>
   <div class="mini" style="margin-top:12px">説明のくわしさ</div>
   ${[1,2,3,4].map(n=>`<button class="opt ${S.exLevel===n?"sel":""} ${n>2&&!hasPremium()?"locked-opt":""}" style="width:100%;text-align:left" onclick="setExplainLevelSetting(${n})">Lv.${n}　${["","日常例中心","日常例＋正式ルール","要点とひっかけ","例外と横断整理"][n]}</button>`).join("")}
   <div class="mini" style="margin-top:12px">今日のミッション問題数 ${hasPremium()?'':'<span class="chip gy">FREEは5問まで</span>'}</div>
   <div class="setting-grid">${[[5,"軽め"],[15,"標準"],[30,"本気"]].map(([v,n])=>`<button class="opt ${S.dailyTarget===v?"sel":""} ${v>5&&!hasPremium()?"locked-opt":""}" onclick="setDailyTargetSetting(${v})"><b>${n}</b><br>${v}問</button>`).join("")}</div>
   <label for="dailyTargetInput" class="mini" style="display:block;margin-top:10px">自分で設定（1〜50問）${hasPremium()?"":"・6問以上はPREMIUM"}</label>
   <div class="rowb"><input id="dailyTargetInput" class="number-input" type="number" inputmode="numeric" min="1" max="50" value="${Math.min(S.dailyTarget,hasPremium()?50:5)}">
    <button class="btn sm blue" onclick="setDailyTargetFromInput()">変更</button></div>
   <div class="mini" style="margin-top:12px">重点分野</div>
   ${["宅建業法","権利関係","法令上の制限","税その他"].map(v=>`<button class="chip ${S.weakArea===v?"ng":"gy"}" onclick="setWeakSetting('${v}')">${v}</button>`).join("")}
   <button class="chip ${S.weakArea?"gy":"ok"}" onclick="setWeakSetting(null)">自動診断に任せる</button>
   <div class="mini" style="margin-top:12px">試験日</div><input id="ed2" class="number-input" type="date" aria-label="試験日" value="${S.examDate||""}">
   <button class="btn sm blue" onclick="saveStudyProfile()">学習プランを保存</button>
  </div>
  <div class="card info"><div class="mini">データの内訳</div>
   <div class="sub"><b>アプリ内演習 ${BANK.length}問</b><br>解説付き四択 ${CORE_BANK.length}問（学習${CORE_LEARN.length}・模試候補${MOCKQ.length}）＋四択を選択肢単位に分解した○×演習 ${DRILLS.length}問。</div>
   <div class="sub" style="margin-top:7px"><b>公式過去問回答トレーニング ${PAST_TOTAL}問</b><br>${PAST_EXAMS.length}回分の正解番号と回答履歴を管理。問題本文は公式PDFで閲覧します（回答済み${ps.answered}問）。</div>
   <div class="sub" style="margin-top:7px">アプリ内演習の合計は「四択＋選択肢分解○×」の重複しない問題ID数です。カテゴリー別：${Object.entries(CATEGORY_COUNTS).map(([c,n])=>`${c} ${n}問`).join("／")}。</div>
   <div class="sub">起動時検査：出題対象外 ${QUARANTINED_CORE.length}問・警告 ${CORE_WARNING.length}件・類題参照エラー ${BADREF.length}件。</div></div>
  <div class="card"><div class="mini">バックアップとプラン</div>
   <div class="backup-note">学習履歴はこの端末に保存されています。機種変更やブラウザデータ削除に備えて、定期的にバックアップしてください。App Storeの購入権利はバックアップには含めません。</div>
   <input class="file-pick" id="backupFileInput" type="file" accept="application/json,.json" onchange="importBackupFile(this.files&&this.files[0])">
   <div class="data-actions"><button class="btn blue sm" onclick="downloadBackup()">学習データを書き出す</button><button class="btn ghost sm" onclick="chooseBackupFile()">バックアップを復元</button></div>
   <button class="btn sm" onclick="PlanScreen()">${hasPremium()?"プレミアム内容を確認":"プレミアムプランを見る"}</button>

load();rolloverDay();
setTimeout(()=>billingPost("ready",{products:Object.values(PREMIUM_PRODUCTS).map(x=>x.id)}),0);
if(S.onboarded){go("home");}else{
  // 初回：出会い → 設定 → チュートリアル
  Onb(1);
}
/* チュートリアル完了処理（in-001 → in-011 → 宝箱） */
const _rf=renderFeedback;
renderFeedback=function(q,i,ok,x){
  if(!S.onboarded&&q.id==="in-001"){
    let h=`<div class="card">${say(ok?"joy":"think",ok?"正解！いきなりすごい！":"だいじょうぶ、いっしょに考えよう。")}`;
    if(ok)fx("GREAT","#7be3a8");
    h+=`<div class="box ok"><div class="h">✅ 答え</div><b>${q.explanation}</b></div>
      <div class="box ai"><div class="h">🍰 小学生でも分かる説明</div>${q.kidExplanation}</div>
      <div class="box gd"><div class="h">📘 ここではじめて用語が出ます</div>${q.formalRule}</div>
      <button class="btn" onclick="askQ('in-011',{tutorial:true})">似た問題で確かめる</button></div>`;
    $("#fb").innerHTML=h;$("#fb").scrollIntoView({behavior:S.settings.reducedMotion?"auto":"smooth"});return;}
  if(!S.onboarded&&q.id==="in-011"){
    if(ok)fx("PERFECT","#ffd479");
    S.onboarded=true;S.crystals+=2;save();
    let h=`<div class="card">${say("joy",ok?"できた！これが「分かる→解ける」の流れだよ。":"惜しい！でも、もう仕組みは分かったはず。")}
      <div class="box ok"><div class="h">✅ 答え</div><b>${q.explanation}</b></div>
      <div class="box ai">${q.kidExplanation}</div>
      <div class="box gd"><div class="h">📘 正式には</div>${q.formalRule}</div>
      ${grantChest("銀箱","tutorial")}</div>`;
    $("#fb").innerHTML=h;$("#fb").scrollIntoView({behavior:S.settings.reducedMotion?"auto":"smooth"});
    setTimeout(()=>{evolveBuddy();},900);
    setTimeout(()=>{const d=document.createElement("div");d.className="wrap";
      d.innerHTML=`<button class="btn giant" onclick="startDiag()">つづけて、レベル別の診断へ</button>
      <div class="sub center">ここから、あなたに合う難しさを測ります（分析中は弱点を断定しません）</div>`;
      V().appendChild(d);},1200);
    return;}
  _rf(q,i,ok,x);
};
function startDiag(){const lvq=S.exLevel<=1?["in-002","in-003","in-004"]:["menkyo-1","dairi-1","tetsuke-1"];
  diagQ(lvq,0);}
function diagQ(list,i){if(i>=list.length){S.menu=null;go("home");
  toast("あなた専用の今日のメニューを作りました");return;}
  askQ(list[i],{});
  const chain=()=>{const b=document.querySelector("#fb .btn");if(b){b.textContent=i<list.length-1?"つぎの診断問題へ":"結果を見る";
    b.onclick=()=>diagQ(list,i+1);}};
  const ob=new MutationObserver(()=>{if(document.querySelector("#fb .btn")){chain();ob.disconnect();}});
  ob.observe(document.querySelector("#fb"),{childList:true});}
window.onerror=function(message,source,line,column,error){
 console.error("宅建QUEST runtime error",{message,source,line,column,error});return false;};
window.addEventListener("pagehide",()=>{if(ex&&!ex.done)persistExamDraft(!!ex.paused);});
</script>
