<script>
const POOL = [{"id": "g-gyo-001", "cat": "宅建業法", "topic": "免許制度", "diff": 1, "q": "宅地建物取引業の免許の有効期間に関する次の記述のうち、正しいものはどれか。", "c": ["免許の有効期間は3年である。", "免許の有効期間は10年である。", "免許の有効期間は5年であり、更新を受けることができる。", "免許に有効期間の定めはなく、一度受ければ無期限に有効である。"], "a": 2, "ex": "宅建業の免許の有効期間は5年であり、引き続き業を営むには有効期間満了前に更新の申請をして更新を受ける必要がある。", "kid": "免許は5年で期限切れになるから、続けたいなら期限が来る前に更新するんだよ。"}, {"id": "g-gyo-002", "cat": "宅建業法", "topic": "宅地建物取引士", "diff": 2, "q": "事務所に置くべき専任の宅地建物取引士の数に関する次の記述のうち、正しいものはどれか。", "c": ["事務所ごとに1名置けば、業務従事者の人数にかかわらず足りる。", "業務に従事する者10名につき1名以上置けばよい。", "業務に従事する者5名につき1名以上の割合で置かなければならない。", "専任の宅地建物取引士を置く義務は案内所のみに課される。"], "a": 2, "ex": "事務所には、業務に従事する者5名に1名以上の割合で成年者である専任の宅地建物取引士を置かなければならない。", "kid": "お店で働く人5人につき、専門の資格者を1人は置きなさい、というルールだよ。"}, {"id": "g-gyo-003", "cat": "宅建業法", "topic": "重要事項説明", "diff": 2, "q": "重要事項の説明を行う者と時期に関する次の記述のうち、正しいものはどれか。", "c": ["重要事項の説明は契約成立後遅滞なく行えばよい。", "重要事項の説明は専任の宅地建物取引士でなければ行えない。", "重要事項の説明は宅地建物取引士が、宅地建物取引士証を提示して行わなければならない。", "重要事項説明書には代表者の記名があれば宅地建物取引士の記名は不要である。"], "a": 2, "ex": "重要事項の説明は契約成立前に、宅地建物取引士が宅地建物取引士証を相手方に提示して行う必要がある。専任である必要はないが、書面には宅建士の記名が必要。", "kid": "契約する前に、資格証を見せた資格者が大事な点を説明しないといけないんだ。"}, {"id": "g-gyo-004", "cat": "宅建業法", "topic": "35条37条比較", "diff": 3, "q": "35条書面（重要事項説明書）と37条書面（契約書面）の違いに関する次の記述のうち、正しいものはどれか。", "c": ["いずれも契約成立後に交付する書面である。", "いずれも交付の相手方は買主・借主に限られる。", "35条書面は契約成立前、37条書面は契約成立後遅滞なく交付する。", "37条書面には宅地建物取引士の記名は不要である。"], "a": 2, "ex": "35条書面は契約が成立するまでの間に交付・説明し、37条書面は契約成立後遅滞なく交付する。いずれも宅建士の記名が必要で、37条書面は売主・買主双方等に交付する。", "kid": "35条は契約の前、37条は契約のあと。タイミングが逆と覚えると混乱しないよ。"}, {"id": "g-gyo-005", "cat": "宅建業法", "topic": "37条書面", "diff": 2, "q": "37条書面の記載事項に関する次の記述のうち、正しいものはどれか。", "c": ["代金の額は任意的記載事項であり記載しなくてもよい。", "引渡しの時期は記載する必要がない。", "代金の額・支払時期・支払方法は必ず記載しなければならない。", "37条書面には当事者の氏名を記載する必要はない。"], "a": 2, "ex": "37条書面では、代金・交換差金・借賃の額、支払時期、支払方法は必要的記載事項であり、必ず記載しなければならない。引渡時期・移転登記時期も必要的記載事項。", "kid": "契約書には「いくら・いつ・どうやって払うか」は必ず書かなきゃダメなんだ。"}, {"id": "g-gyo-006", "cat": "宅建業法", "topic": "媒介契約", "diff": 2, "q": "専任媒介契約（宅建QUESTオリジナル演習006）に関する次の記述として、正しいものはどれか。", "c": ["有効期間は6か月以内であればよい。", "依頼者は他の業者に重ねて依頼できるが、自ら発見した相手方と契約することはできない。", "有効期間は3か月を超えることができず、これより長い期間を定めても3か月に短縮される。", "指定流通機構への登録義務はない。"], "a": 2, "ex": "専任媒介契約の有効期間は3か月が上限で、これを超える定めは3か月に短縮される。依頼者は他業者へ重ねて依頼できないが、専属専任でなければ自己発見取引は可能。", "kid": "専任は最長3か月。長く書いても自動で3か月になるよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-gyo-007", "cat": "宅建業法", "topic": "媒介契約", "diff": 3, "q": "専属専任媒介契約における業務報告と登録に関する次の記述のうち、正しいものはどれか。", "c": ["業務処理状況の報告は2週間に1回以上でよい。", "指定流通機構への登録は媒介契約締結日から7日以内でよい。", "業務処理状況の報告は1週間に1回以上行い、指定流通機構へは5日以内に登録する。", "専属専任では依頼者が自ら発見した相手方と直接契約できる。"], "a": 2, "ex": "専属専任媒介では業務報告は1週間に1回以上、指定流通機構への登録は休業日を除き5日以内。依頼者は自己発見取引をしても業者を通す必要がある。", "kid": "専属専任はしばりが強い分、報告はこまめ（週1回）、登録も早め（5日）なんだ。"}, {"id": "g-gyo-008", "cat": "宅建業法", "topic": "報酬額", "diff": 3, "q": "宅地建物取引業者が売買の媒介を行った場合の報酬額の上限（消費税を考慮しない本体価格ベース）に関する次の記述のうち、正しいものはどれか。代金は400万円を超えるものとする。", "c": ["代金額の5％が上限である。", "代金額の4％＋2万円が上限である。", "代金額の3％＋6万円が上限である。", "上限額の定めはなく当事者の合意による。"], "a": 2, "ex": "400万円超の部分は3％で計算され、速算式では『代金×3％＋6万円』が媒介報酬の上限（別途消費税）。売主・買主双方から受ける場合も各自この上限による。", "kid": "高い物件の仲介手数料は『3％＋6万円』が上限、と覚える速算式があるよ。"}, {"id": "g-gyo-009", "cat": "宅建業法", "topic": "クーリングオフ", "diff": 3, "q": "宅地建物取引業者が自ら売主となる場合のクーリング・オフに関する次の記述のうち、正しいものはどれか。買主は宅建業者ではない。", "c": ["買主は口頭で申し出ればいつでも解除できる。", "クーリング・オフの効力は書面が売主に到達した時に生じる。", "クーリング・オフができる旨を書面で告げられた日から8日を経過すると解除できなくなる。", "買主が宅地建物の引渡しを受けても代金を支払っていなければ解除できる。"], "a": 2, "ex": "事務所等以外の場所での買受けの申込みについては、クーリング・オフできる旨を書面で告げられた日から8日以内に書面で解除でき、書面は発した時に効力を生じる（発信主義）。引渡しかつ代金全額支払があると解除不可。", "kid": "『8日以内・書面で』が基本。書面を出した瞬間にキャンセル成立だよ。"}, {"id": "g-gyo-010", "cat": "宅建業法", "topic": "手付金の制限", "diff": 3, "q": "宅地建物取引業者が自ら売主となる完成物件の売買における手付金等の保全措置に関する次の記述のうち、正しいものはどれか。買主は宅建業者ではない。", "c": ["代金の5％を超える手付金等を受領する場合に保全措置が必要となる。", "手付金等の額にかかわらず常に保全措置は不要である。", "代金の10％または1,000万円を超える手付金等を受領するときは、原則として保全措置を講じなければならない。", "保全措置を講じなくても、買主の承諾があれば手付金等を受領できる。"], "a": 2, "ex": "完成物件では代金の10％または1,000万円を超える手付金等を受領するとき保全措置が必要。未完成物件は5％または1,000万円超が基準。基準以下でも保全した方が安全だが義務ではない。", "kid": "できあがった建物は『10％か1000万円』を超えたら保証をつけなさい、というルールだよ。"}, {"id": "g-gyo-011", "cat": "宅建業法", "topic": "手付金の制限", "diff": 2, "q": "宅地建物取引業者が自ら売主となる売買契約における手付に関する次の記述のうち、正しいものはどれか。買主は宅建業者ではない。", "c": ["売主は代金の3割までの手付を受領できる。", "手付は常に違約手付とみなされる。", "手付の額は代金の2割を超えてはならず、受領した手付は解約手付とみなされる。", "買主は手付を放棄しても契約を解除できない。"], "a": 2, "ex": "業者が自ら売主となる場合、手付は代金の2割（20％）を超えて受領できず、その手付は解約手付とみなされる。買主は手付放棄、売主は倍返しで解除できる（相手方が履行に着手するまで）。", "kid": "手付は代金の2割まで。多くもらいすぎるのは禁止だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-gyo-012", "cat": "宅建業法", "topic": "8種制限総合", "diff": 2, "q": "宅地建物取引業者が自ら売主となる契約における損害賠償額の予定等に関する次の記述のうち、正しいものはどれか。買主は宅建業者ではない。", "c": ["損害賠償額の予定は代金の3割まで有効である。", "損害賠償額の予定と違約金の合計が代金の5割を超えなければよい。", "損害賠償額の予定と違約金の合計が代金の2割を超える定めは、超える部分が無効となる。", "損害賠償額の予定を定めること自体が禁止されている。"], "a": 2, "ex": "業者が自ら売主となる場合、損害賠償額の予定と違約金の合計が代金の20％を超える定めは、超過部分が無効となる（契約全体が無効になるわけではない）。", "kid": "『違約金＋予定額』は代金の2割まで。超えた分だけ無効になるんだ。"}, {"id": "g-gyo-013", "cat": "宅建業法", "topic": "担保責任の特約制限", "diff": 3, "q": "宅地建物取引業者が自ら売主となる場合の契約不適合責任（担保責任）の特約に関する次の記述のうち、正しいものはどれか。買主は宅建業者ではない。", "c": ["担保責任を一切負わない旨の特約も有効である。", "通知期間を引渡しの日から1年とする特約は有効である。", "通知期間を引渡しの日から2年以上とする特約を除き、民法の規定より買主に不利な特約は無効となる。", "民法より買主に不利な特約であっても、買主の承諾があれば有効となる。"], "a": 2, "ex": "業者が自ら売主となる場合、契約不適合の通知期間を『引渡しから2年以上』とする特約は許されるが、それ以外で民法より買主に不利な特約は無効となる。", "kid": "『引き渡しから2年以上』ならOK。それより買主に不利な約束は無効だよ。"}, {"id": "g-gyo-014", "cat": "宅建業法", "topic": "自己所有に属しない物件", "diff": 3, "q": "宅地建物取引業者が自ら売主となり、他人所有の物件を売買する契約に関する次の記述のうち、正しいものはどれか。買主は宅建業者ではない。", "c": ["他人物売買は例外なく全面的に禁止される。", "所有者との間で取得契約があっても、締結してはならない。", "業者が物件を取得する契約（予約を含む）を締結しているなど取得が確実な場合は、売買契約を締結できる。", "未完成物件については保全措置を講じれば常に締結できる。"], "a": 2, "ex": "自己の所有に属しない物件でも、業者が取得する契約や予約を締結しているなど取得が明らかな場合は自ら売主として売買契約を締結できる。停止条件付取得契約のみでは原則不可。", "kid": "自分のものになる契約ができていれば、まだ手元にない物件でも売っていいんだ。"}, {"id": "g-gyo-015", "cat": "宅建業法", "topic": "営業保証金", "diff": 2, "q": "営業保証金に関する次の記述のうち、正しいものはどれか。", "c": ["主たる事務所につき500万円を供託する。", "従たる事務所1か所につき1,000万円を供託する。", "主たる事務所につき1,000万円、従たる事務所1か所につき500万円を供託する。", "営業保証金は金銭でのみ供託でき、有価証券では供託できない。"], "a": 2, "ex": "営業保証金は主たる事務所1,000万円、従たる事務所1か所につき500万円を供託する。金銭のほか一定の有価証券でも供託できる。供託後に届け出てから事業を開始する。", "kid": "本店は1000万円、支店は1か所ごとに500万円を預けるんだ。"}, {"id": "g-gyo-016", "cat": "宅建業法", "topic": "保証協会", "diff": 3, "q": "宅地建物取引業保証協会の社員となる場合の弁済業務保証金分担金に関する次の記述のうち、正しいものはどれか。", "c": ["主たる事務所につき1,000万円を納付する。", "従たる事務所1か所につき500万円を納付する。", "主たる事務所につき60万円、従たる事務所1か所につき30万円を納付する。", "分担金は営業開始後1か月以内に納付すればよい。"], "a": 2, "ex": "保証協会の社員となろうとする者は、加入日までに主たる事務所60万円・従たる事務所1か所30万円の弁済業務保証金分担金を金銭で協会に納付する。", "kid": "協会に入れば、本店60万・支店30万で済む（保証金より安い）んだ。"}, {"id": "g-gyo-017", "cat": "宅建業法", "topic": "広告規制", "diff": 2, "q": "宅地建物取引業者の広告（宅建QUESTオリジナル演習017）に関する次の記述として、正しいものはどれか。", "c": ["誇大広告は、実際に損害が発生しなければ規制の対象とならない。", "未完成物件は、開発許可や建築確認の前でも広告を開始できる。", "未完成物件の広告は、原則として開発許可・建築確認等を受けた後でなければ開始できない。", "取引態様の別は、注文を受けたときに明示すれば足り、広告時の明示は不要である。"], "a": 2, "ex": "未完成物件の広告開始時期は、開発許可・建築確認等の処分後に制限される。誇大広告は損害の有無を問わず禁止され、取引態様の別は広告時にも明示が必要。", "kid": "できていない物件の広告は、許可や確認が下りてからじゃないと出せないよ。"}, {"id": "g-gyo-018", "cat": "宅建業法", "topic": "業務規制と監督処分", "diff": 2, "q": "宅地建物取引業者の業務に関する次の記述のうち、正しいものはどれか。", "c": ["手付金を貸し付けて契約締結を誘引することは、金額が少額であれば許される。", "契約を締結するかどうかについて断定的判断を提供してもよい。", "手付について貸付けその他信用の供与をして契約締結を誘引する行為は禁止されている。", "勧誘に先立って業者名を告げる必要はない。"], "a": 2, "ex": "手付の貸付け等信用供与による契約誘引は禁止。断定的判断の提供や、勧誘目的・業者名を告げない勧誘も禁止されている。", "kid": "『手付を立て替えるから契約して』はダメ。お金でつって契約させちゃいけないんだ。"}, {"id": "g-gyo-019", "cat": "宅建業法", "topic": "宅地建物取引士", "diff": 2, "q": "宅地建物取引士証（宅建QUESTオリジナル演習019）に関する次の記述として、正しいものはどれか。", "c": ["宅地建物取引士証の有効期間は10年である。", "重要事項説明の際、相手方から請求がなければ提示しなくてよい。", "宅地建物取引士証の有効期間は5年であり、更新時には都道府県知事指定の法定講習を受講する。", "登録が消除されても宅地建物取引士証は返納しなくてよい。"], "a": 2, "ex": "宅建士証の有効期間は5年で、更新には法定講習の受講が必要。重要事項説明時は請求がなくても提示義務があり、登録消除・失効時は返納義務がある。", "kid": "資格証は5年ごとに更新。説明のときは聞かれなくても見せるんだ。"}, {"id": "g-gyo-020", "cat": "宅建業法", "topic": "業務規制と監督処分", "diff": 3, "q": "宅地建物取引業者が一団の宅地建物の分譲を行うために設置する案内所に関する次の記述のうち、正しいものはどれか。", "c": ["契約を締結せず申込みも受けない案内所にも専任の宅地建物取引士を置く必要がある。", "案内所には標識を掲示する必要はない。", "契約の申込みを受ける案内所には、少なくとも1名の専任の宅地建物取引士を置き、標識を掲示しなければならない。", "案内所の届出は不要である。"], "a": 2, "ex": "契約・申込みを受ける案内所には専任の宅建士を1名以上置き、標識の掲示と業務開始10日前までの届出が必要。申込み等を受けない案内所は標識のみでよい。", "kid": "申込みを受ける案内所は、資格者1人＋看板＋届出が必要だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-gyo-021", "cat": "宅建業法", "topic": "重要事項説明", "diff": 3, "q": "重要事項説明の対象に関する次の記述のうち、正しいものはどれか。", "c": ["都市計画法・建築基準法等の法令上の制限は説明事項に含まれない。", "私道に関する負担については売買・貸借を問わず説明不要である。", "飲用水・電気・ガスの供給や排水施設の整備状況は重要事項として説明しなければならない。", "代金の額は重要事項説明書に必ず記載する。"], "a": 2, "ex": "ライフライン（飲用水・電気・ガス・排水）の整備状況は35条の説明事項。法令上の制限も説明対象。代金の額は37条の記載事項であり35条の必須事項ではない。", "kid": "水道・電気・ガスがちゃんと使えるかは、契約前に説明すべき大事な点だよ。"}, {"id": "g-gyo-022", "cat": "宅建業法", "topic": "業務規制と監督処分", "diff": 3, "q": "宅地建物取引業者に対する監督処分（宅建QUESTオリジナル演習022）に関する次の記述として、正しいものはどれか。", "c": ["業務停止処分の期間は最長6か月である。", "指示処分は国土交通大臣のみが行える。", "業務停止処分は1年以内の期間を定めて行われ、情状が特に重いときは免許を取り消される。", "免許取消処分を受けても、直ちに再度免許を受けることができる。"], "a": 2, "ex": "業務停止は1年以内の期間を定めて命じられ、情状が特に重い場合等は免許取消となる。免許取消後は原則5年間免許を受けられない。", "kid": "重い違反だと最長1年の営業停止、もっとひどいと免許取り消しになるんだ。"}, {"id": "g-gyo-023", "cat": "宅建業法", "topic": "業務規制と監督処分", "diff": 2, "q": "宅地建物取引業者の事務所に関する次の記述のうち、正しいものはどれか。", "c": ["従業者名簿は備える必要がない。", "報酬額の掲示義務はない。", "事務所ごとに標識を掲示し、報酬額を掲示し、従業者名簿・帳簿を備えなければならない。", "帳簿は取引の都度作成し、翌日には廃棄してよい。"], "a": 2, "ex": "事務所には標識の掲示、報酬額の掲示、従業者名簿・帳簿の備付けが義務づけられる。帳簿は各事業年度末に閉鎖し、原則5年間（自ら売主の新築住宅は10年間）保存する。", "kid": "事務所には看板・料金表・名簿・帳簿を備えるのがルールだよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-gyo-024", "cat": "宅建業法", "topic": "8種制限総合", "diff": 3, "q": "8種制限（自ら売主制限）の適用に関する次の記述のうち、正しいものはどれか。", "c": ["買主が宅地建物取引業者であっても8種制限は適用される。", "8種制限は媒介・代理で関与する場合にも適用される。", "8種制限は、業者が自ら売主となり、かつ買主が宅地建物取引業者でない場合に適用される。", "8種制限は貸借の代理・媒介にも適用される。"], "a": 2, "ex": "8種制限は『業者が自ら売主』かつ『買主が非業者』の売買にのみ適用される。業者間取引や、業者が媒介・代理として関与するにすぎない場合には適用されない。", "kid": "8種のしばりは『プロが自分で売る×相手が素人』のときだけ効くんだ。"}, {"id": "g-gyo-025", "cat": "宅建業法", "topic": "報酬額", "diff": 3, "q": "宅地建物取引業者が居住用建物の貸借の媒介を行った場合の報酬に関する次の記述のうち、正しいものはどれか（消費税を考慮しない）。", "c": ["貸主・借主双方から借賃の1か月分ずつ受領できる。", "権利金がない場合でも借賃の2か月分まで受領できる。", "依頼者双方から受ける報酬の合計は借賃の1か月分が上限で、居住用建物では原則として双方から半月分ずつとなる。", "報酬の上限に関する規制は貸借には適用されない。"], "a": 2, "ex": "貸借の媒介報酬は依頼者双方合計で借賃1か月分が上限。居住用建物では、媒介依頼時の承諾がない限り、貸主・借主からそれぞれ半月分ずつとなる。", "kid": "賃貸の仲介料は合計で家賃1か月分まで。住居は原則、貸す人・借りる人で半分ずつだよ。"}, {"id": "g-gyo-026", "cat": "宅建業法", "topic": "免許制度", "diff": 2, "q": "宅地建物取引業の免許の要否に関する次の記述のうち、正しいものはどれか。", "c": ["自ら貸主として賃貸を反復継続して行う場合は免許が必要である。", "自己所有地を1区画のみ知人に売る場合でも免許が必要である。", "自ら貸主として建物を賃貸する行為は宅地建物取引業に当たらず、免許は不要である。", "国や地方公共団体から依頼された売買の媒介には免許は不要である。"], "a": 2, "ex": "『自ら貸主』は取引に該当せず免許不要。売買・交換の『自ら・代理・媒介』、貸借の『代理・媒介』を業として行う場合に免許が必要。国等が当事者でも媒介する業者には免許が必要。", "kid": "自分が大家さんになって貸すだけなら、宅建業の免許はいらないんだ。"}, {"id": "g-gyo-027", "cat": "宅建業法", "topic": "免許制度", "diff": 2, "q": "宅地建物取引業者名簿の登載事項の変更の届出に関する次の記述のうち、正しいものはどれか。", "c": ["商号の変更は届け出る必要がない。", "役員の氏名に変更があっても届出は不要である。", "商号・役員・専任の宅地建物取引士の氏名等に変更があったときは、30日以内に変更の届出をしなければならない。", "変更の届出は変更の日から3か月以内に行えばよい。"], "a": 2, "ex": "商号・名称、役員・政令使用人の氏名、専任宅建士の氏名、事務所の名称・所在地等に変更があったときは、30日以内に免許権者へ変更の届出が必要。", "kid": "会社名や役員・専任資格者が変わったら、30日以内に届け出るんだ。"}, {"id": "g-gyo-028", "cat": "宅建業法", "topic": "重要事項説明", "diff": 3, "q": "建物の貸借の媒介における重要事項説明に関する次の記述のうち、正しいものはどれか。", "c": ["台所・浴室等の設備の整備状況は説明しなくてよい。", "契約期間や更新に関する事項は説明対象ではない。", "契約期間・契約の更新・敷金等の精算や、建物の設備の整備状況は説明しなければならない。", "貸借では法令上の制限を一切説明する必要がない。"], "a": 2, "ex": "貸借特有の説明事項として、契約期間・更新、敷金等の金銭の精算、管理の委託先、設備の整備状況等がある。貸借でも一定の法令上の制限は説明が必要。", "kid": "借りるときは、契約期間・更新・敷金の返り方・設備の状況を説明してもらうんだ。"}, {"id": "g-gyo-029", "cat": "宅建業法", "topic": "37条書面", "diff": 3, "q": "37条書面（宅建QUESTオリジナル演習029）に関する次の記述として、正しいものはどれか。", "c": ["契約の解除に関する定めがあっても記載する必要はない。", "危険負担に関する定めは必要的記載事項である。", "契約の解除・損害賠償額の予定・危険負担等について定めがあるときは、その内容を記載しなければならない。", "37条書面は口頭で交付に代えることができる。"], "a": 2, "ex": "契約解除、損害賠償額の予定・違約金、危険負担、瑕疵（契約不適合）担保責任、ローン特約等については、定めがある場合に限り記載する任意的記載事項である。", "kid": "『もし〜なら解除』などの取り決めがあるなら、契約書に書いておくんだ。"}, {"id": "g-gyo-030", "cat": "宅建業法", "topic": "宅地建物取引士", "diff": 2, "q": "宅地建物取引士の登録（宅建QUESTオリジナル演習030）に関する次の記述として、正しいものはどれか。", "c": ["登録には有効期間があり、5年ごとに更新しなければならない。", "登録を受ければ、宅地建物取引士証の交付を受けなくても重要事項説明ができる。", "登録そのものに有効期間はないが、重要事項説明等を行うには宅地建物取引士証の交付を受ける必要がある。", "試験に合格すれば直ちに宅地建物取引士として業務を行える。"], "a": 2, "ex": "資格登録に有効期間はない（更新不要）が、宅建士としての事務を行うには宅建士証の交付が必要で、その士証は5年ごとに更新する。合格・登録・士証交付は別段階。", "kid": "登録自体は一生モノ。でも仕事をするには『資格証』を別にもらう必要があるんだ。"}, {"id": "g-ken-001", "cat": "権利関係", "topic": "意思表示", "diff": 2, "q": "詐欺による意思表示に関する次の記述のうち、正しいものはどれか。", "c": ["詐欺による意思表示は無効である。", "詐欺による取消しは、善意無過失の第三者にも常に対抗できる。", "第三者による詐欺の場合、相手方の善意悪意を問わず取り消せる。", "詐欺による意思表示は取り消すことができるが、取消しは善意無過失の第三者に対抗できない。"], "a": 3, "ex": "詐欺による意思表示は取消し可能。ただし取消し前に現れた善意無過失の第三者には対抗できない。第三者詐欺は相手方が悪意・有過失の場合に取り消せる。", "kid": "だまされた契約は取り消せるけど、事情を知らない第三者には勝てないんだ。"}, {"id": "g-ken-002", "cat": "権利関係", "topic": "意思表示", "diff": 2, "q": "虚偽表示（通謀虚偽表示）に関する次の記述のうち、正しいものはどれか。", "c": ["当事者間でも虚偽表示は有効である。", "虚偽表示は取り消すことができる。", "善意の第三者にも無効を対抗できる。", "通謀虚偽表示は当事者間では無効だが、善意の第三者には無効を対抗できない。"], "a": 3, "ex": "通謀虚偽表示は当事者間では無効。ただし、その無効は善意の第三者に対抗できない（第三者は過失があっても保護されうる）。", "kid": "グルで作った嘘の契約は無効。でも事情を知らない第三者には無効と言えないんだ。"}, {"id": "g-ken-003", "cat": "権利関係", "topic": "意思表示", "diff": 3, "q": "錯誤に関する次の記述のうち、正しいものはどれか。", "c": ["錯誤による意思表示は当然に無効である。", "動機の錯誤はいかなる場合も主張できない。", "表意者に重大な過失があっても常に取り消せる。", "法律行為の目的・取引通念に照らして重要な錯誤があれば取り消すことができるが、原則として表意者に重過失があるときは取り消せない。"], "a": 3, "ex": "重要な錯誤があれば取消し可能（無効ではなく取消し）。表意者に重過失があると原則取り消せない。動機の錯誤は動機が表示され法律行為の内容となった場合に主張しうる。", "kid": "重要な勘違いは取り消せるけど、自分がひどく不注意だと取り消せないよ。"}, {"id": "g-ken-004", "cat": "権利関係", "topic": "制限行為能力者", "diff": 2, "q": "未成年者の法律行為に関する次の記述のうち、正しいものはどれか。", "c": ["未成年者が単独でした契約は常に有効である。", "未成年者の契約は取り消せない。", "単に権利を得る行為も法定代理人の同意が必要である。", "未成年者が法定代理人の同意を得ずにした契約は、原則として取り消すことができる。"], "a": 3, "ex": "未成年者が同意を得ずにした契約は取消し可能。ただし単に権利を得又は義務を免れる行為、処分を許された財産の処分等は取り消せない。", "kid": "未成年が親の同意なくした契約は、原則あとから取り消せるんだ。"}, {"id": "g-ken-005", "cat": "権利関係", "topic": "制限行為能力者", "diff": 3, "q": "成年被後見人（宅建QUESTオリジナル演習005）に関する次の記述として、正しいものはどれか。", "c": ["成年被後見人の行為は取り消すことができない。", "成年後見人の同意があれば有効に契約できる。", "日用品の購入も取り消すことができる。", "成年被後見人の法律行為は日用品の購入等日常生活に関する行為を除き取り消すことができる。"], "a": 3, "ex": "成年被後見人の行為は、日用品の購入その他日常生活に関する行為を除き取り消せる。成年後見人は同意権を持たず、代理して行う（同意があっても本人の行為は取り消しうる）。", "kid": "後見が必要な人の契約は、日常の買い物以外は取り消せるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-ken-006", "cat": "権利関係", "topic": "代理", "diff": 2, "q": "代理（宅建QUESTオリジナル演習006）に関する次の記述として、正しいものはどれか。", "c": ["代理人は必ず行為能力者でなければならない。", "代理行為の瑕疵は本人を基準に判断する。", "代理人が自己のためにした行為も当然に本人に帰属する。", "代理人が代理権の範囲内で本人のためにすることを示してした意思表示は、直接本人に対して効力を生ずる。"], "a": 3, "ex": "代理は顕名・代理権・代理権内の行為があれば本人に効果帰属する。代理人は制限行為能力者でもよい。代理行為の瑕疵は原則として代理人を基準に判断する。", "kid": "代理人が『本人のため』と示して契約すれば、効果は本人に届くんだ。"}, {"id": "g-ken-007", "cat": "権利関係", "topic": "代理", "diff": 3, "q": "無権代理に関する次の記述のうち、正しいものはどれか。", "c": ["無権代理行為は本人が追認しても効力を生じない。", "相手方は本人に対して催告できない。", "無権代理人は相手方に対し一切責任を負わない。", "本人が追認すれば契約時にさかのぼって有効となり、追認拒絶の場合は無権代理人が相手方に責任を負うことがある。"], "a": 3, "ex": "無権代理は本人の追認で遡及的に有効となる。相手方は催告権・取消権を持ち、本人が追認拒絶すれば無権代理人は履行又は損害賠償の責任を負いうる。", "kid": "勝手な代理も、本人がOKすれば有効。断られたら代理人が責任を負うよ。"}, {"id": "g-ken-008", "cat": "権利関係", "topic": "時効", "diff": 3, "q": "取得時効の成立要件と効力に関する次の記述のうち、正しいものはどれか。", "c": ["所有の意思がなくても占有していれば時効取得できる。", "占有開始時に善意無過失なら常に10年で取得する。", "時効は当事者が援用しなくても裁判所が職権で認める。", "所有の意思をもって平穏かつ公然と一定期間占有した者は、その所有権を時効取得でき、時効の効力は起算日にさかのぼる。"], "a": 3, "ex": "取得時効は所有の意思・平穏公然の占有・一定期間（善意無過失10年、それ以外20年）で成立。効力は起算日に遡及し、援用が必要。", "kid": "自分の物のつもりで長く使い続けると、その物を時効で手に入れられるんだ。"}, {"id": "g-ken-009", "cat": "権利関係", "topic": "時効", "diff": 2, "q": "時効の完成猶予・更新に関する次の記述のうち、正しいものはどれか。", "c": ["裁判上の請求があっても時効は進行し続ける。", "権利の承認は時効に影響しない。", "催告をすれば時効は直ちに更新される。", "権利の承認があったときは、その時から時効が新たに進行を始める（更新）。"], "a": 3, "ex": "権利の承認は時効の更新事由で、承認時から新たに進行する。裁判上の請求は完成猶予、確定判決等で更新。催告は6か月の完成猶予にとどまる。", "kid": "『借りていると認めた』時点で、時効の数え直しが始まるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-ken-010", "cat": "権利関係", "topic": "債務不履行と解除", "diff": 3, "q": "契約の解除（宅建QUESTオリジナル演習010）に関する次の記述として、正しいものはどれか。", "c": ["債務不履行があれば催告せずに常に解除できる。", "解除には債務者の帰責事由が必ず必要である。", "解除しても既に履行した給付の返還は不要である。", "履行遅滞では原則として相当の期間を定めて催告し、その期間内に履行がないときに解除でき、解除により当事者は原状回復義務を負う。"], "a": 3, "ex": "催告解除は相当期間を定めた催告後の不履行で可能。無催告解除は履行不能等一定の場合。解除で契約は遡及的に消滅し原状回復義務を負う。債務者の帰責事由は解除の要件ではない。", "kid": "『いつまでに払って』と催促しても履行がなければ解除でき、受け取った物は返すんだ。"}, {"id": "g-ken-011", "cat": "権利関係", "topic": "契約不適合責任", "diff": 3, "q": "売買における契約不適合責任に関する次の記述のうち、正しいものはどれか。", "c": ["買主は代金減額のみを請求できる。", "買主は不適合を知った時から10年以内に通知しなければ権利を失う。", "契約解除には常に売主の帰責事由が必要である。", "買主は追完請求・代金減額請求・損害賠償請求・契約解除をすることができ、原則として不適合を知った時から1年以内に通知する必要がある。"], "a": 3, "ex": "契約不適合では、買主は追完・代金減額・損害賠償・解除を追及できる。種類・品質の不適合は原則として知った時から1年以内に通知しないと権利を失う（売主が悪意等の場合を除く）。", "kid": "買った物に不備があれば直し・減額・賠償・解除を求められる。1年以内に知らせよう。"}, {"id": "g-ken-012", "cat": "権利関係", "topic": "物権変動と対抗要件", "diff": 2, "q": "不動産物権変動の対抗要件に関する次の記述のうち、正しいものはどれか。", "c": ["不動産の物権変動は登記がなくても第三者に対抗できる。", "登記は物権変動の効力発生要件である。", "背信的悪意者にも登記がなければ対抗できない。", "不動産に関する物権の得喪変更は、登記をしなければ原則として第三者に対抗することができない。"], "a": 3, "ex": "不動産物権変動は登記が第三者対抗要件（対抗要件主義）。ただし登記は効力発生要件ではなく、背信的悪意者は登記がなくても対抗できない相手方となる。", "kid": "不動産は『登記』しないと、他人に自分の権利を主張できないんだ。"}, {"id": "g-ken-013", "cat": "権利関係", "topic": "物権変動と対抗要件", "diff": 3, "q": "取消しと登記に関する次の記述のうち、正しいものはどれか。", "c": ["取消し前の第三者には登記がなくても常に対抗できる。", "取消し後の第三者との関係は常に取消権者が優先する。", "取消しの効果は第三者に無制限に及ぶ。", "取消し後に現れた第三者との関係は対抗問題となり、原則として先に登記を備えた方が優先する。"], "a": 3, "ex": "取消し後の第三者と取消権者の関係は二重譲渡類似の対抗問題となり、先に登記した方が優先。取消し前の善意無過失等の第三者は取消しの遡及効から保護される場合がある。", "kid": "取り消したあとに登場した人とは、先に登記した方が勝つんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-ken-014", "cat": "権利関係", "topic": "所有権と共有", "diff": 3, "q": "共有に関する次の記述のうち、正しいものはどれか。", "c": ["共有物の変更は各共有者が単独でできる。", "共有物の管理に関する事項は全員一致で決する。", "各共有者は自己の持分を自由に処分できない。", "各共有者は自己の持分を自由に処分でき、共有物全体の変更（軽微でないもの）には原則として共有者全員の同意を要する。"], "a": 3, "ex": "持分の処分は各自自由。共有物の変更（その形状・効用の著しい変更を伴うもの）は原則全員同意、管理行為は持分価格の過半数、保存行為は各自単独でできる。", "kid": "自分の持分は自由に売れるけど、共有物を大きく変えるには全員の合意がいるよ。"}, {"id": "g-ken-015", "cat": "権利関係", "topic": "抵当権", "diff": 2, "q": "抵当権（宅建QUESTオリジナル演習015）に関する次の記述として、正しいものはどれか。", "c": ["抵当権を設定すると、設定者は目的物を使用できなくなる。", "抵当権は登記がなくても第三者に対抗できる。", "1個の不動産に複数の抵当権を設定することはできない。", "抵当権設定者は抵当不動産を引き続き使用収益でき、抵当権の順位は登記の前後による。"], "a": 3, "ex": "抵当権は非占有担保で、設定者は引き続き使用収益できる。同一不動産に複数設定でき、順位は登記の前後による。対抗には登記が必要。", "kid": "抵当に入れても住み続けられる。順番は登記の早い者勝ちだよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-ken-016", "cat": "権利関係", "topic": "抵当権", "diff": 3, "q": "抵当権の効力に関する次の記述のうち、正しいものはどれか。", "c": ["抵当権の効力は付加一体物には及ばない。", "抵当権は被担保債権と切り離して譲渡できる。", "物上代位のためには差押えは不要である。", "抵当権の効力は原則として付加一体物に及び、抵当権者は目的物の売却代金等に対し、払渡し前に差押えをして物上代位できる。"], "a": 3, "ex": "抵当権の効力は付加一体物に及ぶ。抵当目的物の売却・賃料・保険金等に物上代位できるが、その払渡し前に差押えが必要。抵当権は付従性により被担保債権とともに移転する。", "kid": "抵当の効き目は代金や保険金にも及ぶけど、支払い前に差押えが必要なんだ。"}, {"id": "g-ken-017", "cat": "権利関係", "topic": "賃貸借", "diff": 2, "q": "賃貸借における賃借権の譲渡・転貸に関する次の記述のうち、正しいものはどれか。", "c": ["賃借人は賃貸人の承諾なく自由に転貸できる。", "無断転貸があっても賃貸人は解除できない。", "適法な転貸でも賃貸人は転借人に直接請求できない。", "賃借人は賃貸人の承諾を得なければ賃借権を譲渡・転貸できず、無断譲渡・転貸で使用収益させたときは原則として賃貸人は契約を解除できる。"], "a": 3, "ex": "賃借権の譲渡・転貸には賃貸人の承諾が必要。無断で第三者に使用収益させると背信行為と認めるに足りない特段の事情がない限り解除できる。適法転貸では賃貸人は転借人に直接請求できる。", "kid": "又貸しは大家さんの許可が必要。勝手にやると契約を切られることがあるよ。"}, {"id": "g-ken-018", "cat": "権利関係", "topic": "賃貸借", "diff": 3, "q": "不動産賃貸借の対抗力に関する次の記述のうち、正しいものはどれか。", "c": ["建物賃貸借は登記がなければ一切対抗できない。", "賃貸不動産が譲渡されると賃借人は当然に退去しなければならない。", "敷金は新所有者に承継されない。", "対抗要件を備えた不動産賃貸借は、目的物が譲渡されても新所有者に賃貸人たる地位が移転し、賃借人は引き続き使用できる。"], "a": 3, "ex": "対抗要件（借地は借地上建物の登記、借家は建物の引渡し等）を備えた賃借人は、目的物の新所有者に賃借権を対抗でき、賃貸人の地位は新所有者へ承継され敷金関係も移転する。", "kid": "きちんと対抗力があれば、大家さんが変わっても借主は住み続けられるんだ。"}, {"id": "g-ken-019", "cat": "権利関係", "topic": "借地借家法（借地）", "diff": 3, "q": "借地借家法の借地権に関する次の記述のうち、正しいものはどれか。", "c": ["借地権の存続期間は最長20年である。", "借地上の建物の登記があっても第三者に対抗できない。", "借地権の当初存続期間は10年である。", "借地権の存続期間は原則30年以上であり、借地上に自己名義で登記した建物を有すれば第三者に対抗できる。"], "a": 3, "ex": "借地権の当初存続期間は原則30年（これより長い定めは可）。借地権者は借地上の建物を自己名義で登記していれば土地の新所有者等第三者に対抗できる。", "kid": "土地を借りる権利は原則30年。借地上の建物を登記すれば守られるんだ。"}, {"id": "g-ken-020", "cat": "権利関係", "topic": "借地借家法（借家）", "diff": 3, "q": "借地借家法の建物賃貸借に関する次の記述のうち、正しいものはどれか。", "c": ["建物賃貸借の対抗要件は建物の登記に限られる。", "期間を1年未満と定めた建物賃貸借は1年とみなされる。", "賃貸人はいつでも正当事由なく更新を拒絶できる。", "建物の引渡しを受けた建物賃借人は、その後建物を取得した者に賃借権を対抗でき、期間を1年未満とする建物賃貸借は期間の定めのないものとみなされる。"], "a": 3, "ex": "建物賃貸借は建物の引渡しが対抗要件。期間を1年未満と定めると期間の定めのない賃貸借とみなされる（定期借家を除く）。更新拒絶には正当事由が必要。", "kid": "部屋の引渡しを受ければ守られる。1年未満の契約は『期間の定めなし』になるよ。"}, {"id": "g-ken-021", "cat": "権利関係", "topic": "借地借家法（存続期間）", "diff": 3, "q": "定期借地権に関する次の記述のうち、正しいものはどれか。", "c": ["一般定期借地権の存続期間は30年である。", "定期借地権では契約の更新がある。", "一般定期借地権の設定は口頭でよい。", "一般定期借地権は存続期間を50年以上とし、更新や建物買取請求をしない旨等の特約を公正証書等の書面（電磁的記録を含む）で定める。"], "a": 3, "ex": "一般定期借地権は存続期間50年以上で、契約の更新・建物築造による延長・建物買取請求をしない旨の特約を書面で定める。更新がない点が普通借地権と異なる。", "kid": "一般定期借地権は50年以上で、更新なし。書面で約束するんだ。"}, {"id": "g-ken-022", "cat": "権利関係", "topic": "区分所有法", "diff": 3, "q": "建物の区分所有等に関する法律に関する次の記述のうち、正しいものはどれか。", "c": ["共用部分の持分は専有部分と分離して処分できる。", "規約の変更は集会の出席者の過半数で決する。", "管理者は必ず区分所有者でなければならない。", "規約の設定・変更・廃止は、区分所有者及び議決権の各4分の3以上の多数による集会の決議によって行う。"], "a": 3, "ex": "規約の設定・変更・廃止は区分所有者及び議決権の各3/4以上の特別多数決。共用部分の持分は専有部分と分離処分できない。管理者は区分所有者でなくてもよい。", "kid": "マンションの規約を変えるには、4分の3以上の賛成がいるんだ。"}, {"id": "g-ken-023", "cat": "権利関係", "topic": "区分所有法", "diff": 3, "q": "区分所有建物の建替えに関する次の記述のうち、正しいものはどれか。", "c": ["建替え決議は区分所有者の過半数で足りる。", "建替え決議には全員の同意が必要である。", "建替え決議は規約で定めれば不要となる。", "建替え決議は、区分所有者及び議決権の各5分の4以上の多数による集会の決議で行う。"], "a": 3, "ex": "建替え決議は区分所有者及び議決権の各4/5以上の特別多数決による。共用部分の重大変更は各3/4以上など、事項ごとに要件が異なる。", "kid": "マンションの建替えは、5分の4以上という高いハードルの賛成が必要だよ。"}, {"id": "g-ken-024", "cat": "権利関係", "topic": "相続", "diff": 2, "q": "法定相続分（宅建QUESTオリジナル演習024）に関する次の記述として、正しいものはどれか。", "c": ["配偶者と子が相続人のとき、配偶者の相続分は3分の1である。", "配偶者と直系尊属が相続人のとき、配偶者は2分の1である。", "配偶者と兄弟姉妹が相続人のとき、配偶者は3分の2である。", "配偶者と子が相続人のとき、配偶者と子の相続分はそれぞれ2分の1である。"], "a": 3, "ex": "配偶者と子：各1/2。配偶者と直系尊属：配偶者2/3・尊属1/3。配偶者と兄弟姉妹：配偶者3/4・兄弟姉妹1/4。", "kid": "配偶者と子どもが相続するときは、半分ずつが基本だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-ken-025", "cat": "権利関係", "topic": "相続", "diff": 3, "q": "相続の承認・放棄に関する次の記述のうち、正しいものはどれか。", "c": ["相続放棄は相続開始前でもできる。", "限定承認は相続人が単独でできる。", "相続放棄をしても代襲相続が生じる。", "相続人は原則として自己のために相続の開始があったことを知った時から3か月以内に、承認又は放棄をしなければならない。"], "a": 3, "ex": "相続の承認・放棄は熟慮期間（知った時から3か月）内に行う。相続放棄は相続開始前にはできず、放棄した者は初めから相続人でなかったものとみなされ代襲相続は生じない。限定承認は共同相続人全員で行う。", "kid": "相続するか放棄するかは、知ってから3か月以内に決めるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-ken-026", "cat": "権利関係", "topic": "遺言と遺留分", "diff": 3, "q": "遺留分（宅建QUESTオリジナル演習026）に関する次の記述として、正しいものはどれか。", "c": ["兄弟姉妹にも遺留分がある。", "遺留分を侵害する遺贈は無効である。", "遺留分は相続開始前に当然に行使できる。", "兄弟姉妹以外の相続人は遺留分を有し、遺留分を侵害された者は受遺者等に対し遺留分侵害額に相当する金銭の支払を請求できる。"], "a": 3, "ex": "遺留分権利者は配偶者・子・直系尊属で、兄弟姉妹にはない。遺留分を侵害する遺贈も有効だが、遺留分権利者は侵害額に相当する金銭の支払（遺留分侵害額請求）を求められる。", "kid": "最低限もらえる取り分が遺留分。兄弟姉妹にはなく、お金で請求するんだ。"}, {"id": "g-ken-027", "cat": "権利関係", "topic": "不法行為", "diff": 2, "q": "不法行為に基づく損害賠償に関する次の記述のうち、正しいものはどれか。", "c": ["不法行為の損害賠償請求権に消滅時効はない。", "使用者は被用者の不法行為について一切責任を負わない。", "被害者に過失があっても賠償額に影響しない。", "被用者が事業の執行につき第三者に損害を加えたときは、原則として使用者も損害賠償責任を負う（使用者責任）。"], "a": 3, "ex": "使用者責任により、被用者が事業執行につき加えた損害は使用者も賠償責任を負う。被害者の過失は過失相殺で考慮される。不法行為の賠償請求権には消滅時効がある。", "kid": "従業員が仕事中に人に損害を与えたら、会社も賠償責任を負うんだ。"}, {"id": "g-ken-028", "cat": "権利関係", "topic": "不法行為", "diff": 3, "q": "土地工作物責任に関する次の記述のうち、正しいものはどれか。", "c": ["工作物責任では占有者が無過失でも常に責任を負う。", "所有者は過失がなければ免責される。", "占有者・所有者いずれも被害者に責任を負わない場合がある。", "工作物の設置・保存の瑕疵により損害が生じたときは、まず占有者が責任を負い、占有者が必要な注意をしたときは所有者が無過失でも責任を負う。"], "a": 3, "ex": "土地工作物責任は第一次的に占有者が負うが、占有者が損害防止に必要な注意をしたときは所有者が責任を負う。所有者の責任は無過失責任である。", "kid": "建物などの欠陥で事故が起きたら、まず占有者、ダメなら持ち主が責任を負うよ。"}, {"id": "g-ken-029", "cat": "権利関係", "topic": "不動産登記法", "diff": 2, "q": "不動産登記（宅建QUESTオリジナル演習029）に関する次の記述として、正しいものはどれか。", "c": ["所有権保存登記は誰でも自由に申請できる。", "登記は当事者の一方が単独で申請するのが原則である。", "表示に関する登記は申請できない。", "権利に関する登記の申請は、原則として登記権利者と登記義務者が共同して行う（共同申請主義）。"], "a": 3, "ex": "権利に関する登記は共同申請が原則。表示に関する登記は表題部所有者等が申請でき、一定の場合は登記官の職権登記もある。所有権保存登記は表題部所有者等一定の者が申請できる。", "kid": "権利の登記は、原則として売主と買主がそろって申請するんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-ken-030", "cat": "権利関係", "topic": "不動産登記法", "diff": 3, "q": "仮登記に関する次の記述のうち、正しいものはどれか。", "c": ["仮登記があれば第三者に本登記と同じ対抗力を有する。", "仮登記に基づく本登記の順位は本登記の時による。", "仮登記は登記義務者の承諾があっても単独申請できない。", "仮登記は順位を保全する効力を持ち、これに基づいて本登記をすれば本登記の順位は仮登記の順位による。"], "a": 3, "ex": "仮登記自体に対抗力はないが順位保全効がある。仮登記に基づく本登記の順位は仮登記の順位による。登記義務者の承諾があるとき等は仮登記権利者が単独申請できる。", "kid": "仮登記は順番だけ確保する予約。本登記すれば予約の順番が生きるんだ。"}, {"id": "g-ken-031", "cat": "権利関係", "topic": "債権債務", "diff": 2, "q": "連帯債務（宅建QUESTオリジナル演習031）に関する次の記述として、正しいものはどれか。", "c": ["連帯債務者の1人に対する履行の請求は他の債務者にも当然に効力が及ぶ。", "連帯債務者の1人が弁済しても他の債務者の債務は減少しない。", "債権者は連帯債務者の1人にしか請求できない。", "債権者は連帯債務者の1人又は全員に対し、同時又は順次に全部又は一部の履行を請求でき、1人の弁済は他の債務者の債務も消滅させる。"], "a": 3, "ex": "債権者は連帯債務者の誰にでも全額請求できる。1人の弁済等は他の債務者にも効力が及ぶ（絶対的効力）。改正民法では請求は原則相対的効力にとどまる。", "kid": "連帯債務では、債権者は誰にでも全額請求でき、誰かが払えば全員分減るんだ。"}, {"id": "g-ken-032", "cat": "権利関係", "topic": "債権債務", "diff": 3, "q": "保証に関する次の記述のうち、正しいものはどれか。", "c": ["保証契約は口頭でも有効に成立する。", "連帯保証人は催告の抗弁権を有する。", "主たる債務が消滅しても保証債務は存続する。", "保証契約は書面（電磁的記録を含む）でしなければ効力を生じず、連帯保証人は催告・検索の抗弁権を有しない。"], "a": 3, "ex": "保証契約は書面でしなければ効力を生じない。保証債務は主債務に付従する。連帯保証は催告・検索の抗弁権や分別の利益を有しない点で通常の保証と異なる。", "kid": "保証は書面が必須。連帯保証は『先に本人へ』と言えず、いきなり請求されるよ。"}, {"id": "g-ken-033", "cat": "権利関係", "topic": "賃貸借", "diff": 2, "q": "賃貸借における敷金に関する次の記述のうち、正しいものはどれか。", "c": ["敷金は賃貸借終了前でも当然に返還される。", "賃借人は敷金をもって賃料の支払に充てるよう請求できる。", "通常損耗の原状回復費用は当然に賃借人負担である。", "敷金は賃貸借終了後、目的物の返還を受けたときに、未払賃料等を控除した残額が賃借人に返還される。"], "a": 3, "ex": "敷金は賃貸借終了かつ明渡し後に、未払賃料や損害賠償等を控除した残額を返還する。賃借人から敷金を賃料に充当請求はできない。通常損耗は原則賃貸人負担。", "kid": "敷金は部屋を返したあと、未払い分を引いた残りが戻ってくるんだ。"}, {"id": "g-ken-034", "cat": "権利関係", "topic": "借地借家法（借地）", "diff": 3, "q": "借地上の建物の滅失と再築に関する次の記述のうち、正しいものはどれか。", "c": ["建物が滅失すると借地権は当然に消滅する。", "存続期間中の再築には常に借地権設定者の承諾が必要である。", "借地権者は建物が滅失しても第三者に一切対抗できない。", "建物滅失後、借地権者が一定事項を土地上の見やすい場所に掲示すれば、滅失から2年間は第三者に借地権を対抗できる。"], "a": 3, "ex": "借地上建物の滅失後も、借地権者が建物を特定する事項等を土地に掲示すれば、滅失から2年間は借地権を第三者に対抗できる。建物滅失自体で借地権は消滅しない。", "kid": "建物が無くなっても、掲示すれば2年は借地の権利を主張できるんだ。"}, {"id": "g-ken-035", "cat": "権利関係", "topic": "借地借家法（借家）", "diff": 3, "q": "定期建物賃貸借（定期借家）に関する次の記述のうち、正しいものはどれか。", "c": ["定期借家契約は口頭でも成立する。", "定期借家では契約の更新がある。", "定期借家では期間の定めは不要である。", "定期建物賃貸借は、公正証書等の書面により、契約の更新がない旨を定めて締結し、賃貸人は事前に更新がない旨を記載した書面を交付して説明しなければならない。"], "a": 3, "ex": "定期借家は書面（電磁的記録を含む）で更新がない旨を定めて締結し、賃貸人は事前に更新がない旨を記載した書面を交付して説明する。説明を欠くと更新がない定めは無効となる。", "kid": "定期借家は更新なしを書面で約束。事前の書面説明が必須だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-ken-036", "cat": "権利関係", "topic": "抵当権", "diff": 3, "q": "法定地上権（宅建QUESTオリジナル演習036）に関する次の記述として、正しいものはどれか。", "c": ["土地と建物が別人所有でも法定地上権が成立する。", "更地に抵当権を設定した後に建物を建てれば法定地上権が成立する。", "法定地上権は当事者の合意がなければ成立しない。", "抵当権設定時に土地上に建物が存在し土地・建物が同一人所有であり、競売により所有者が異なるに至ったときは、建物のために法定地上権が成立する。"], "a": 3, "ex": "法定地上権は、抵当権設定時に建物が存在し、土地建物が同一人所有で、競売により別人所有となった場合に成立する。更地に設定後の建築では原則成立しない。", "kid": "同じ人の土地と建物が競売で別々になると、建物のための土地利用権が自動で生まれるんだ。"}, {"id": "g-ken-037", "cat": "権利関係", "topic": "意思表示", "diff": 2, "q": "強迫による意思表示に関する次の記述のうち、正しいものはどれか。", "c": ["強迫による意思表示は無効である。", "強迫による取消しは善意無過失の第三者に対抗できない。", "第三者による強迫では相手方が善意なら取り消せない。", "強迫による意思表示は取り消すことができ、その取消しは善意無過失の第三者にも対抗できる。"], "a": 3, "ex": "強迫による意思表示は取消し可能。詐欺と異なり、強迫による取消しは善意無過失の第三者にも対抗できる。第三者強迫でも相手方の善意悪意を問わず取り消せる。", "kid": "脅されてした契約は取り消せて、しかも第三者にも強く主張できるんだ。"}, {"id": "g-ken-038", "cat": "権利関係", "topic": "代理", "diff": 3, "q": "表見代理に関する次の記述のうち、正しいものはどれか。", "c": ["表見代理が成立しても本人は責任を負わない。", "相手方が代理権のないことを知っていても表見代理は成立する。", "表見代理は代理権が全く存在しない場合には一切問題とならない。", "代理権授与の表示や権限外行為につき相手方が正当な理由をもって代理権があると信じた場合等には、表見代理が成立し本人が責任を負うことがある。"], "a": 3, "ex": "表見代理（授権表示・権限踰越・代理権消滅後）は、相手方が善意無過失等一定要件を満たすと本人が責任を負う。相手方が悪意・有過失なら成立しない。", "kid": "権限があるように見え、相手が信じてもやむを得ない場合、本人が責任を負うんだ。"}, {"id": "g-ken-039", "cat": "権利関係", "topic": "債務不履行と解除", "diff": 2, "q": "履行遅滞に関する次の記述のうち、正しいものはどれか。", "c": ["確定期限のある債務は期限到来を知った時から遅滞となる。", "期限の定めのない債務は成立時から遅滞となる。", "履行遅滞では損害賠償を請求できない。", "確定期限のある債務はその期限の到来した時から、期限の定めのない債務は履行の請求を受けた時から履行遅滞となる。"], "a": 3, "ex": "履行遅滞の時期は、確定期限は期限到来時、不確定期限は期限到来を知った時又は請求時のいずれか早い時、期限の定めなしは請求時。遅滞により損害賠償・解除が問題となる。", "kid": "いつから遅れたことになるかは、期限の種類で決まるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-ken-040", "cat": "権利関係", "topic": "契約不適合責任", "diff": 3, "q": "数量不足の契約不適合に関する次の記述のうち、正しいものはどれか。", "c": ["数量不足では買主は代金減額を請求できない。", "数量に関する不適合には通知期間の制限がある。", "数量不足があっても損害賠償は請求できない。", "引き渡された目的物が数量に関して契約内容に適合しない場合、買主は追完請求・代金減額請求・損害賠償請求・解除ができ、数量不適合には期間内通知の制限は及ばない。"], "a": 3, "ex": "数量不適合でも追完・代金減額・損害賠償・解除が可能。種類・品質の不適合に課される『知った時から1年以内の通知』の制限は、数量・権利の不適合には適用されない。", "kid": "量が足りない不備は、期間の縛りなく直しや減額を求められるんだ。"}, {"id": "g-ken-041", "cat": "権利関係", "topic": "所有権と共有", "diff": 2, "q": "相隣関係に関する次の記述のうち、正しいものはどれか。", "c": ["隣地の使用は隣人の承諾がなければ一切できない。", "袋地の所有者は公道に至るため他の土地を通行できない。", "境界標の設置費用は必ず一方が負担する。", "他の土地に囲まれて公道に通じない土地（袋地）の所有者は、公道に至るため一定の範囲で囲繞地を通行することができる。"], "a": 3, "ex": "袋地の所有者は公道に至るための囲繞地通行権を有する（必要最小限・原則償金を要する）。境界標の設置・保存費用は相隣者が等しい割合で負担するのが原則。", "kid": "道路に出られない土地の持ち主は、隣の土地を通る権利があるんだ。"}, {"id": "g-ken-042", "cat": "権利関係", "topic": "相続", "diff": 3, "q": "遺産分割に関する次の記述のうち、正しいものはどれか。", "c": ["遺産分割は相続開始から3か月以内にしなければならない。", "遺産分割の効力は分割時から将来に向かって生じる。", "遺言で分割方法を定めることはできない。", "遺産分割は原則として相続開始の時にさかのぼって効力を生じ、被相続人は遺言で分割方法を定め又は一定期間分割を禁止できる。"], "a": 3, "ex": "遺産分割の効力は相続開始時に遡及する（第三者の権利を害せない）。被相続人は遺言で分割方法の指定や5年以内の分割禁止ができる。分割自体に期限はない。", "kid": "遺産分けの効果は相続開始の時までさかのぼるんだ。遺言で方法も決められるよ。"}, {"id": "g-ken-043", "cat": "権利関係", "topic": "賃貸借", "diff": 2, "q": "賃貸人・賃借人の修繕に関する次の記述のうち、正しいものはどれか。", "c": ["賃貸人に修繕義務はない。", "賃借人は自ら修繕することが一切できない。", "必要費を支出しても賃借人は償還を請求できない。", "賃貸人は使用収益に必要な修繕義務を負い、賃借人が必要費を支出したときは直ちにその償還を請求できる。"], "a": 3, "ex": "賃貸人は目的物の使用収益に必要な修繕義務を負う。賃借人が必要費を支出したときは直ちに償還請求でき、有益費は賃貸借終了時に価格増加が現存する場合に償還請求できる。", "kid": "貸主が修理する義務がある。借主が立て替えた必要費はすぐ返してもらえるよ。"}, {"id": "g-ken-044", "cat": "権利関係", "topic": "抵当権", "diff": 3, "q": "抵当権消滅請求に関する次の記述のうち、正しいものはどれか。", "c": ["主たる債務者・保証人も抵当権消滅請求ができる。", "抵当不動産の第三取得者は抵当権消滅請求ができない。", "抵当権消滅請求は抵当権の実行後でも可能である。", "抵当不動産の第三取得者は、抵当権の実行としての競売による差押えの効力発生前に、抵当権消滅請求をすることができる。"], "a": 3, "ex": "抵当不動産の第三取得者は、競売の差押え効力発生前に抵当権消滅請求ができる。主たる債務者・保証人・これらの承継人は消滅請求できない。", "kid": "抵当付き物件を買った人は、競売前なら代金相当を払って抵当を消せるよう請求できるんだ。"}, {"id": "g-ken-045", "cat": "権利関係", "topic": "債権債務", "diff": 3, "q": "債権譲渡（宅建QUESTオリジナル演習045）に関する次の記述として、正しいものはどれか。", "c": ["譲渡制限特約に反する債権譲渡は常に無効である。", "債権譲渡の対抗要件は不要である。", "債務者への通知は譲受人からしなければ効力を生じない。", "債権譲渡は、譲渡人から債務者への通知又は債務者の承諾がなければ債務者その他の第三者に対抗できず、第三者対抗には確定日付のある証書が必要である。"], "a": 3, "ex": "債権譲渡の債務者対抗要件は譲渡人からの通知又は債務者の承諾、第三者対抗要件は確定日付のある証書による通知・承諾。譲渡制限特約に反する譲渡も原則有効。", "kid": "債権を譲るときは、譲渡人から債務者へ通知しないと主張できないんだ。"}, {"id": "g-ken-046", "cat": "権利関係", "topic": "債権債務", "diff": 2, "q": "危険負担に関する次の記述のうち、正しいものはどれか。", "c": ["双方の責めに帰せない事由で債務が履行不能でも、債権者は反対給付を拒めない。", "履行不能でも契約は当然に存続する。", "危険負担は債権者の帰責事由がある場合に問題となる。", "当事者双方の責めに帰することができない事由で債務の履行が不能となったときは、債権者は反対給付の履行を拒むことができる。"], "a": 3, "ex": "双方無帰責の履行不能では、債権者は反対給付を拒める（危険負担の債務者主義的処理）。債権者に帰責事由がある場合は反対給付を拒めない。", "kid": "誰のせいでもなく物が引き渡せなくなったら、買主は代金の支払を拒めるんだ。"}, {"id": "g-ken-047", "cat": "権利関係", "topic": "不動産登記法", "diff": 2, "q": "登記の効力に関する次の記述のうち、正しいものはどれか。", "c": ["登記には公信力があり、登記を信頼した者は常に保護される。", "登記は物権変動の効力発生要件である。", "登記記録の内容は誰も確認できない。", "不動産登記には公信力がなく、登記を信頼して取引しても、真の権利者でない者からは原則として権利を取得できない。"], "a": 3, "ex": "日本の不動産登記には公信力がない。登記名義を信頼しても、無権利者からは原則として権利を取得できない（例外的に94条2項類推等で保護される場合がある）。", "kid": "登記を信じても、本当の持ち主でない人からは権利をもらえないのが原則だよ。"}, {"id": "g-ken-048", "cat": "権利関係", "topic": "相続", "diff": 2, "q": "配偶者居住権に関する次の記述のうち、正しいものはどれか。", "c": ["配偶者居住権は自由に第三者へ譲渡できる。", "配偶者居住権に存続期間の定めはできない。", "配偶者居住権は登記できない。", "配偶者居住権は、被相続人の建物に相続開始時に居住していた配偶者が、遺産分割等により取得して無償で居住できる権利で、譲渡はできず登記により対抗できる。"], "a": 3, "ex": "配偶者居住権は、相続開始時に被相続人所有建物に居住していた配偶者が取得しうる権利で、譲渡はできない。登記により第三者に対抗できる。存続期間は終身が原則だが定めも可能。", "kid": "残された配偶者が自宅に住み続けられる権利。人には譲れず、登記で守られるよ。"}, {"id": "g-ken-049", "cat": "権利関係", "topic": "借地借家法（借家）", "diff": 3, "q": "造作買取請求権（宅建QUESTオリジナル演習049）に関する次の記述として、正しいものはどれか。", "c": ["造作買取請求権は特約で排除できない。", "借家人はいかなる造作も買い取らせることができる。", "造作買取請求権は建物の賃借権とともに当然に発生する。", "賃貸人の同意を得て付加した畳・建具等の造作は、賃貸借終了時に賃借人が時価での買取りを請求できるが、この権利は特約で排除できる。"], "a": 3, "ex": "賃貸人の同意を得て付加した造作は、賃貸借終了時に時価で買取請求できる。造作買取請求権は任意規定であり特約で排除可能。", "kid": "大家さんの同意で付けた設備は買い取ってもらえるけど、特約で無しにもできるんだ。"}, {"id": "g-ken-050", "cat": "権利関係", "topic": "時効", "diff": 2, "q": "消滅時効に関する次の記述のうち、正しいものはどれか。", "c": ["債権は権利を行使できる時から5年で必ず時効消滅する。", "消滅時効は債務者が援用しなくても効力を生じる。", "所有権は消滅時効にかかる。", "債権は、債権者が権利を行使できることを知った時から5年間、又は権利を行使できる時から10年間行使しないときに時効消滅するのが原則である。"], "a": 3, "ex": "債権の消滅時効は主観的起算点（知った時）から5年、客観的起算点（行使できる時）から10年のいずれか早い方。時効の効果には援用が必要。所有権は消滅時効にかからない。", "kid": "お金を返してもらう権利は、知ってから5年・行使できてから10年で消えるんだ。"}, {"id": "g-ken-051", "cat": "権利関係", "topic": "所有権と共有", "diff": 2, "q": "共有物分割に関する次の記述のうち、正しいものはどれか。", "c": ["共有者は分割請求を一切できない。", "共有物分割は必ず現物分割による。", "5年を超えて分割しない特約はできない。", "各共有者はいつでも共有物の分割を請求でき、協議が調わないときは裁判所に分割を請求できるが、5年以内の期間で不分割特約をすることもできる。"], "a": 3, "ex": "各共有者はいつでも分割請求でき、協議不成立なら裁判所に請求できる。分割方法は現物分割・代金分割（競売）・価格賠償等。5年以内の不分割特約は有効（更新可）。", "kid": "共有はいつでも『分けよう』と言えるけど、5年までなら分けない約束もできるよ。"}, {"id": "g-leg-001", "cat": "法令上の制限", "topic": "都市計画法", "diff": 2, "q": "都市計画区域の区域区分に関する次の記述のうち、正しいものはどれか。", "c": ["市街化区域は、既に市街地を形成している区域及びおおむね10年以内に優先的かつ計画的に市街化を図るべき区域である。", "市街化調整区域は、優先的に市街化を進める区域である。", "区域区分は全ての都市計画区域に必ず定めなければならない。", "市街化区域では開発行為に許可は一切不要である。"], "a": 0, "ex": "市街化区域は既成市街地とおおむね10年以内に市街化を図る区域。市街化調整区域は市街化を抑制すべき区域。区域区分の設定は必須ではない（非線引き都市計画区域もある）。", "kid": "市街化区域は『これから10年で街にする所』。調整区域は逆に抑える所だよ。"}, {"id": "g-leg-002", "cat": "法令上の制限", "topic": "用途地域", "diff": 2, "q": "用途地域に関する次の記述のうち、正しいものはどれか。", "c": ["用途地域は市街化調整区域には原則として定めない。", "用途地域は全部で8種類である。", "第一種低層住居専用地域では、いかなる店舗も建築できない。", "工業専用地域には住宅を建築できる。"], "a": 0, "ex": "用途地域は原則として市街化調整区域には定めない。用途地域は住居系・商業系・工業系の13種類。工業専用地域には住宅を建築できない。", "kid": "『市街化を抑える所』には、基本的に用途地域は決めないんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-003", "cat": "法令上の制限", "topic": "開発許可", "diff": 3, "q": "開発許可に関する次の記述のうち、正しいものはどれか。", "c": ["市街化区域内では、原則として1,000㎡未満の開発行為に開発許可は不要である。", "市街化調整区域では、規模にかかわらず開発許可は不要である。", "農林漁業用建築物のための開発は、区域を問わず必ず許可が必要である。", "開発許可は市町村長が行う。"], "a": 0, "ex": "市街化区域では原則1,000㎡未満は許可不要（三大都市圏等では500㎡未満）。市街化調整区域は規模にかかわらず原則許可が必要。開発許可権者は原則都道府県知事等。", "kid": "市街化区域の小さな開発（1000㎡未満）は許可がいらないんだ。"}, {"id": "g-leg-004", "cat": "法令上の制限", "topic": "開発許可", "diff": 3, "q": "開発許可の手続（宅建QUESTオリジナル演習004）に関する次の記述として、正しいものはどれか。", "c": ["開発許可を受けた開発区域内では、工事完了公告があるまで原則として建築物を建築できない。", "開発許可に係る工事の完了公告後も、予定建築物以外は自由に建築できる。", "開発許可は口頭で申請できる。", "開発行為の変更は一切認められない。"], "a": 0, "ex": "開発許可区域内は、工事完了の公告があるまで原則として建築物の建築等ができない。完了公告後も、用途地域が定められていない区域では予定建築物以外の建築は制限される。", "kid": "工事が終わったと公表されるまでは、そこに建物を建てられないんだ。"}, {"id": "g-leg-005", "cat": "法令上の制限", "topic": "接道義務と道路", "diff": 2, "q": "建築基準法の接道義務に関する次の記述のうち、正しいものはどれか。", "c": ["建築物の敷地は、原則として幅員4m以上の道路に2m以上接しなければならない。", "敷地は道路に1m接していれば足りる。", "接道義務は防火地域内でのみ適用される。", "幅員2mの道路に接していれば常に建築できる。"], "a": 0, "ex": "接道義務は、建築物の敷地が原則として幅員4m以上の道路に2m以上接することを求める。避難・防災の観点から重要。", "kid": "家の敷地は『4m道路に2m以上接する』のが基本ルールだよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-006", "cat": "法令上の制限", "topic": "接道義務と道路", "diff": 3, "q": "建築基準法上の道路に関する次の記述のうち、正しいものはどれか。", "c": ["幅員4m未満でも、法施行時に建築物が立ち並んでいた道で特定行政庁が指定したものは道路とみなされる（2項道路）。", "2項道路では、道路中心線から1m後退した線が道路境界線とみなされる。", "私道は建築基準法上の道路になることはない。", "2項道路のセットバック部分にも建築物を建てられる。"], "a": 0, "ex": "いわゆる2項道路は、幅員4m未満でも既存の建物が立ち並ぶ道で特定行政庁が指定したもの。中心線から2m後退（セットバック）した線が境界線とみなされ、その部分には建築できない。", "kid": "昔からの細い道も『道路扱い』にして、下がった分は建てられないんだ。"}, {"id": "g-leg-007", "cat": "法令上の制限", "topic": "建蔽率容積率", "diff": 2, "q": "建蔽率に関する次の記述のうち、正しいものはどれか。", "c": ["建蔽率とは、建築面積の敷地面積に対する割合をいう。", "建蔽率とは、延べ面積の敷地面積に対する割合をいう。", "建蔽率は用途地域にかかわらず全国一律である。", "角地でも建蔽率が緩和されることはない。"], "a": 0, "ex": "建蔽率は建築面積÷敷地面積。用途地域ごとに上限が定められ、角地や防火地域内の耐火建築物等では緩和される場合がある。延べ面積の割合は容積率。", "kid": "建蔽率は『土地に対する建物の一階部分の広さ』の割合だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-008", "cat": "法令上の制限", "topic": "建蔽率容積率", "diff": 3, "q": "容積率に関する次の記述のうち、正しいものはどれか。", "c": ["容積率は延べ面積の敷地面積に対する割合で、前面道路の幅員による制限を受けることがある。", "容積率は建築面積の敷地面積に対する割合である。", "前面道路の幅員は容積率に影響しない。", "容積率は敷地の高低差のみで決まる。"], "a": 0, "ex": "容積率は延べ面積÷敷地面積。都市計画で定める指定容積率のほか、前面道路の幅員が12m未満の場合は幅員に一定係数を乗じた値との小さい方が適用される。", "kid": "容積率は『全フロアの合計面積』の割合。前の道路が狭いと制限されるよ。"}, {"id": "g-leg-009", "cat": "法令上の制限", "topic": "用途制限", "diff": 3, "q": "用途地域内の建築物の用途制限に関する次の記述のうち、正しいものはどれか。", "c": ["工業専用地域には住宅を建築することができない。", "第一種低層住居専用地域には診療所を建築できない。", "商業地域には住宅を建築できない。", "神社・寺院・教会はいずれの用途地域にも建築できない。"], "a": 0, "ex": "工業専用地域では住宅は建築不可。診療所・神社等はほぼ全用途地域で建築可能。住宅は工業専用地域を除き建築できる。", "kid": "工業専用地域だけは『住むための家』を建てられないんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-010", "cat": "法令上の制限", "topic": "防火地域", "diff": 3, "q": "防火地域・準防火地域（宅建QUESTオリジナル演習010）に関する次の記述として、正しいものはどれか。", "c": ["建築物が防火地域と準防火地域にわたる場合、原則として厳しい方（防火地域）の規制が敷地全体の建築物に適用される。", "防火地域内では木造建築物は一切建築できない。", "準防火地域では建築物の構造制限はない。", "防火地域の指定は建築主が行う。"], "a": 0, "ex": "建築物が防火地域と準防火地域にわたるときは、原則として厳しい防火地域の規制が建築物全体に適用される。防火地域でも一定の木造建築物は可能。", "kid": "防火と準防火にまたがる建物は、厳しい方のルールに合わせるんだ。"}, {"id": "g-leg-011", "cat": "法令上の制限", "topic": "建築確認", "diff": 2, "q": "建築確認に関する次の記述のうち、正しいものはどれか。", "c": ["一定規模以上の建築物の建築等には、工事着手前に建築確認を受けなければならない。", "建築確認は工事完了後に受ければよい。", "建築確認は全ての建築物について規模を問わず不要である。", "建築確認は建築主が自ら審査して行う。"], "a": 0, "ex": "特殊建築物や一定規模以上の建築物、都市計画区域内等の建築物は、工事着手前に建築主事等の建築確認を受ける必要がある。完了後には完了検査を受ける。", "kid": "大きな建物などは、建てる前に役所の確認を受けるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-012", "cat": "法令上の制限", "topic": "国土利用計画法", "diff": 3, "q": "国土利用計画法の事後届出（宅建QUESTオリジナル演習012）に関する次の記述として、正しいものはどれか。", "c": ["一定面積以上の土地について土地売買等の契約を締結したときは、権利取得者が契約締結日から2週間以内に届け出なければならない。", "届出は契約締結前に行う必要がある。", "市街化区域内では5,000㎡以上が届出対象である。", "届出義務者は譲渡人（売主）である。"], "a": 0, "ex": "事後届出は、市街化区域2,000㎡以上等の一定面積で、権利取得者が契約締結日から2週間以内に行う。届出義務者は権利取得者。", "kid": "大きな土地を買ったら、買った人が2週間以内に届け出るんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-013", "cat": "法令上の制限", "topic": "農地法", "diff": 3, "q": "農地法（宅建QUESTオリジナル演習013）に関する次の記述として、正しいものはどれか。", "c": ["農地を農地以外に転用する場合（4条）は、原則として都道府県知事等の許可が必要である。", "農地の権利移動（3条）には許可は不要である。", "市街化区域内の農地の転用にも4条許可が必要である。", "農地法の許可を受けずにした契約も有効である。"], "a": 0, "ex": "自己の農地を農地以外に転用する4条は原則許可制。権利移動の3条も許可が必要。市街化区域内農地の転用は農業委員会への届出で足りる。無許可の契約は原則無効。", "kid": "農地を宅地に変えるには、原則として県の許可がいるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-014", "cat": "法令上の制限", "topic": "農地法", "diff": 3, "q": "農地を宅地にするため他人に売却する場合（農地法5条）に関する次の記述のうち、正しいものはどれか。", "c": ["転用目的の権利移動として、原則として都道府県知事等の許可が必要である。", "5条の許可は不要で、3条の許可のみでよい。", "市街化区域内でも必ず知事の許可が必要である。", "許可を受ける義務者は買主のみである。"], "a": 0, "ex": "農地を転用目的で権利移動する5条は原則許可制で、当事者双方が申請する。市街化区域内は農業委員会への届出で足りる。", "kid": "『農地を宅地にして売る』は転用＋移転なので5条の許可がいるよ。"}, {"id": "g-leg-015", "cat": "法令上の制限", "topic": "土地区画整理法", "diff": 3, "q": "土地区画整理法の換地処分に関する次の記述のうち、正しいものはどれか。", "c": ["換地処分の公告があった日の翌日に、換地は従前の宅地とみなされる。", "仮換地の指定があっても、従前の宅地を自由に使用収益できる。", "換地処分の公告前に清算金が確定する。", "保留地は換地処分後も施行者の所有とならない。"], "a": 0, "ex": "換地処分の公告があった日の翌日に、換地は従前の宅地とみなされ権利が移行する。仮換地が指定されると従前地の使用収益はできなくなる。保留地は施行者が取得する。", "kid": "区画整理が終わると、割り当てられた新しい土地が元の土地扱いになるんだ。"}, {"id": "g-leg-016", "cat": "法令上の制限", "topic": "盛土規制法", "diff": 2, "q": "盛土規制法（宅地造成及び特定盛土等規制法）に関する次の記述のうち、正しいものはどれか。", "c": ["規制区域内で一定規模以上の宅地造成等に関する工事を行うには、原則として都道府県知事等の許可が必要である。", "許可は工事完了後に受ければよい。", "規制区域の指定は国土交通大臣のみが行う。", "盛土は規制の対象外である。"], "a": 0, "ex": "宅地造成等工事規制区域内で一定規模以上の盛土・切土等の工事を行うには、工事着手前に都道府県知事等の許可を受ける必要がある。", "kid": "崖崩れを防ぐため、区域内で大きく土を盛る工事は事前許可がいるんだ。"}, {"id": "g-leg-017", "cat": "法令上の制限", "topic": "都市計画法", "diff": 2, "q": "地域地区に関する次の記述のうち、正しいものはどれか。", "c": ["高度地区は、建築物の高さの最高限度又は最低限度を定める地区である。", "高度地区は建築物の容積率を定める地区である。", "高度利用地区では建築物の高さのみを制限する。", "特別用途地区は用途地域を定めていない区域にのみ指定できる。"], "a": 0, "ex": "高度地区は建築物の高さの最高・最低限度を定める地区。高度利用地区は容積率・建蔽率・建築面積・壁面位置等を定めて土地の高度利用を図る地区で別物。", "kid": "『高度地区』は高さの上限・下限を決める地区だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-018", "cat": "法令上の制限", "topic": "都市計画法", "diff": 3, "q": "都市計画事業に関する次の記述のうち、正しいものはどれか。", "c": ["都市計画事業の認可の告示後、事業地内で建築物の建築等を行うには原則として都道府県知事等の許可が必要である。", "事業地内の建築は自由に行える。", "都市計画事業は民間事業者が単独で施行できない。", "都市計画施設の区域内では一切の建築が禁止される。"], "a": 0, "ex": "都市計画事業の認可告示後、事業地内で建築物の建築等を行うには知事等の許可が必要（事業の円滑な遂行のため）。都市計画施設等の区域内でも一定の建築は許可により可能。", "kid": "事業予定地では、勝手に建物を建てられず許可がいるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-019", "cat": "法令上の制限", "topic": "建築基準法総合", "diff": 2, "q": "建築基準法の単体規定（宅建QUESTオリジナル演習019）に関する次の記述として、正しいものはどれか。", "c": ["単体規定は、都市計画区域外の建築物にも原則として適用される。", "単体規定は都市計画区域内にのみ適用される。", "居室には採光・換気のための開口部は不要である。", "単体規定は集団規定と同一の内容である。"], "a": 0, "ex": "建築物の安全・衛生に関する単体規定は全国どこでも適用される。接道義務・用途制限等の集団規定は原則として都市計画区域・準都市計画区域内で適用される。", "kid": "建物の安全ルール（単体規定）は、区域の内外を問わず守るんだ。"}, {"id": "g-leg-020", "cat": "法令上の制限", "topic": "用途地域", "diff": 2, "q": "用途地域が定められていない区域における建築物の用途に関する次の記述のうち、正しいものはどれか。", "c": ["用途地域の指定のない区域でも、特定行政庁の指定により容積率・建蔽率等の制限が適用される。", "用途地域外では建築基準法の制限は一切ない。", "用途地域外ではどんな用途の建物も建てられない。", "用途地域外では接道義務が適用されない。"], "a": 0, "ex": "用途地域の指定のない区域（白地地域等）でも、特定行政庁が定める建蔽率・容積率等の制限や、都市計画区域内であれば接道義務等の集団規定が適用される。", "kid": "用途地域がなくても、建物のルールが全く無いわけではないんだ。"}, {"id": "g-leg-021", "cat": "法令上の制限", "topic": "開発許可", "diff": 3, "q": "開発許可が不要となる場合に関する次の記述のうち、正しいものはどれか。", "c": ["駅舎その他の鉄道の施設、図書館、公民館等公益上必要な一定の建築物のための開発行為は、許可が不要となる場合がある。", "公益上必要な建築物でも常に開発許可が必要である。", "都市計画区域外では開発許可制度は一切存在しない。", "非常災害の応急措置としての開発行為にも許可が必要である。"], "a": 0, "ex": "駅舎・図書館・公民館等公益上必要な一定の建築物のための開発、非常災害の応急措置、通常の管理行為等は開発許可が不要。都市計画区域外でも一定規模（1ha以上）で許可対象となる。", "kid": "駅や公民館など公共性の高い施設の開発は、許可がいらないことがあるよ。"}, {"id": "g-leg-022", "cat": "法令上の制限", "topic": "国土利用計画法", "diff": 3, "q": "国土利用計画法の事後届出における対象面積に関する次の記述のうち、正しいものはどれか。", "c": ["市街化区域は2,000㎡以上、市街化調整区域を含む都市計画区域（市街化区域を除く）は5,000㎡以上、都市計画区域外は10,000㎡以上が対象である。", "全国一律に1,000㎡以上が対象である。", "都市計画区域外は届出の対象とならない。", "面積は複数契約でも合算しない。"], "a": 0, "ex": "事後届出の面積要件は、市街化区域2,000㎡以上、その他の都市計画区域5,000㎡以上、都市計画区域外10,000㎡以上。一団の土地として計画的に取得する場合は合算して判断する。", "kid": "届出がいる広さは区域ごとに違う（2000/5000/10000㎡）よ。"}, {"id": "g-leg-023", "cat": "法令上の制限", "topic": "建築確認", "diff": 3, "q": "建築確認を要する特殊建築物に関する次の記述のうち、正しいものはどれか。", "c": ["その用途に供する部分の床面積が一定規模を超える特殊建築物は、大規模の修繕・模様替えでも確認が必要となる場合がある。", "特殊建築物は新築のときのみ確認が必要である。", "用途変更は建築確認の対象とならない。", "特殊建築物には共同住宅は含まれない。"], "a": 0, "ex": "一定規模を超える特殊建築物（共同住宅・店舗・病院等）は、新築だけでなく大規模の修繕・模様替え、一定の用途変更でも確認を要する場合がある。", "kid": "たくさんの人が使う建物は、直すときや用途を変えるときも確認がいるんだ。"}, {"id": "g-leg-024", "cat": "法令上の制限", "topic": "高さ制限", "diff": 3, "q": "建築物の高さ制限に関する次の記述のうち、正しいものはどれか。", "c": ["第一種・第二種低層住居専用地域及び田園住居地域では、建築物の高さの限度（10m又は12m）が定められる。", "斜線制限は全ての用途地域で同一の内容である。", "日影規制は商業地域で必ず適用される。", "低層住居専用地域には高さの限度はない。"], "a": 0, "ex": "低層住居専用地域等では絶対高さ制限（10m又は12m）がある。斜線制限（道路・隣地・北側）は地域ごとに内容が異なり、北側斜線は主に低層・中高層住居専用地域で適用される。", "kid": "低層住宅の地域では、建物の高さに上限（10mか12m）があるんだ。"}, {"id": "g-leg-025", "cat": "法令上の制限", "topic": "都市計画法", "diff": 2, "q": "都市施設に関する次の記述のうち、正しいものはどれか。", "c": ["道路・公園・下水道等の都市施設は、必要なものを都市計画に定めることができ、市街化区域では少なくとも道路・公園・下水道を定める。", "都市施設は市街化調整区域には一切定められない。", "都市施設の区域内では建築が完全に自由である。", "都市施設は民間が都市計画で定める。"], "a": 0, "ex": "都市施設は都市計画に定めることができ、市街化区域及び非線引き用途地域では少なくとも道路・公園・下水道を定めるものとされる。都市施設は区域外にも定めうる。", "kid": "街に必要な道路・公園・下水道などは、都市計画で位置を決めるんだ。"}, {"id": "g-leg-026", "cat": "法令上の制限", "topic": "建蔽率容積率", "diff": 3, "q": "建蔽率の緩和に関する次の記述のうち、正しいものはどれか。", "c": ["防火地域内にある耐火建築物等については、建蔽率の限度が緩和される場合がある。", "角地であっても建蔽率は緩和されない。", "建蔽率の限度が80％の地域では、防火地域内の耐火建築物でも緩和されない。", "建蔽率は敷地が広いほど自動的に緩和される。"], "a": 0, "ex": "防火地域内の耐火建築物等や特定行政庁指定の角地では建蔽率が緩和される。建蔽率80％の地域かつ防火地域内の耐火建築物は建蔽率の制限が適用されない（100％可）。", "kid": "燃えにくい建物や角地は、建てられる割合が少し増えることがあるよ。"}, {"id": "g-leg-027", "cat": "法令上の制限", "topic": "接道義務と道路", "diff": 3, "q": "接道義務の例外・付加に関する次の記述のうち、正しいものはどれか。", "c": ["地方公共団体は、特殊建築物等について条例で接道義務を付加（強化）することができる。", "接道義務は条例で緩和することしかできない。", "敷地の周囲に広い空地があっても、接道義務の例外は認められない。", "接道義務は建築物の規模にかかわらず全て同じである。"], "a": 0, "ex": "地方公共団体は、特殊建築物・大規模建築物等について条例で接道義務を付加（強化）できる。また、敷地周囲に広い空地がある等で安全上支障がない場合は特定行政庁の許可で例外が認められうる。", "kid": "自治体は、大きな建物などに『もっと道路に接して』と上乗せできるんだ。"}, {"id": "g-leg-028", "cat": "法令上の制限", "topic": "土地区画整理法", "diff": 3, "q": "土地区画整理事業の仮換地に関する次の記述のうち、正しいものはどれか。", "c": ["仮換地が指定されると、従前の宅地の所有者は仮換地を使用収益でき、従前の宅地は使用収益できなくなる。", "仮換地の指定後も従前の宅地を自由に使用できる。", "仮換地では所有権が直ちに移転する。", "仮換地の指定は換地処分と同じ効果を持つ。"], "a": 0, "ex": "仮換地の指定により、従前地の所有者は仮換地を使用収益でき、従前地は使用収益できなくなる。ただし所有権が移転するのは換地処分後。", "kid": "仮の割り当て地が決まると、使えるのはそっち。元の土地は使えなくなるよ。"}, {"id": "g-leg-029", "cat": "法令上の制限", "topic": "用途制限", "diff": 3, "q": "用途地域における建築物の用途制限に関する次の記述のうち、正しいものはどれか。", "c": ["建築物の敷地が2つの用途地域にわたる場合、敷地の過半の属する用途地域の制限が敷地全体に適用される。", "面積の大小にかかわらず厳しい方の制限が適用される。", "この場合はいずれの用途制限も適用されない。", "常に建築主が選択した用途地域の制限による。"], "a": 0, "ex": "敷地が複数の用途地域にわたるときは、敷地の過半が属する用途地域の用途制限が敷地全体に適用される（過半主義）。", "kid": "敷地が2地域にまたがるときは、広い方の地域のルールに従うんだ。"}, {"id": "g-leg-030", "cat": "法令上の制限", "topic": "盛土規制法", "diff": 3, "q": "盛土規制法の規制区域に関する次の記述のうち、正しいものはどれか。", "c": ["都道府県知事等は、宅地造成等に伴い災害が生ずるおそれが大きい区域を宅地造成等工事規制区域として指定できる。", "規制区域は市町村長が指定する。", "規制区域内でも許可を受けずに大規模な盛土を行える。", "規制区域は都市計画区域内にしか指定できない。"], "a": 0, "ex": "都道府県知事等は、宅地造成・特定盛土等により災害のおそれが大きい区域を規制区域に指定できる。区域は都市計画区域の内外を問わず指定でき、区域内の一定工事は許可制。", "kid": "危険な造成が心配な場所を、県が『規制区域』に指定するんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-031", "cat": "法令上の制限", "topic": "都市計画法", "diff": 2, "q": "準都市計画区域に関する次の記述のうち、正しいものはどれか。", "c": ["準都市計画区域には、用途地域や特別用途地区等一定の地域地区を定めることができるが、区域区分（線引き）は定められない。", "準都市計画区域には区域区分を定めなければならない。", "準都市計画区域では建築基準法は適用されない。", "準都市計画区域は市街化を促進するための区域である。"], "a": 0, "ex": "準都市計画区域は、そのまま放置すれば将来の街づくりに支障が生じるおそれのある区域。用途地域等一定の地域地区は定められるが、区域区分は定められない。", "kid": "準都市計画区域では、線引き（市街化の区分）はしないんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-032", "cat": "法令上の制限", "topic": "建築確認", "diff": 2, "q": "建築確認と完了検査に関する次の記述のうち、正しいものはどれか。", "c": ["確認を要する建築物は、工事完了後に完了検査を申請し、原則として検査済証の交付を受けるまで使用できない場合がある。", "完了検査は任意であり受けなくてよい。", "検査済証がなくても特殊建築物を直ちに使用できる。", "完了検査は着工前に行う。"], "a": 0, "ex": "確認を受けた建築物は工事完了後4日以内に完了検査を申請する。特殊建築物等一定のものは、原則として検査済証の交付を受けた後でなければ使用できない。", "kid": "工事が終わったら検査を受け、合格証をもらってから使うんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-033", "cat": "法令上の制限", "topic": "都市計画法", "diff": 3, "q": "地区計画に関する次の記述のうち、正しいものはどれか。", "c": ["地区計画の区域内で建築等を行おうとする者は、原則として着手する30日前までに市町村長へ届け出なければならない。", "地区計画の区域内では届出は不要である。", "地区計画は国土交通大臣が定める。", "地区計画は市街化調整区域には定められない。"], "a": 0, "ex": "地区計画区域内で土地の区画形質の変更や建築物の建築等を行う者は、原則として行為着手の30日前までに市町村長に届け出る。地区計画は市街化調整区域にも定めうる。", "kid": "地区計画のある場所では、建てる30日前までに市に知らせるんだ。"}, {"id": "g-leg-034", "cat": "法令上の制限", "topic": "農地法", "diff": 2, "q": "農地法の適用対象に関する次の記述のうち、正しいものはどれか。", "c": ["現に耕作の目的に供されている土地は、登記上の地目にかかわらず農地として農地法の適用を受ける。", "登記地目が農地でなければ農地法は適用されない。", "耕作されていても登記が宅地なら農地ではない。", "農地かどうかは所有者の主観で決まる。"], "a": 0, "ex": "農地に当たるかは現況主義で判断され、登記上の地目にかかわらず現に耕作されていれば農地として扱われる。", "kid": "実際に畑として使っていれば、登記が何であれ『農地』扱いだよ。"}, {"id": "g-leg-035", "cat": "法令上の制限", "topic": "国土利用計画法", "diff": 3, "q": "国土利用計画法の事後届出が不要となる場合に関する次の記述のうち、正しいものはどれか。", "c": ["当事者の一方又は双方が国・地方公共団体等である場合は、事後届出は不要である。", "贈与による取得でも常に事後届出が必要である。", "相続による取得も事後届出の対象である。", "民間同士の売買では事後届出は一切不要である。"], "a": 0, "ex": "対価を伴う土地売買等の契約が届出対象。当事者に国・地方公共団体等が含まれる場合や、相続・贈与など対価を伴わない権利移転は届出不要。", "kid": "国や自治体が相手なら届出はいらない。相続や贈与も対象外だよ。"}, {"id": "g-leg-036", "cat": "法令上の制限", "topic": "建築基準法総合", "diff": 3, "q": "建築物の敷地と衛生・安全に関する次の記述のうち、正しいものはどれか。", "c": ["建築物の敷地は、これに接する道の境より高くなければならず、建築物の地盤面はこれに接する周囲の土地より高くなければならないのが原則である。", "湿潤な土地でも盛土や地盤改良は不要である。", "居室には採光・換気の開口部を設けなくてよい。", "便所は下水道の有無にかかわらず水洗としなければならない。"], "a": 0, "ex": "敷地は道より高く、地盤面は周囲より高いのが原則で、湿潤地・出水のおそれのある土地では盛土等の措置を要する。居室には一定の採光・換気開口部が必要。", "kid": "敷地は周りより少し高くして、水はけよくするのが基本だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-037", "cat": "法令上の制限", "topic": "用途地域", "diff": 2, "q": "田園住居地域に関する次の記述のうち、正しいものはどれか。", "c": ["田園住居地域は、農業の利便の増進を図りつつ、これと調和した低層住宅の良好な住環境を保護するための地域である。", "田園住居地域は商業の利便を図る地域である。", "田園住居地域には高さ制限がない。", "田園住居地域では農地に関する行為の規制は一切ない。"], "a": 0, "ex": "田園住居地域は、農業の利便と調和した低層住宅の良好な住環境を守る地域で、低層住居専用地域と同様の絶対高さ制限がある。区域内の農地の造成等には一定の規制がある。", "kid": "田園住居地域は『農業と両立する低層住宅地』のための地域だよ。"}, {"id": "g-leg-038", "cat": "法令上の制限", "topic": "開発許可", "diff": 3, "q": "市街化調整区域における開発行為に関する次の記述のうち、正しいものはどれか。", "c": ["市街化調整区域では、農林漁業を営む者の居住用建築物等一定のものを除き、原則として開発許可が必要である。", "市街化調整区域では規模が小さければ許可は不要である。", "市街化調整区域では開発行為が全面的に禁止されている。", "市街化調整区域の開発許可は市町村長が行う。"], "a": 0, "ex": "市街化調整区域では規模にかかわらず原則として開発許可が必要。ただし農林漁業用の一定の建築物やその従事者の住宅等のための開発は許可不要とされる。", "kid": "調整区域は基本『許可が必要』。農林漁業の家などは例外だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-039", "cat": "法令上の制限", "topic": "建築確認", "diff": 3, "q": "建築確認における審査に関する次の記述のうち、正しいものはどれか。", "c": ["建築確認は、建築主事又は指定確認検査機関が、建築計画が建築基準関係規定に適合するかを審査するものである。", "建築確認は建築物の美観のみを審査する。", "指定確認検査機関は建築確認を行えない。", "建築確認では防火・避難に関する規定は審査されない。"], "a": 0, "ex": "建築確認は建築主事又は指定確認検査機関が、建築計画が建築基準関係規定（構造・防火・避難・用途・接道等）に適合するか審査する制度。", "kid": "確認では、法律のルールに合った設計かを役所や機関が調べるんだ。"}, {"id": "g-leg-040", "cat": "法令上の制限", "topic": "建蔽率容積率", "diff": 3, "q": "容積率の算定に関する次の記述のうち、正しいものはどれか。", "c": ["共同住宅の共用の廊下・階段部分は、原則として容積率算定上の延べ面積に算入しない。", "共用廊下・階段は必ず延べ面積に算入する。", "地階は容積率の対象外で一切算入しない。", "容積率の算定に前面道路は関係しない。"], "a": 0, "ex": "共同住宅・老人ホーム等の共用の廊下・階段部分は容積率算定上の延べ面積に算入しない。住宅の地階（一定の要件を満たすもの）は一定割合まで不算入とされる緩和がある。", "kid": "マンションの共用廊下や階段は、容積率の計算に入れないんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-leg-041", "cat": "法令上の制限", "topic": "土地区画整理法", "diff": 2, "q": "土地区画整理事業の施行者に関する次の記述のうち、正しいものはどれか。", "c": ["個人・土地区画整理組合・地方公共団体・都市再生機構等が施行者となりうる。", "施行者は地方公共団体に限られる。", "個人は施行者となれない。", "土地区画整理組合の設立に都道府県知事の認可は不要である。"], "a": 0, "ex": "土地区画整理事業の施行者には、個人、土地区画整理組合、区画整理会社、地方公共団体、都市再生機構等がある。組合の設立には都道府県知事の認可が必要。", "kid": "区画整理は、個人・組合・自治体などいろいろな主体が行えるんだ。"}, {"id": "g-leg-042", "cat": "法令上の制限", "topic": "防火地域", "diff": 2, "q": "防火地域内の建築制限に関する次の記述のうち、正しいものはどれか。", "c": ["防火地域内では、階数や延べ面積が一定以上の建築物は耐火建築物等としなければならない。", "防火地域内ではすべての建築物を耐火建築物にする必要はない。", "防火地域内の看板等は不燃材料でなくてよい。", "防火地域の指定は建築主事が行う。"], "a": 0, "ex": "防火地域内では、階数3以上又は延べ面積100㎡超の建築物は耐火建築物等とし、その他も準耐火建築物等とする必要がある。屋上の看板等は不燃材料で造る等の制限がある。", "kid": "防火地域の大きめの建物は、燃えにくい造り（耐火）にするんだ。"}, {"id": "g-leg-043", "cat": "法令上の制限", "topic": "都市計画法", "diff": 2, "q": "都市計画の決定手続に関する次の記述のうち、正しいものはどれか。", "c": ["都市計画は、原則として都道府県又は市町村が、公聴会の開催・案の縦覧等の手続を経て決定する。", "都市計画は住民が単独で決定できる。", "都市計画の案の縦覧は不要である。", "都市計画はすべて国土交通大臣が決定する。"], "a": 0, "ex": "都市計画は原則として都道府県又は市町村が決定し、住民意見を反映するため公聴会の開催や案の公告・縦覧、意見書提出等の手続を経る。", "kid": "都市計画は県や市が、住民の意見を聞く手続を踏んで決めるんだ。"}, {"id": "g-tax-001", "cat": "税その他", "topic": "不動産取得税", "diff": 2, "q": "不動産取得税（宅建QUESTオリジナル演習001）に関する次の記述として、正しいものはどれか。", "c": ["国が課する国税である。", "不動産を所有している限り毎年課される。", "不動産の取得に対して、取得者に課される道府県税である。", "相続による取得にも課税される。"], "a": 2, "ex": "不動産取得税は不動産の取得者に課される道府県税で、取得の時に一度課される。相続による取得は形式的移転として非課税とされる。", "kid": "不動産を手に入れたときに県が課す税。相続は例外で非課税だよ。"}, {"id": "g-tax-002", "cat": "税その他", "topic": "不動産取得税", "diff": 3, "q": "不動産取得税の課税標準に関する次の記述のうち、正しいものはどれか。", "c": ["実際の売買価格が課税標準となる。", "取得のために要した費用の総額が課税標準となる。", "原則として固定資産課税台帳に登録された価格（固定資産税評価額）が課税標準となる。", "課税標準は取得者が自由に申告した額による。"], "a": 2, "ex": "不動産取得税の課税標準は、原則として固定資産課税台帳に登録された価格（固定資産税評価額）による。売買価格そのものではない。", "kid": "税の計算のもとは『評価額』で、実際の売買価格ではないんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-003", "cat": "税その他", "topic": "固定資産税", "diff": 2, "q": "固定資産税（宅建QUESTオリジナル演習003）に関する次の記述として、正しいものはどれか。", "c": ["国税である。", "その年の12月31日時点の所有者に課される。", "毎年1月1日現在の固定資産の所有者に課される市町村税である。", "納税義務者は年の途中で不動産を取得した者に限られる。"], "a": 2, "ex": "固定資産税は毎年1月1日（賦課期日）現在の固定資産課税台帳上の所有者に課される市町村税。年の途中で売買しても納税義務者は原則として1月1日の所有者。", "kid": "1月1日に持っていた人が、その年の固定資産税を払うんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-004", "cat": "税その他", "topic": "固定資産税", "diff": 3, "q": "固定資産税の住宅用地に対する課税標準の特例に関する次の記述のうち、正しいものはどれか。", "c": ["住宅用地でも特例はなく、更地と同じ課税標準である。", "住宅用地の特例は事業用の土地にも適用される。", "住宅用地については、課税標準を軽減する特例が設けられている。", "住宅用地の特例は取得の年のみ適用される。"], "a": 2, "ex": "住宅用地には課税標準を軽減する特例（小規模住宅用地等）があり、税負担が軽くなる。事業用地には適用されない。", "kid": "人が住む土地は税が軽くなる特例があるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-005", "cat": "税その他", "topic": "登録免許税", "diff": 2, "q": "登録免許税（宅建QUESTオリジナル演習005）に関する次の記述として、正しいものはどれか。", "c": ["市町村が課する地方税である。", "不動産の取得それ自体に課される。", "登記を受けることに対して課される国税である。", "所有権移転登記には課されない。"], "a": 2, "ex": "登録免許税は登記・登録等を受けることに対して課される国税。所有権保存・移転登記、抵当権設定登記等に課される。", "kid": "登記をするときにかかる国の税金だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-006", "cat": "税その他", "topic": "登録免許税", "diff": 3, "q": "登録免許税の課税標準に関する次の記述のうち、正しいものはどれか。", "c": ["売買代金が課税標準となる。", "抵当権設定登記では債務者の年収が課税標準となる。", "不動産の所有権に関する登記の課税標準は、原則として固定資産税評価額を基礎とする不動産の価額である。", "課税標準は登記申請者が任意に定める。"], "a": 2, "ex": "所有権に関する登記の課税標準は、原則として固定資産課税台帳の価格を基礎とする不動産の価額。抵当権設定登記は債権金額が課税標準となる。", "kid": "登記の税も『評価額』が計算のもと。売買価格じゃないよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-007", "cat": "税その他", "topic": "印紙税", "diff": 2, "q": "印紙税（宅建QUESTオリジナル演習007）に関する次の記述として、正しいものはどれか。", "c": ["契約書ではなく登記に対して課される。", "印紙をはり忘れても何ら不利益はない。", "課税文書の作成者に課される国税で、不動産の売買契約書等が課税対象となる。", "国が作成した文書にも常に課税される。"], "a": 2, "ex": "印紙税は課税文書の作成者に課される国税。不動産売買契約書や請負契約書等が課税対象。納付を怠ると過怠税が課される。国等が作成する一定文書は非課税。", "kid": "契約書などの書類にかかる税。はり忘れるとペナルティがあるよ。"}, {"id": "g-tax-008", "cat": "税その他", "topic": "印紙税", "diff": 3, "q": "不動産売買契約書に係る印紙税に関する次の記述のうち、正しいものはどれか。", "c": ["契約書を2通作成した場合でも、印紙税は1通分でよい。", "記載金額のない契約書は課税されない。", "契約書に記載された金額が大きいほど、原則として税額が高くなる階級定額税率が採られている。", "売主のみが納税義務を負い、買主は負わない。"], "a": 2, "ex": "不動産売買契約書の印紙税は記載金額に応じた階級定額税率。契約書を複数通作成すればそれぞれが課税文書となる。作成者（当事者双方）が連帯して納税義務を負う。", "kid": "金額が大きい契約書ほど印紙代も高くなる仕組みだよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-009", "cat": "税その他", "topic": "所得税と特例", "diff": 3, "q": "居住用財産を譲渡した場合の3,000万円特別控除（宅建QUESTオリジナル演習009）に関する次の記述として、正しいものはどれか。", "c": ["所有期間が10年を超えていなければ適用されない。", "投資用に購入した賃貸マンションの譲渡にも適用される。", "一定の居住用財産の譲渡について、所有期間の長短にかかわらず譲渡所得から最高3,000万円を控除できる特例である。", "配偶者へ譲渡した場合にも適用される。"], "a": 2, "ex": "居住用財産の3,000万円特別控除は、自己の居住用財産の譲渡について所有期間を問わず適用できる。配偶者・直系血族等特別関係者への譲渡は適用除外。", "kid": "マイホームを売った利益から最大3000万円を差し引ける優遇だよ。"}, {"id": "g-tax-010", "cat": "税その他", "topic": "地価公示と鑑定", "diff": 2, "q": "地価公示に関する次の記述のうち、正しいものはどれか。", "c": ["地価公示は各市町村が実施する。", "公示区域は都市計画区域に限られる。", "土地鑑定委員会が標準地の正常な価格を判定し、公示するもので、一般の土地取引の指標となる。", "公示価格は毎年10月1日時点の価格である。"], "a": 2, "ex": "地価公示は土地鑑定委員会が標準地について毎年1月1日時点の正常な価格を判定・公示する制度で、一般の土地取引や公共事業用地取得の指標となる。", "kid": "国が『この土地の標準価格はこれ』と毎年示す目安の制度だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-011", "cat": "税その他", "topic": "地価公示と鑑定", "diff": 3, "q": "地価公示の効力に関する次の記述のうち、正しいものはどれか。", "c": ["一般の土地取引では公示価格で取引することが義務づけられる。", "不動産鑑定士は公示価格を規準とする必要はない。", "公示区域内で土地の取引を行う者は、公示価格を指標として取引するよう努めなければならない。", "公示価格は相続税評価額と常に一致する。"], "a": 2, "ex": "公示区域内で土地取引を行う者は、公示価格を指標として取引するよう努める義務（努力義務）がある。強制ではない。鑑定評価では公示価格を規準とする場面がある。", "kid": "公示価格は『できるだけ参考にしてね』という目安で、強制ではないよ。"}, {"id": "g-tax-012", "cat": "税その他", "topic": "住宅金融支援機構", "diff": 2, "q": "独立行政法人住宅金融支援機構（宅建QUESTオリジナル演習012）に関する次の記述として、正しいものはどれか。", "c": ["機構は一般の個人向け住宅ローンの直接融資を主たる業務としている。", "機構は住宅の建設・購入資金の貸付債権の証券化支援業務を行わない。", "機構は、民間金融機関の住宅ローン債権を買い取る等の証券化支援業務を主たる業務の一つとしている。", "機構は災害復興のための融資を行うことはできない。"], "a": 2, "ex": "住宅金融支援機構は、民間の長期固定住宅ローン（フラット35等）を支える証券化支援業務を柱とする。災害復興住宅資金等の直接融資も一定範囲で行う。", "kid": "機構は民間ローンを後押しする役割が中心なんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-013", "cat": "税その他", "topic": "景品表示法", "diff": 2, "q": "不動産の表示に関する公正競争規約（景品表示法）に関する次の記述のうち、正しいものはどれか。", "c": ["徒歩による所要時間は、実際の歩行速度に応じ任意に表示してよい。", "新築とは建築後3年以内の建物をいう。", "徒歩による所要時間は、道路距離80mにつき1分として算出し、端数は1分に切り上げて表示する。", "おとり広告も、実在する物件を1件でも用意すれば許される。"], "a": 2, "ex": "徒歩所要時間は道路距離80mにつき1分で計算し、端数は切り上げる。新築は建築後1年未満かつ未使用のものをいう。おとり広告は禁止。", "kid": "『駅から徒歩◯分』は80m=1分で計算。端数は切り上げるルールだよ。"}, {"id": "g-tax-014", "cat": "税その他", "topic": "土地建物の知識", "diff": 1, "q": "宅地としての土地の適否に関する次の記述のうち、最も適当なものはどれか。", "c": ["谷底低地や旧河道は、地盤が安定し宅地に最も適している。", "急傾斜地は、崖崩れの心配がなく宅地に適している。", "台地・段丘は一般に地盤が安定し、宅地として比較的適している。", "埋立地は液状化の心配がないため常に宅地に適する。"], "a": 2, "ex": "台地・段丘は地盤が比較的安定し宅地に適する。谷底低地・旧河道・埋立地は軟弱地盤や液状化のおそれがあり、急傾斜地は崖崩れの危険がある。", "kid": "高くて平らな台地は地盤が良く、家を建てるのに向いているよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-015", "cat": "税その他", "topic": "土地建物の知識", "diff": 1, "q": "建物の構造に関する次の記述のうち、最も適当なものはどれか。", "c": ["木造は鉄筋コンクリート造より耐火性に優れる。", "鉄骨造は錆に強く、防錆処理は不要である。", "鉄筋コンクリート造は、圧縮に強いコンクリートと引張りに強い鉄筋を組み合わせた構造である。", "免震構造は地震の揺れを建物に直接伝える構造である。"], "a": 2, "ex": "鉄筋コンクリート造（RC）は、圧縮に強いコンクリートと引張りに強い鉄筋を組み合わせて双方の弱点を補う。免震は揺れを建物に伝えにくくする構造。", "kid": "コンクリートと鉄筋は弱点が逆。合わせると強い建物になるんだ。"}, {"id": "g-tax-016", "cat": "税その他", "topic": "不動産取得税", "diff": 2, "q": "不動産取得税の免税点に関する次の記述のうち、正しいものはどれか。", "c": ["取得価格にかかわらず必ず課税される。", "免税点は取得の種類を問わず一律である。", "課税標準額が一定の免税点未満の場合には、不動産取得税は課されない。", "免税点は国が全国一律の売買価格で定める。"], "a": 2, "ex": "不動産取得税には免税点があり、課税標準額が土地・家屋の区分に応じた一定額未満のときは課税されない。", "kid": "評価額がとても小さいと、取得税はかからないラインがあるんだ。"}, {"id": "g-tax-017", "cat": "税その他", "topic": "固定資産税", "diff": 3, "q": "固定資産税の縦覧・審査に関する次の記述のうち、正しいものはどれか。", "c": ["納税者は固定資産課税台帳を一切閲覧できない。", "評価に不服があっても争う手段はない。", "納税者は固定資産課税台帳を閲覧でき、評価額に不服があるときは固定資産評価審査委員会へ審査を申し出ることができる。", "審査の申出は市町村長に対して行う。"], "a": 2, "ex": "納税者は台帳の閲覧や縦覧ができ、評価額に不服があるときは固定資産評価審査委員会に審査の申出をすることができる。", "kid": "評価に納得できなければ、専門の委員会に見直しを求められるんだ。"}, {"id": "g-tax-018", "cat": "税その他", "topic": "所得税と特例", "diff": 3, "q": "譲渡所得の課税に関する次の記述のうち、正しいものはどれか。", "c": ["土地・建物の譲渡所得は他の所得と合算する総合課税である。", "長期・短期の区分は所有期間にかかわらず一律である。", "土地建物等の譲渡所得は分離課税とされ、所有期間により長期・短期に区分して税率が異なる。", "譲渡損失はいかなる場合も他の所得と損益通算できる。"], "a": 2, "ex": "土地建物等の譲渡所得は申告分離課税で、譲渡年の1月1日時点の所有期間が5年超なら長期、5年以下なら短期として税率が異なる。損益通算には一定の制限がある。", "kid": "不動産を売った利益は、持っていた期間で税率が変わるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-019", "cat": "税その他", "topic": "登録免許税", "diff": 2, "q": "登録免許税の住宅用家屋の軽減に関する次の記述のうち、正しいものはどれか。", "c": ["軽減措置は事業用の店舗にも適用される。", "軽減を受けるのに要件は一切ない。", "一定の要件を満たす自己居住用の住宅用家屋の登記については、税率の軽減措置が設けられている。", "軽減措置は法人が取得する社宅にも適用される。"], "a": 2, "ex": "自己の居住の用に供する一定要件（床面積等）を満たす住宅用家屋の所有権保存・移転登記等には、登録免許税の税率軽減がある。事業用や投資用は対象外。", "kid": "自分が住む家の登記なら、条件を満たせば税が軽くなるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-020", "cat": "税その他", "topic": "地方税の整理", "diff": 3, "q": "不動産に関する税の課税団体に関する次の記述のうち、正しいものはどれか。", "c": ["不動産取得税・固定資産税はいずれも国税である。", "固定資産税は道府県税、不動産取得税は市町村税である。", "不動産取得税は道府県税、固定資産税・都市計画税は市町村税である。", "登録免許税・印紙税はいずれも市町村税である。"], "a": 2, "ex": "不動産取得税は道府県税、固定資産税・都市計画税は市町村税、登録免許税・印紙税は国税。課税団体の整理は頻出。", "kid": "取得税は県、固定資産税は市。登記・印紙は国、と整理しよう。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-021", "cat": "税その他", "topic": "不動産取得税", "diff": 2, "q": "不動産取得税の『取得』に関する次の記述のうち、正しいものはどれか。", "c": ["取得とは登記を経由した場合のみをいう。", "家屋を新築しても取得税は課されない。", "売買・交換・贈与・新築・増改築等による取得が課税対象となり、登記の有無は問わない。", "取得税は取得後5年を経過してから課される。"], "a": 2, "ex": "不動産取得税は売買・交換・贈与・新築・増改築等による事実上の取得に課され、登記の有無を問わない。相続等一定の取得は非課税。", "kid": "買っても建てても『取得』。登記していなくても税はかかるよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-tax-022", "cat": "税その他", "topic": "所得税と特例", "diff": 3, "q": "居住用財産の買換え特例と3,000万円特別控除に関する次の記述のうち、正しいものはどれか。", "c": ["両者は常に併用できる。", "買換え特例は所有期間を問わず適用される。", "特定の居住用財産の買換え特例には所有期間・居住期間等の要件があり、3,000万円特別控除等とは選択適用が原則である。", "買換え特例は取得価格の全額をその年の必要経費にできる制度である。"], "a": 2, "ex": "特定の居住用財産の買換え特例は所有期間・居住期間等の要件を満たす場合に課税を繰り延べる制度で、3,000万円特別控除等とは原則選択適用となる。", "kid": "買い換えの優遇と3000万円控除は、どちらか選ぶのが基本だよ。"}, {"id": "g-tax-023", "cat": "税その他", "topic": "印紙税", "diff": 2, "q": "印紙税の納付・過怠税に関する次の記述のうち、正しいものはどれか。", "c": ["印紙をはらなくても契約自体が無効となる。", "消印は不要である。", "印紙をはり消印して納付し、これを怠ると過怠税が課されるが、契約の効力自体には影響しない。", "過怠税は納付すべき印紙税額と同額である。"], "a": 2, "ex": "印紙税は文書に印紙をはり消印して納付する。納付を怠ると過怠税（原則、本来の税額とその2倍相当の合計＝3倍）が課されるが、契約の私法上の効力には影響しない。", "kid": "印紙を忘れても契約は有効。でもペナルティ（過怠税）を取られるんだ。"}, {"id": "g-tax-024", "cat": "税その他", "topic": "地価公示と鑑定", "diff": 2, "q": "不動産の鑑定評価（宅建QUESTオリジナル演習024）に関する次の記述として、正しいものはどれか。", "c": ["鑑定評価の手法は取引事例比較法のみである。", "収益還元法は自用の住宅地には一切適用できない。", "鑑定評価には原価法・取引事例比較法・収益還元法があり、対象や目的に応じて適用・併用される。", "正常価格と限定価格は同じ概念である。"], "a": 2, "ex": "鑑定評価の三手法は原価法（積算価格）・取引事例比較法（比準価格）・収益還元法（収益価格）で、対象不動産の性格に応じて適用・併用する。正常価格と限定価格は異なる価格概念。", "kid": "土地の値付けには『原価・事例・収益』の3つの見方があるんだ。"}, {"id": "g-tax-025", "cat": "税その他", "topic": "土地建物の知識", "diff": 1, "q": "自然災害と土地に関する次の記述のうち、最も適当なものはどれか。", "c": ["扇状地の中央部は水はけが悪く、宅地に最も適する。", "断層近傍は地盤が特に安定している。", "旧河道や埋立地・盛土地は、地震時に液状化や不同沈下を起こしやすい。", "地すべり地は宅地開発に最適である。"], "a": 2, "ex": "旧河道・埋立地・盛土地などの軟弱地盤は、地震時に液状化や不同沈下を起こしやすく宅地には注意を要する。地すべり地・断層近傍・急傾斜地も危険。", "kid": "昔川だった所や埋め立て地は、地震で沈んだり液状化しやすいんだ。"}, {"id": "g-tax-026", "cat": "税その他", "topic": "土地建物の知識", "diff": 2, "q": "建築材料・構造に関する次の記述のうち、最も適当なものはどれか。", "c": ["木材は乾燥している方が強度が低い。", "鉄は熱に強く、火災でも強度が落ちない。", "木材は含水率が低い（乾燥した）ものの方が強度が高く、鉄は高温で強度が低下する。", "コンクリートは引張りに強く圧縮に弱い。"], "a": 2, "ex": "木材は乾燥したものほど強度が高い。鉄は高温になると強度が著しく低下するため耐火被覆が必要。コンクリートは圧縮に強く引張りに弱い。", "kid": "木は乾いている方が丈夫。鉄は火に弱くて熱でやわらかくなるんだ。"}, {"id": "g-tax-027", "cat": "税その他", "topic": "固定資産税", "diff": 2, "q": "固定資産税の新築住宅に対する減額に関する次の記述のうち、正しいものはどれか。", "c": ["新築住宅でも税の減額は一切ない。", "減額は取得者の申告額に応じて自由に決まる。", "一定の要件を満たす新築住宅については、一定期間、家屋の固定資産税が減額される措置がある。", "減額措置は非居住用の倉庫にも適用される。"], "a": 2, "ex": "一定の要件（床面積等）を満たす新築住宅は、新築後の一定期間、家屋分の固定資産税が減額される特例がある。居住用が対象。", "kid": "条件を満たす新築の家は、しばらく固定資産税が安くなるんだ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-cr-001", "cat": "宅建業法", "topic": "35条37条比較", "diff": 3, "q": "重要事項説明（35条）と契約書面（37条）の両方に関する次の記述のうち、正しいものはどれか。", "c": ["代金の額は35条書面の必須事項だが37条書面には記載しない。", "35条・37条いずれも契約成立後に交付する。", "35条書面は契約前に説明・交付し、37条書面は契約後遅滞なく交付する点で交付時期が異なる。", "いずれの書面にも宅地建物取引士の記名は不要である。"], "a": 2, "ex": "35条は契約前、37条は契約後という交付時期の違いが最重要。代金額は37条の必須事項で35条では必須でない。両書面とも宅建士の記名が必要。", "kid": "35条は契約前の説明、37条は契約後の契約書。時期が逆と覚えよう。"}, {"id": "g-cr-002", "cat": "宅建業法", "topic": "報酬額", "diff": 3, "q": "媒介契約と報酬に関する次の記述のうち、正しいものはどれか。代金は400万円を超えるものとする。", "c": ["専任媒介契約では報酬の上限が一般媒介より高くなる。", "報酬は媒介契約の種類により上限が異なる。", "報酬の上限は媒介契約の種類にかかわらず『代金×3％＋6万円』（別途消費税）で計算される。", "専属専任媒介では報酬を代金の1割まで受領できる。"], "a": 2, "ex": "報酬の上限は媒介契約の種類（一般・専任・専属専任）とは無関係で、代金額に応じた速算式で決まる。400万円超は3％＋6万円。", "kid": "契約の種類が違っても、仲介料の上限計算は同じ式だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-cr-003", "cat": "宅建業法", "topic": "手付金の制限", "diff": 3, "q": "クーリング・オフと手付に関する次の記述のうち、正しいものはどれか。買主は宅建業者でない。", "c": ["クーリング・オフで解除した場合、売主は損害賠償を請求できる。", "手付を放棄しなければクーリング・オフはできない。", "クーリング・オフによる解除では、売主は受領した手付金等を速やかに返還しなければならず、損害賠償や違約金は請求できない。", "クーリング・オフと手付解除は同一の制度である。"], "a": 2, "ex": "クーリング・オフは要件を満たせば無条件で解除でき、売主は手付金等を返還し、損害賠償・違約金を請求できない。手付放棄による解除とは別の制度。", "kid": "クーリング・オフなら、お金は返ってくるし違約金も取られないよ。"}, {"id": "g-cr-004", "cat": "権利関係", "topic": "代理", "diff": 3, "q": "代理と登記（対抗要件）に関する次の記述のうち、正しいものはどれか。", "c": ["代理人が売買契約を締結した場合、その効果は代理人自身に帰属する。", "不動産の二重譲渡では、先に契約した者が常に所有権を主張できる。", "代理人が本人のために締結した売買の効果は本人に帰属し、第三者への対抗には原則として登記が必要である。", "登記がなくても、契約が先であれば第三者に常に対抗できる。"], "a": 2, "ex": "有効な代理行為の効果は本人に帰属する。不動産物権変動の第三者対抗要件は登記であり、二重譲渡では原則として先に登記を備えた者が優先する。", "kid": "代理で買っても持ち主は本人。ただし他人に主張するには登記が必要だよ。"}, {"id": "g-cr-005", "cat": "権利関係", "topic": "抵当権", "diff": 3, "q": "抵当権と賃貸借の関係に関する次の記述のうち、正しいものはどれか。", "c": ["抵当権設定後に対抗要件を備えた賃借人は、常に競売の買受人に賃借権を対抗できる。", "抵当権に後れる建物賃借人は、競売後直ちに退去しなければならない。", "抵当権に後れる建物賃借人は、競売による買受けの時から6か月間は明渡しが猶予される。", "抵当権者の同意があっても賃借権を登記することはできない。"], "a": 2, "ex": "抵当権設定登記に後れる建物賃借人は買受人に賃借権を対抗できないが、買受けの時から6か月間の明渡猶予がある。抵当権者の同意登記があれば賃借権を対抗できる場合もある。", "kid": "抵当が先だと借主は負けるけど、いきなり追い出されず半年の猶予があるんだ。"}, {"id": "g-cr-006", "cat": "権利関係", "topic": "相続", "diff": 3, "q": "借地借家法と相続に関する次の記述のうち、正しいものはどれか。", "c": ["借地人が死亡すると借地権は当然に消滅する。", "建物賃借人が死亡すると賃借権は相続されない。", "借地権・建物賃借権は財産権として相続の対象となり、相続人に承継される。", "相続人が複数いる場合、借地権は長男のみが承継する。"], "a": 2, "ex": "借地権・建物賃借権は財産権であり相続の対象となる。相続人が複数の場合は共同相続され、遺産分割によって帰属が定まる。", "kid": "土地や部屋を借りる権利も財産だから、亡くなれば相続されるんだ。"}, {"id": "g-cr-007", "cat": "法令上の制限", "topic": "都市計画法", "diff": 3, "q": "都市計画法と建築基準法に関する次の記述のうち、正しいものはどれか。", "c": ["用途地域は建築基準法により定められる。", "建蔽率・容積率は都市計画法により建築物ごとに許可される。", "用途地域は都市計画法で定められ、その地域に応じた用途・建蔽率・容積率等の制限は建築基準法で具体的に規律される。", "都市計画区域外では建築基準法の規定は一切適用されない。"], "a": 2, "ex": "用途地域の指定は都市計画法、建築物の用途・建蔽率・容積率・高さ等の具体的規制は建築基準法という役割分担がある。都市計画区域外でも建築基準法の一部（単体規定等）は適用される。", "kid": "『どんな地域か』は都市計画法、『建て方のルール』は建築基準法が決めるんだ。"}, {"id": "g-cr-008", "cat": "法令上の制限", "topic": "農地法", "diff": 3, "q": "農地法と国土利用計画法に関する次の記述のうち、正しいものはどれか。", "c": ["農地を農地のまま売買する場合、農地法の許可も国土法の届出も一切不要である。", "農地法3条の許可を受ければ、面積にかかわらず国土法の届出は不要となる。", "農地の権利移動には農地法の許可が必要であり、これとは別に一定面積以上の土地取引では国土利用計画法上の届出が問題となる。", "市街化区域内の農地の転用には農地法5条の許可が必要である。"], "a": 2, "ex": "農地法（3条・4条・5条）の規律と国土利用計画法の事後届出は別制度で、それぞれ要件を満たせば双方が問題となりうる。市街化区域内農地の転用は農業委員会への届出で足りる（許可不要）。", "kid": "農地のルールと、土地取引の面積ルールは別物。両方チェックが必要なことがあるよ。"}, {"id": "g-cr-009", "cat": "税その他", "topic": "不動産取得税", "diff": 3, "q": "不動産取得税と固定資産税の課税団体と課税時期に関する次の記述のうち、正しいものはどれか。", "c": ["いずれも国税である。", "不動産取得税は毎年課され、固定資産税は取得時に一度だけ課される。", "不動産取得税は取得の時に課される道府県税、固定資産税は所有者に毎年課される市町村税である。", "いずれも取得者ではなく譲渡人に課される。"], "a": 2, "ex": "不動産取得税は不動産を取得した際に課される道府県税、固定資産税は1月1日時点の所有者に毎年課される市町村税。課税団体・課税時期が異なる。", "kid": "取得税は買ったとき1回（県）、固定資産税は毎年（市）。かかり方が違うんだ。"}, {"id": "g-cr-010", "cat": "税その他", "topic": "印紙税", "diff": 2, "q": "印紙税と登録免許税に関する次の記述のうち、正しいものはどれか。", "c": ["いずれも市町村税である。", "売買契約書には登録免許税が課される。", "印紙税は契約書等の文書に課され、登録免許税は登記を受けることに対して課される国税である。", "印紙税は不動産の登記に対して課される。"], "a": 2, "ex": "印紙税は課税文書の作成に課される国税、登録免許税は登記・登録等を受けることに課される国税。課税対象（文書か登記か）が異なる。", "kid": "印紙税は『書類』にかかる税、登録免許税は『登記』にかかる税だよ。"}, {"id": "g-cr-011", "cat": "宅建業法", "topic": "重要事項説明", "diff": 3, "q": "重要事項説明と37条書面の交付相手に関する次の記述のうち、正しいものはどれか。", "c": ["35条・37条いずれも買主にのみ交付する。", "35条書面は売主・買主双方に交付する。", "35条書面は取得者・借主等（買主側）に説明・交付し、37条書面は契約の両当事者に交付する。", "37条書面は借主には交付しない。"], "a": 2, "ex": "35条説明は物件を取得・賃借しようとする者（買主・借主）に対して行う。37条書面は契約の両当事者に交付する。交付先の範囲が異なる点に注意。", "kid": "説明（35条）は買う側へ、契約書（37条）は両者へ渡すんだ。"}, {"id": "g-cr-012", "cat": "権利関係", "topic": "債務不履行と解除", "diff": 3, "q": "売買契約の解除と手付に関する次の記述のうち、正しいものはどれか（当事者は宅建業者でない一般人とする）。", "c": ["相手方が履行に着手した後でも、手付放棄により自由に解除できる。", "債務不履行があっても、手付を交付していれば法定解除はできない。", "手付解除は相手方が履行に着手するまで可能であり、これとは別に債務不履行があれば法定解除ができる。", "手付解除をした場合には、別途損害賠償も当然に請求できる。"], "a": 2, "ex": "手付解除は相手方の履行着手前まで可能（買主は放棄、売主は倍返し）。これとは別に、債務不履行があれば催告等の要件を満たして法定解除できる。手付解除では原則として損害賠償請求はできない。", "kid": "手付でのキャンセルは相手が動き出す前まで。契約破りがあれば別途解除できるよ。"}, {"id": "g-cr-013", "cat": "法令上の制限", "topic": "開発許可", "diff": 3, "q": "開発許可と建築確認に関する次の記述のうち、正しいものはどれか。", "c": ["開発許可を受ければ建築確認は不要となる。", "建築確認を受ければ開発許可は不要となる。", "開発許可は一定規模以上の開発行為に、建築確認は建築物の計画に対して求められ、それぞれ別個に必要となりうる。", "いずれも都道府県知事が行う点で同一の手続である。"], "a": 2, "ex": "開発許可は土地の区画形質の変更（開発行為）に対する規制、建築確認は建築物の計画の適法性審査で、目的も審査主体も異なり別個に必要となりうる。", "kid": "土地をいじる許可と、建物を建てる確認は別物。両方いることもあるんだ。"}, {"id": "g-cr-014", "cat": "権利関係", "topic": "物権変動と対抗要件", "diff": 3, "q": "契約不適合責任と登記に関する次の記述のうち、正しいものはどれか。", "c": ["買主は登記を備えなければ、契約不適合の担保責任を売主に主張できない。", "契約不適合の通知期間は登記の時から進行する。", "契約不適合責任の追及と登記の具備は別問題であり、買主は登記の有無にかかわらず売主に担保責任を追及できる。", "契約不適合があれば、買主は常に契約を無条件で解除できる。"], "a": 2, "ex": "売主への契約不適合責任（追完・代金減額・損害賠償・解除）の追及と、第三者対抗のための登記具備は別問題。買主は登記の有無にかかわらず契約相手である売主に責任追及できる。", "kid": "『登記があるか』と『売主に文句を言えるか』は別の話だよ。試験でも狙われやすい基本ポイントだよ。"}, {"id": "g-cr-015", "cat": "税その他", "topic": "所得税と特例", "diff": 3, "q": "居住用財産の譲渡と地価公示に関する次の記述のうち、正しいものはどれか。", "c": ["地価公示価格は譲渡所得の課税標準そのものである。", "居住用財産の3,000万円特別控除は事業用不動産にも適用される。", "居住用財産の譲渡には一定の特別控除等の特例があり、地価公示価格は取引の指標となるが課税標準そのものではない。", "地価公示は市町村が実施する。"], "a": 2, "ex": "居住用財産の譲渡には3,000万円特別控除等の特例がある。地価公示は一般の土地取引の指標等となるが、譲渡所得の課税標準を直接定めるものではなく、実施主体は国（土地鑑定委員会）。", "kid": "マイホームを売ると税の優遇がある。公示価格は目安で、税額そのものではないよ。"}];

 rule:"登録の移転は、他の都道府県の事務所に従事し、または従事しようとするときに任意で申請できます（19条の2）。事務禁止処分の期間中は申請できず、移転後の士証の有効期間は従前の残存期間です。",

    ["Cは、モデルルームに報酬額を掲示しなければならない",["制度混同"],["jimusho"],"報酬額の掲示が必要なのは事務所だけです。案内所には不要です。","jimusho"],
    ["申込みを受けるだけで契約は締結しないので、専任の宅建士を置く必要はない",["要件見落とし"],["jimusho"],"申込みを受ける場合も専任宅建士が必要です。","jimusho"],
    ["Cは、モデルルームに従業者名簿と帳簿を備えなければならない",["制度混同"],["jimusho"],"名簿・帳簿は事務所に備えるものです。案内所には不要です。","jimusho"]],

{id:"g2-027",topic:"menkyo",sub:"法人役員の欠格",diff:3,type:"事例",sec:55,freq:2,
 q:"法人である宅地建物取引業者Dの取締役Eが、宅地建物取引業法違反により罰金の刑に処せられた場合に関する次の記述のうち、正しいものはどれか。",
 c:["Dは、Eが役員である限り、免許を取り消される",
    ["役員個人の刑罰は、法人Dの免許には影響しない",["適用範囲誤認"],["menkyo"],"役員が欠格事由に該当すると法人も欠格となります。","menkyo"],
    ["Eが罰金を完納すれば、直ちにDの欠格事由は解消する",["期間混同"],["menkyo"],"刑の執行終了から5年を経過する必要があります。","menkyo"],
    ["宅建業法違反による罰金は、そもそも欠格事由に当たらない",["要件見落とし"],["menkyo"],"宅建業法違反等による罰金刑は欠格事由に当たります。","menkyo"]],
 ex:"役員が欠格事由に該当すると、その法人も免許を受けられず、免許が取り消されます。",

 rule:"法人の役員・政令使用人が欠格事由に該当する場合、その法人も免許を受けられません（5条1項12号）。宅建業法違反・暴力的犯罪等による罰金刑は、刑の執行終了等から5年間欠格です。",
 mem:"役員がアウトなら会社もアウト。",
 rel:["menkyo"],pre:["menkyo"]},

    ["Fは、宅地建物取引士証を返納しなければならない",["制度混同"],["touroku"],"返納は登録消除・失効の場合です。事務禁止処分では「提出」です。","touroku"],

    ["Fは、処分期間中であっても登録の移転を申請できる",["例外見落とし"],["touroku"],"事務禁止処分の期間中は登録の移転ができません。","touroku"]],
 ex:"事務禁止処分を受けたときは士証を「提出」し、登録が消除されたときは「返納」します。",

    ["建物の貸借では、台所や浴室の設備の状況を説明する必要はない",["要件見落とし"],["juyo"],"貸借特有の説明事項を見落としています。","juyo"],
    ["説明の相手方は貸主であり、借主に対して行う必要はない",["主体混同"],["juyo"],"説明の相手方は取得者・借主となろうとする者です。","juyo"]],
 ex:"貸借では、設備の整備状況・契約期間・更新・敷金の精算などが説明事項になります。",

    ["Hは、37条書面の交付に際し、宅地建物取引士に説明をさせなければならない",["制度混同"],["juyo"],"37条書面に説明義務はありません。記名が必要なだけです。","doc3537"],
    ["37条書面には宅地建物取引士の記名は不要である",["要件見落とし"],["doc3537"],"37条書面にも宅建士の記名が必要です。","doc3537"]],

    ["心裡留保による意思表示は、取り消すことができる",["無効と取消しの混同"],["ishi"],"心裡留保の効果は取消しではなく、要件を満たした場合の無効です。","ishi"],
    ["相手方が真意でないことを知っていた場合でも、意思表示は有効である",["条件見落とし"],["ishi"],"相手方が悪意の場合は無効となります。","ishi"]],

    ["善意の第三者に対しても、無効を主張することができる",["第三者保護要件の混同"],["ishi"],"善意の第三者には無効を対抗できません。","ishi"],
    ["第三者が保護されるためには、善意であることに加えて無過失であることが必要である",["善意と善意無過失の混同"],["ishi"],"通謀虚偽表示の第三者保護に無過失は要求されません。","ishi"]],
 ex:"通謀虚偽表示は当事者間では無効ですが、その無効は善意の第三者に対抗できません（無過失は不要）。",

{id:"k1-012",topic:"seigen",sub:"未成年者の例外",diff:2,type:"基本知識",sec:50,freq:3,

    ["負担のない贈与を受ける契約も、同意がなければ取り消すことができる",["法定代理人同意の混同"],["seigen"],"単に権利を得る行為に当たるため取り消せません。","seigen"]],

 rule:"単に権利を得または義務を免れる法律行為（民法5条1項但書）、処分を許された財産の処分（5条3項）、許可された営業に関する行為（6条1項）は、未成年者が単独でしても取り消すことができません。",

    ["成年被後見人は、いかなる法律行為も単独ですることができない",["被後見人と被保佐人の混同"],["seigen"],"日常生活に関する行為は単独で確定的に有効にできます。","seigen"]],

 rule:"成年被後見人の法律行為は取り消すことができますが、日用品の購入その他日常生活に関する行為はこの限りではありません（民法9条）。成年後見人には同意権がありません。",

    ["制限行為能力者が代理人としてした行為は、常に取り消すことができる",["代理人と本人の判断基準混同"],["dairi"],"行為能力の制限を理由とする取消しはできません。","dairi"],
    ["代理人が制限行為能力者である場合、本人は代理権を与えることができない",["代理人と本人の判断基準混同"],["dairi"],"制限行為能力者にも代理権を与えることができます。","dairi"]],

{id:"k1-032",topic:"jikou",sub:"取得時効の要件",diff:2,type:"基本知識",sec:50,freq:3,
 q:"取得時効の期間と善意無過失の判断時期に関する次の記述のうち、正しいものはどれか。",
 c:["占有の開始時に善意かつ無過失であれば10年、そうでなければ20年の占有により所有権を取得しうる",
    ["占有の途中で悪意になった場合、10年の取得時効は認められない",["善意と善意無過失の混同"],["jikou"],"善意無過失は占有開始時に判断され、途中で悪意になっても影響しません。","jikou"],
    ["賃借人として占有している者も、20年経過すれば所有権を時効取得できる",["要件不足"],["jikou"],"所有の意思がないため時効取得できません。","jikou"],
    ["占有開始時に善意であれば、過失があっても10年で取得できる",["善意と善意無過失の混同"],["jikou"],"10年の短期取得時効には無過失も必要です。","jikou"]],
 ex:"善意無過失は占有開始時に判断し10年、それ以外は20年。所有の意思が必要です。",
 kid:"3つの条件があります。①自分の物として使っていること（借りているつもりではダメ）②おだやかに、隠さずに使っていること③期間が過ぎること。期間は、使い始めたときに「自分の土地だ」と信じ、そう信じたことに落ち度がなければ10年。そうでなければ20年です。大事なのは「使い始めたとき」で判断することで、途中で気づいても10年のままです。",
 rule:"20年間所有の意思をもって平穏かつ公然と占有した者は所有権を取得し、占有開始時に善意無過失であれば10年で足ります（民法162条）。善意無過失は占有開始時に判断されます。",
 mem:"開始時に善意無過失なら10年・それ以外20年。",
 rel:["jikou"],pre:["jikou"]},

{id:"k1-040",topic:"saimu",sub:"履行遅滞の時期",diff:2,type:"基本知識",sec:50,freq:3,
 q:"履行遅滞となる時期に関する次の記述のうち、正しいものはどれか。",
 c:["期限の定めのない債務については、債務者が履行の請求を受けた時から遅滞となる",
    ["期限の定めのない債務は、債務が成立した時から当然に遅滞となる",["期間混同"],["saimu"],"請求を受けた時から遅滞となります。","saimu"],
    ["確定期限のある債務は、債務者が期限の到来を知った時から遅滞となる",["期間混同"],["saimu"],"確定期限は到来した時から当然に遅滞となります。知不知は問いません。","saimu"],
    ["不確定期限のある債務は、期限が到来しても請求がなければ遅滞とならない",["期間混同"],["saimu"],"期限到来後に請求を受けた時、または到来を知った時のいずれか早い時から遅滞となります。","saimu"]],
 ex:"確定期限＝到来時、不確定期限＝到来後の請求または到来を知った時の早い方、期限なし＝請求時。",
 kid:"「いつから遅れたことになるか」は、約束の仕方で変わります。①「◯月◯日まで」と決めた場合＝その日を過ぎたら自動的に遅れ。②「お父さんが亡くなったら払う」のような場合＝その出来事の後に催促されたか、本人が知った時の早いほう。③期限を決めていない場合＝「払って」と言われた時から。",
 rule:"確定期限のある債務は期限到来時、不確定期限のある債務は期限到来後に履行の請求を受けた時または期限到来を知った時のいずれか早い時、期限の定めのない債務は履行の請求を受けた時から遅滞となります（民法412条）。",
 mem:"確定期限＝自動／期限なし＝請求されてから。",
 rel:["saimu"],pre:["saimu"]},

{id:"k1-047",topic:"futekigou",sub:"追完請求と代金減額",diff:2,type:"基本知識",sec:55,freq:3,

 c:["買主は原則として、相当の期間を定めて追完の催告をし、その期間内に追完がないときに代金の減額を請求できる",
    ["買主は、追完の催告をすることなく直ちに代金の減額を請求できるのが原則である",["追完と代金減額の混同"],["futekigou"],"代金減額請求は原則として追完の催告が必要です。","futekigou"],
    ["履行の追完が不能である場合でも、催告をしなければ代金減額を請求できない",["追完と代金減額の混同"],["futekigou"],"追完不能の場合は催告不要で直ちに減額請求できます。","futekigou"],
    ["買主の責めに帰すべき事由により不適合が生じた場合でも、追完請求ができる",["帰責事由の要否混同"],["futekigou"],"買主に帰責事由がある場合は追完請求も代金減額請求もできません。","futekigou"]],
 ex:"代金減額は原則として追完の催告が必要ですが、追完不能・追完拒絶等の場合は催告不要です。",
 kid:"登場人物は2人。買主と売主。買った物に不備があったら、いきなり「値引きしろ」ではなく、まず「直して」とお願いするのが順番です（追完請求）。それでも直してもらえなければ「その分だけ安くして」と言えます（代金減額請求）。ただし、そもそも直しようがない場合は、催促しても意味がないので、すぐに値引きを求められます。",
 rule:"買主は相当の期間を定めて履行の追完の催告をし、その期間内に追完がないときは代金の減額を請求できます。履行の追完が不能であるとき、売主が追完を拒絶する意思を明確に表示したとき等は催告不要です（民法563条）。不適合が買主の責めに帰すべき事由によるときは追完請求・代金減額請求ができません。",
 mem:"まず追完 → ダメなら減額（直せないなら即減額）。",
 rel:["futekigou"],pre:["futekigou"]},

{id:"k1-004",topic:"ishi",sub:"無効と取消し",diff:2,type:"比較",sec:55,freq:3,
 q:"無効と取消しの比較に関する次の記述のうち、正しいものはどれか。",
 c:["無効な行為ははじめから効力を生じないが、取り消すことができる行為は取り消されるまで有効である",
    ["取り消すことができる行為は、取り消さなくても当然に効力を生じない",["無効と取消しの混同"],["ishi"],"取り消すまでは有効です。","ishi"],
    ["無効な行為は、追認によって当然に有効となる",["追認の効果混同"],["ishi"],"無効行為の追認は、原則として新たな行為をしたものとみなされます。","ishi"],
    ["取消権は、いつまでも行使することができる",["時効期間混同"],["jikou"],"取消権には期間制限（追認できる時から5年、行為の時から20年）があります。","ishi"]],
 ex:"無効＝はじめから効力なし。取消し＝取り消すまでは有効で、取消しにより遡って無効。",
 kid:"「無効」は、はじめから何もなかったのと同じ状態。「取消し」は、いったんは有効に成立していて、あとから「なかったことにします」と言うと、はじめにさかのぼって消える仕組みです。だから取消しは、言わなければ契約は生きたまま。この違いが、問題を解くときの分かれ道になります。",
 rule:"無効な行為は当初から効力を生じません。取り消すことができる行為は取消しがあるまで有効で、取り消されると初めから無効であったものとみなされます（民法121条）。取消権は追認できる時から5年、行為の時から20年で消滅します（126条）。",
 mem:"無効＝最初からゼロ／取消し＝言えばゼロになる。",
 rel:["ishi"],pre:["ishi"]},

{id:"k1-014",topic:"seigen",sub:"被保佐人と被補助人",diff:3,type:"比較",sec:55,freq:2,

 c:["被保佐人は民法が定める重要な財産行為について保佐人の同意を要するが、被補助人は家庭裁判所の審判で定められた特定の行為についてのみ補助人の同意を要する",
    ["被補助人は、すべての法律行為について補助人の同意を要する",["被後見人と被保佐人の混同"],["seigen"],"同意が必要なのは審判で定められた特定の行為に限られます。","seigen"],
    ["被保佐人は、日常生活に関する行為にも保佐人の同意を要する",["適用範囲混同"],["seigen"],"日常生活に関する行為に同意は不要です。","seigen"],
    ["被保佐人・被補助人のいずれについても、同意権の範囲は法律で一律に定められている",["被後見人と被保佐人の混同"],["seigen"],"被補助人については審判により個別に定められます。","seigen"]],
 ex:"被保佐人＝法定の重要な財産行為に同意が必要。被補助人＝審判で定めた特定行為のみ。",
 kid:"判断のむずかしさには段階があります。いちばん重い順に、成年被後見人 → 被保佐人 → 被補助人。被保佐人は「借金をする」「不動産を売る」といった、法律であらかじめ決められた大きな取引に同意が必要。被補助人はもっと軽く、裁判所が「この行為だけは同意が必要」と決めたものだけです。",

 mem:"保佐は法律が決める／補助は裁判所が決める。",
 rel:["seigen"],pre:["seigen"]},

{id:"k1-015",topic:"seigen",sub:"4類型の比較",diff:3,type:"比較",sec:55,freq:3,

    ["いずれの類型についても、同意を得てした行為は取り消すことができない",["被後見人と被保佐人の混同"],["seigen"],"成年被後見人については同意権の制度がありません。","seigen"],
    ["いずれの類型についても、同意を得ていても取り消すことができる",["法定代理人同意の混同"],["seigen"],"未成年者・被保佐人・被補助人は同意があれば取り消せません。","seigen"],
    ["未成年者については、法定代理人の同意があっても取り消すことができる",["法定代理人同意の混同"],["seigen"],"同意を得た行為は取り消せません。","seigen"]],
 ex:"同意で有効にできるのは未成年者・被保佐人・被補助人。成年被後見人には同意権がありません。",

{id:"k1-026",topic:"dairi",sub:"代理権授与表示による表見代理",diff:3,type:"事例",sec:60,freq:2,

    ["Aが代理権を与えていない以上、Aが責任を負うことはない",["無権代理と表見代理の混同"],["dairi"],"代理権授与表示による表見代理が成立しえます。","dairi"],
    ["Cが代理権のないことを知っていた場合でも、Aは責任を負う",["善意と善意無過失の混同"],["dairi"],"相手方が悪意の場合は表見代理は成立しません。","dairi"],
    ["この場合、Aは必ず追認しなければならない",["追認の効果混同"],["dairi"],"表見代理は追認を要せず本人が責任を負う制度です。","dairi"]],
 ex:"代理権を与えた旨を表示した場合、善意無過失の相手方に対して本人が責任を負います。",
 kid:"登場人物は3人。A＝本人、B＝実は代理権のない人、C＝相手方。AがCに「Bに任せています」と伝えていたなら、Cがそれを信じるのは当然です。信じさせたのはA自身なので、Aが責任を負います。ただし、Cが「本当は代理権がない」と知っていた、または少し確かめれば分かったのなら、Cを守る必要はありません。",
 rule:"第三者に対して他人に代理権を与えた旨を表示した者は、その代理権の範囲内でその他人が第三者との間でした行為について責任を負います。ただし第三者が代理権を与えられていないことを知り、または過失により知らなかったときはこの限りではありません（民法109条1項）。",

{id:"k1-027",topic:"dairi",sub:"権限外の行為の表見代理",diff:3,type:"事例",sec:60,freq:3,

    ["Bの行為は権限外であるから、Aが責任を負うことは一切ない",["無権代理と表見代理の混同"],["dairi"],"権限外の行為の表見代理が成立しえます。","dairi"],
    ["Cに過失があっても、Bに何らかの代理権がある以上は表見代理が成立する",["善意と善意無過失の混同"],["dairi"],"正当な理由が必要であり、過失があれば認められません。","dairi"]],

{id:"k1-036",topic:"jikou",sub:"催告による完成猶予",diff:3,type:"事例",sec:55,freq:3,

    ["催告があったときから1年を経過するまでの間は、時効は完成しない",["時効期間混同"],["jikou"],"催告による完成猶予の期間は6か月です。","jikou"],
    ["催告により時効が更新され、新たに時効が進行を始める",["完成猶予と更新の混同"],["jikou"],"催告は完成猶予にとどまり、更新事由ではありません。","jikou"],
    ["催告により完成が猶予されている間に再度催告をすれば、さらに6か月の猶予が得られる",["完成猶予と更新の混同"],["jikou"],"再度の催告に完成猶予の効力はありません。","jikou"]],
 ex:"催告は6か月の完成猶予にとどまり、猶予期間中の再度の催告に効力はありません。",

 rel:["jikou"],pre:["jikou"]},

{id:"k1-041",topic:"saimu",sub:"催告解除と軽微性",diff:3,type:"事例",sec:60,freq:3,

    ["催告期間が経過しさえすれば、不履行が軽微であっても解除できる",["条件見落とし"],["saimu"],"不履行が軽微であるときは解除できません。","saimu"],
    ["解除するには、Bの責めに帰すべき事由が必要である",["帰責事由の要否混同"],["saimu"],"現行民法では解除に債務者の帰責事由は不要です。","saimu"],
    ["Aの責めに帰すべき事由により不履行が生じた場合でも、Aは解除できる",["帰責事由の要否混同"],["saimu"],"債権者に帰責事由があるときは解除できません。","saimu"]],
 ex:"催告解除でも不履行が軽微なときは解除できません。解除に債務者の帰責事由は不要です。",
 kid:"登場人物は2人。A＝解除したい買主、B＝約束を守らない売主。まず期間を決めて催促し、それでも守られなければ解除できます。ただし「ほんのわずかな不足」など、契約の目的からみて小さな問題にすぎない場合は、解除まではできません。契約全体をなかったことにするのは重い結果だからです。",
 rule:"催告期間経過時における債務の不履行がその契約および取引上の社会通念に照らして軽微であるときは、契約の解除をすることができません（民法541条但書）。解除に債務者の帰責事由は不要ですが、債権者の責めに帰すべき事由による不履行の場合は解除できません（543条）。",
 mem:"軽微なら解除できない／解除に相手の落ち度は不要。",
 rel:["saimu"],pre:["saimu"]},

{id:"k1-042",topic:"saimu",sub:"無催告解除",diff:3,type:"事例",sec:60,freq:3,

    ["債務者が履行を拒絶する意思を明確に表示した場合でも、催告が必要である",["催告解除と無催告解除の混同"],["saimu"],"明確な履行拒絶の場合は無催告で解除できます。","saimu"],
    ["特定の日時に履行しなければ契約の目的を達成できない場合でも、催告が必要である",["催告解除と無催告解除の混同"],["saimu"],"定期行為については無催告解除ができます。","saimu"]],
 ex:"全部履行不能・明確な履行拒絶・定期行為などは、催告なしで解除できます。",

 rule:"債務の全部の履行が不能であるとき、債務者が債務の全部の履行を拒絶する意思を明確に表示したとき、特定の日時・一定期間内に履行しなければ契約の目的を達することができない場合にその時期を経過したとき等は、催告をすることなく直ちに契約を解除できます（民法542条1項）。",

{id:"k1-046",topic:"saimu",sub:"同時履行の抗弁権",diff:3,type:"事例",sec:55,freq:3,

    ["同時履行の抗弁権を行使している場合でも、履行遅滞の責任を負う",["効果混同"],["saimu"],"抗弁権を有する間は履行遅滞となりません。","saimu"],
    ["契約解除による原状回復義務は、同時履行の関係に立たない",["原状回復と損害賠償の混同"],["saimu"],"解除による原状回復義務は同時履行の関係に立ちます。","saimu"]],
 ex:"相手が履行を提供するまで自分の履行を拒めます。抗弁権がある間は履行遅滞になりません。",

{id:"h1-006",topic:"toshi",sub:"開発行為の定義",diff:2,type:"基本知識",sec:50,freq:3,
 q:"都市計画法上の開発行為に関する次の記述のうち、正しいものはどれか。",
 c:["開発行為とは、主として建築物の建築等の用に供する目的で行う土地の区画形質の変更をいう",
    ["建築物を建築する行為そのものを開発行為という",["制度混同"],["kenpei"],"建築行為と、その前提となる土地の造成である開発行為は別のものです。","toshi"],
    ["建築目的がなくても、土地の造成を行えばすべて開発行為に当たる",["条件見落とし"],["toshi"],"建築物の建築等の用に供する目的が必要です。","toshi"],
    ["青空駐車場とするための整地も、常に開発行為に当たる",["条件見落とし"],["toshi"],"建築物の建築等を目的としない整地は開発行為に当たりません。","toshi"]],
 ex:"開発行為＝建築等の目的で行う土地の区画形質の変更。建築行為そのものではありません。",
 kid:"「開発行為」とは、建物を建てるために土地の形や性質を変える工事のことです。たとえば山を削って平らにしたり、細切れの土地を1つにまとめたりする作業です。建物を建てる行為そのものではありません。また、建物を建てる目的がなく、ただ駐車場にするだけの整地は、これに当たりません。",
 rule:"開発行為とは、主として建築物の建築または特定工作物の建設の用に供する目的で行う土地の区画形質の変更をいいます（都市計画法4条12項）。",

{id:"h1-007",topic:"toshi",sub:"開発許可の申請手続",diff:3,type:"基本知識",sec:55,freq:2,
 q:"開発許可の申請手続に関する次の記述のうち、正しいものはどれか。",

    ["公共施設の管理者との協議は、開発許可を受けた後に行えばよい",["公告前後の混同"],["toshi"],"協議と同意は許可の申請前に行う必要があります。","toshi"],
    ["開発区域内の土地の所有者全員の同意がなければ申請できない",["要件追加"],["toshi"],"必要とされるのは相当数の同意であり、全員の同意までは求められていません。","toshi"],
    ["開発許可の申請は口頭で行うことができる",["手続混同"],["toshi"],"申請は書面によって行います。","toshi"]],
 ex:"申請前に既存の公共施設管理者の同意と、将来の管理者との協議が必要です。",
 kid:"開発をすると、そこにある道路や水路の形が変わったり、新しい道路ができたりします。あとで「管理できません」と言われては困るので、工事の許可を申請する前に、いまの管理者に同意をもらい、これからの管理者と話し合っておく必要があります。土地の権利者については、全員ではなく相当数の同意で足ります。",
 rule:"開発許可を申請しようとする者は、開発行為に関係がある公共施設の管理者と協議し同意を得るとともに、開発行為により設置される公共施設を管理することとなる者等と協議しなければなりません（都市計画法32条）。",

 rel:["toshi"],pre:["toshi"]},

{id:"h1-008",topic:"toshi",sub:"市街化調整区域の建築制限",diff:3,type:"基本知識",sec:55,freq:3,

    ["開発行為を伴わない建築であれば、常に自由に行うことができる",["区域混同"],["toshi"],"市街化調整区域では、開発行為を伴わない建築にも許可が必要です。","toshi"],
    ["建築確認を受けていれば、知事の許可は不要である",["制度混同"],["kenpei"],"建築確認と、市街化調整区域における建築の許可は別の手続です。","toshi"],
    ["市街化区域においても、同様に知事の許可が必要である",["区域混同"],["toshi"],"この制限は市街化調整区域に特有のものです。","toshi"]],

 kid:"市街化調整区域は「街にしない」と決めた場所です。土地をいじらずに、いきなり建物だけを建てられるとしたら、抜け道になってしまいます。だから、土地の造成をしない建築であっても、原則として知事の許可が必要とされています。市街化区域にはこの制限はありません。",
 rule:"市街化調整区域のうち開発許可を受けた開発区域以外の区域内では、原則として都道府県知事の許可を受けなければ建築物の新築等をすることができません（都市計画法43条）。",

{id:"h1-009",topic:"kenpei",sub:"建築協定",diff:2,type:"基本知識",sec:50,freq:2,

    ["建築協定は、市町村の条例がなくても締結することができる",["要件不足"],["kenpei"],"建築協定を締結できる旨の市町村の条例が必要です。","kenpei"],
    ["建築協定の効力は、協定を締結した者にのみ及び、後から土地を取得した者には及ばない",["効果混同"],["kenpei"],"認可の公告後に土地の所有者等となった者にも効力が及びます。","kenpei"]],
 ex:"建築協定は条例の定めのある区域で、所有者等全員の合意と特定行政庁の認可により成立します。",
 kid:"「この地区では3階建て以上を建てない」といった、住民どうしの約束を法的な効力のあるものにするのが建築協定です。全員の生活に関わるので、締結には土地の持ち主全員の合意が必要です。そして一度決まると、あとから引っ越してきて土地を買った人にも、この約束が適用されます。",
 rule:"建築協定は、市町村の条例で定められた区域内において、土地の所有者等の全員の合意により定め、特定行政庁の認可を受けます。認可の公告後に土地の所有者等となった者に対しても効力が及びます（建築基準法69条以下）。",

{id:"h1-010",topic:"kenpei",sub:"確認の主体",diff:2,type:"基本知識",sec:50,freq:2,

    ["建築確認は、都道府県知事が行う",["許可権者混同"],["toshi"],"開発許可（知事）と建築確認（建築主事等・指定確認検査機関）を混同しています。","kenpei"],
    ["指定確認検査機関が行った確認は、完了検査を受ける必要がない",["要件不足"],["kenpei"],"いずれの場合も完了検査が必要です。","kenpei"]],

{id:"h1-011",topic:"kukaku",sub:"土地区画整理組合",diff:3,type:"基本知識",sec:55,freq:3,

    ["組合が設立されても、施行地区内の宅地の所有者は当然には組合員とならない",["効果混同"],["kukaku"],"施行地区内の宅地の所有者・借地権者は全員が組合員となります。","kukaku"],
    ["組合の設立には、施行地区内の宅地の所有者の過半数の同意で足りる",["要件不足"],["kukaku"],"所有者・借地権者それぞれの3分の2以上の同意が必要です。","kukaku"]],

{id:"h1-012",topic:"morido",sub:"工事主の義務",diff:2,type:"基本知識",sec:50,freq:2,

    ["工事完了後の検査は、工事主が任意に受けるかどうかを決めることができる",["要件不足"],["morido"],"完了検査は義務です。","morido"],
    ["許可を受けた工事の内容を変更する場合でも、あらためて手続をとる必要はない",["要件不足"],["morido"],"変更にも許可等の手続が必要です。","morido"],
    ["工事が完了した後は、土地の所有者に安全な状態を維持する義務は生じない",["条件見落とし"],["morido"],"所有者等は安全な状態を維持する努力義務を負います。","morido"]],

 rule:"宅地造成等工事規制区域内の許可を受けた工事が完了したときは、都道府県知事等の検査を受けなければなりません。また土地の所有者・管理者・占有者は、擁壁等の維持管理に努めなければならず、知事等は災害防止のため必要な改善命令等をすることができます。",

 rel:["morido"],pre:["morido"]},

{id:"h1-013",topic:"kokudo",sub:"区域の種類",diff:3,type:"基本知識",sec:55,freq:2,

    ["注視区域内における土地取引は、事後届出で足りる",["許可と届出の混同"],["kokudo"],"注視区域内では事前届出が必要です。","kokudo"],
    ["監視区域は、都道府県知事が指定することができない",["許可権者混同"],["kokudo"],"監視区域は都道府県知事等が指定します。","kokudo"],
    ["規制区域内の土地取引についても、届出をすれば足りる",["許可と届出の混同"],["kokudo"],"規制区域内は許可制であり、届出では足りません。","kokudo"]],
 ex:"規制区域＝許可制、注視区域・監視区域＝事前届出、それ以外＝事後届出です。",
