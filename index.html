<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>宅建QUEST｜かみくだきコーチ</title>
<meta name="theme-color" content="#0b1026">
<style>
:root{--bg:#f1f4fb;--card:#fff;--ink:#101a32;--ink2:#344563;--sub:#5a6b86;--line:#d9e1ee;
--cta:#c2410c;--blue:#1d4ed8;--ok:#087a50;--ng:#c52d3a;--ai:#5b21b6;--gold:#a56500;
--okbg:#e5f7ef;--ngbg:#ffeaed;--aibg:#f0eaff;--bl:#e9f0ff;--warn:#fff3dc}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
line-height:1.75;overflow-x:hidden}
html{background:#080d20}
body{background:radial-gradient(circle at 20% -10%,#3146a855,transparent 34rem),
radial-gradient(circle at 90% 20%,#a52f6155,transparent 30rem),#080d20}
#app{max-width:540px;margin:0 auto;min-height:100vh;padding-bottom:80px;overflow-x:hidden;background:var(--bg);box-shadow:0 0 80px #0009}
.wrap{padding:14px 17px 28px}
h1{font-size:24px;margin:8px 0 4px;letter-spacing:-.03em}h2{font-size:19px;margin:14px 0 8px;letter-spacing:-.02em}
p{margin:8px 0;font-size:16px}.sub{font-size:14px;color:var(--sub)}.b{font-weight:800}
.mini{font-size:12.5px;font-weight:800;color:var(--sub);letter-spacing:.3px}
.card{background:var(--card);border-radius:18px;padding:15px;margin:11px 0;border:1px solid #fff;box-shadow:0 10px 28px #17234212,0 1px 2px #17234212}
.card.main{position:relative;overflow:hidden;background:linear-gradient(145deg,#fff,#eef3ff);border:1px solid #c8d7f2;box-shadow:0 14px 36px #3455a51c}
.card.urgent{background:var(--warn);border-left:6px solid var(--cta)}
.card.reward{background:linear-gradient(145deg,#fff8e7,#ffeed0);border:1px solid #e8c271}
.card.info{background:#f7fafe;box-shadow:none;border:1px solid var(--line)}
.card.analysis{background:linear-gradient(145deg,#f7f3ff,#fff);border:1px solid #ddd0ff;border-left:5px solid var(--ai)}
.btn{display:block;width:100%;border:none;border-radius:15px;padding:16px;font-size:17px;font-weight:800;color:#fff;position:relative;overflow:hidden;
background:linear-gradient(135deg,#d14a0c,var(--cta));cursor:pointer;margin-top:10px;box-shadow:0 5px 0 #8f2e08,0 9px 20px #c2410c24;letter-spacing:.01em;min-height:52px}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 #d1520f}
.btn.blue{background:linear-gradient(135deg,#315ee8,#163ba9);box-shadow:0 5px 0 #102d84,0 9px 20px #1d4ed824}.btn.ok{background:linear-gradient(135deg,#0a9663,#08623f);box-shadow:0 5px 0 #064b31}
.btn.ghost{background:#fff;color:#243552;box-shadow:none;border:2px solid #cbd6e6}
.btn.sm{padding:11px;font-size:15px;box-shadow:none}
.btn.giant{padding:22px;font-size:20px;border-radius:19px}
.choice{display:block;width:100%;text-align:left;border:2px solid var(--line);background:#fff;color:var(--ink);
border-radius:14px;padding:14px 15px;margin:9px 0;font-size:17px;line-height:1.7;cursor:pointer;
box-shadow:0 4px 13px #1723420c;transition:transform .16s,border-color .16s,box-shadow .16s}
.choice .lab{display:inline-flex;width:26px;height:26px;align-items:center;justify-content:center;border-radius:8px;
background:#eef3fa;color:var(--ink2);font-weight:800;font-size:14px;margin-right:9px}
.choice.correct{background:var(--okbg);border-color:var(--ok)}.choice.correct .lab{background:var(--ok);color:#fff}
.choice.wrong{background:var(--ngbg);border-color:var(--ng);animation:shk .35s}.choice.wrong .lab{background:var(--ng);color:#fff}
.choice.gone{opacity:.35;text-decoration:line-through}
.choice.pick{border-color:var(--blue);background:var(--bl)}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}60%{transform:translateX(7px)}}
.box{border-radius:14px;padding:13px 15px;margin:11px 0;font-size:16px}
.box .h{font-weight:800;font-size:14px;margin-bottom:3px}
.box.ai{background:var(--aibg)}.box.ok{background:var(--okbg)}.box.ng{background:var(--ngbg)}
.box.bl{background:var(--bl)}.box.gd{background:#fdf3d9}
details{background:#fff;border:2px solid var(--line);border-radius:12px;padding:0 14px;margin:9px 0}
details>summary{list-style:none;cursor:pointer;padding:12px 0;font-weight:800;font-size:15px;display:flex;justify-content:space-between}
details>summary::-webkit-details-marker{display:none}details>summary::after{content:"＋";color:var(--sub)}
details[open]>summary::after{content:"−"}details .bd{padding-bottom:13px;font-size:16px;color:var(--ink2)}
table.cmp{width:100%;border-collapse:collapse;margin:9px 0;font-size:14px;table-layout:fixed}
table.cmp th,table.cmp td{border:1px solid var(--line);padding:8px;text-align:left;word-break:break-word}
table.cmp th{background:#f1f6fd;font-weight:800}table.cmp td.hl{background:#fff5e9;color:#b5540e;font-weight:800}
.bar{height:11px;border-radius:99px;background:#d1daea;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#1d4ed8,#7c3aed);box-shadow:0 0 12px #4266ff88;transition:width .5s}
.bar.gold>i{background:linear-gradient(90deg,#f3c53e,#e8a90c)}.bar.ok>i{background:var(--ok)}.bar.ng>i{background:var(--ng)}
.chip{display:inline-block;font-size:12.5px;font-weight:800;border-radius:99px;padding:3px 10px;margin:2px 5px 2px 0}
.chip.ok{background:var(--okbg);color:var(--ok)}.chip.ng{background:var(--ngbg);color:var(--ng)}
.chip.ai{background:var(--aibg);color:var(--ai)}.chip.gd{background:#fdf3d9;color:#745000}
.chip.gy{background:#eef2f7;color:var(--sub)}
.stat{display:flex;gap:8px}.stat>div{flex:1;background:#f2f7fd;border-radius:12px;padding:8px 5px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:12px;color:var(--sub)}
.hud{display:flex;align-items:center;gap:8px;padding:10px 14px;font-size:12.5px;font-weight:800;color:#fff;flex-wrap:wrap;
position:sticky;top:0;z-index:40;background:#0c132eea;backdrop-filter:blur(18px);border-bottom:1px solid #ffffff1f;box-shadow:0 8px 22px #05091d33}
.hud .u{background:#ffffff12;color:#fff;border:1px solid #ffffff20;border-radius:99px;padding:4px 11px;box-shadow:none}
.buddy{width:76px;height:76px;position:relative;flex:0 0 auto;z-index:1;overflow:visible}
.buddy .buddy-art{display:block;width:100%;height:100%;object-fit:contain;object-position:center;filter:drop-shadow(0 4px 5px #17356b29);user-select:none;-webkit-user-drag:none}
.buddy .buddy-evo-mark{position:absolute;top:0;right:2%;z-index:3;color:#f5c451;line-height:1;text-shadow:0 1px 2px #4d331d66;pointer-events:none}
.buddy .buddy-arm{transform-box:fill-box;transform-origin:50% 15%;transition:transform .18s}
.buddy .ac{position:absolute;top:-3%;right:-8%;z-index:4;line-height:1;filter:drop-shadow(0 2px 2px #0004);transform:rotate(6deg)}
.buddy.happy{animation:hop .5s}
.buddy.cheer{animation:hop .45s infinite}
.buddy.joy{animation:hop .4s infinite}
.buddy.cheer .buddy-arm.l,.buddy.joy .buddy-arm.l{transform:rotate(-13deg) translateY(-2px)}
.buddy.cheer .buddy-arm.r,.buddy.joy .buddy-arm.r{transform:rotate(13deg) translateY(-2px)}
.buddy.sad .buddy-arm{transform:translateY(2px)}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.brow{display:flex;align-items:center;gap:11px}
.bub{position:relative;background:#fff;border-radius:14px;padding:11px 14px;font-size:15px;flex:1;box-shadow:0 2px 8px #12234014}
.bub:before{content:"";position:absolute;left:-7px;top:22px;border:7px solid transparent;border-right-color:#fff}
.fx{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;z-index:80;pointer-events:none}
.fx b{font-size:44px;font-weight:900;color:#fff;text-shadow:0 4px 0 #0003;animation:zoom .7s forwards}
@keyframes zoom{0%{transform:scale(.5);opacity:0}30%{transform:scale(1.15);opacity:1}70%{transform:scale(1);opacity:1}100%{transform:scale(1.05);opacity:0}}
.fxfull{position:fixed;inset:0;background:#12233dee;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;text-align:center;padding:24px}
.xpfly{position:fixed;font-weight:800;color:var(--gold);font-size:19px;z-index:85;pointer-events:none;animation:fly .9s forwards}
@keyframes fly{0%{opacity:1;transform:translateY(0)}100%{opacity:0;transform:translateY(-70px) scale(1.3)}}
.dmg{position:fixed;font-weight:900;color:#ffd479;font-size:30px;z-index:85;pointer-events:none;animation:fly .8s forwards;text-shadow:0 3px 0 #0006}
.bossbox{background:linear-gradient(180deg,#1b2a45,#14203a);color:#eaf1ff;border-radius:18px;padding:15px;margin:10px 0}
.bosshp{height:14px;border-radius:99px;background:#060a17;overflow:hidden;margin-top:8px;border:2px solid #4d416f}
.bosshp>i{display:block;height:100%;background:linear-gradient(90deg,#ff3767,#ff9d45);box-shadow:0 0 14px #ff446b88;transition:width .6s}
.hit{animation:hitk .4s}@keyframes hitk{0%,100%{transform:translateX(0)}30%{transform:translateX(-10px)}70%{transform:translateX(10px)}}
.hm{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:6px}
.hm div{border-radius:9px;padding:7px 4px;font-size:11px;text-align:center;font-weight:800;line-height:1.35;color:#fff}
.hm .g{background:#d8e0ec;color:#30415d}.hm .r{background:#ad2334;color:#fff}.hm .y{background:#725000;color:#fff}
.hm .b{background:#1746b5;color:#fff}.hm .gr{background:#08734c;color:#fff}
.node{display:flex;align-items:center;gap:11px;padding:9px 14px;cursor:pointer}
.nd{width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:21px;
background:#fff;border:3px solid #cfe0f4;flex:0 0 auto;box-shadow:0 3px 0 #cfe0f4}
.node.done .nd{background:var(--okbg);border-color:var(--ok);box-shadow:0 3px 0 var(--ok)}
.node.cur .nd{border-color:var(--cta);box-shadow:0 0 0 5px #ff6a1f28,0 3px 0 var(--cta)}
.node.lock .nd{opacity:.5;filter:grayscale(1)}
.map{border-radius:18px;margin:8px 0;padding:8px 0;position:relative}
.rail{position:absolute;left:38px;top:8px;bottom:8px;width:5px;background:repeating-linear-gradient(#cfe0f4 0 9px,transparent 9px 17px)}
.opt{border:2px solid var(--line);border-radius:13px;padding:14px;margin:9px 0;background:#fff;font-size:16px;cursor:pointer}
.opt.sel{border-color:var(--blue);background:var(--bl)}
.conf{display:flex;gap:7px;margin:9px 0}
.conf button{flex:1;border:2px solid var(--line);background:#fff;border-radius:12px;padding:12px 4px;font-size:14px;font-weight:800;cursor:pointer;color:var(--ink2)}
.conf button:active{transform:translateY(1px)}
nav{position:fixed;bottom:0;left:0;right:0;background:#0c132ef2;backdrop-filter:blur(10px);border-top:1px solid #ffffff1e;
padding-bottom:env(safe-area-inset-bottom);z-index:50;box-shadow:0 -10px 25px #05091d2e}
nav .in{max-width:500px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0;font-size:11.5px;font-weight:800;color:var(--sub);cursor:pointer}
nav a .i{font-size:20px}nav a.on{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:98px;transform:translateX(-50%);background:#0b132d;color:#fff;border:1px solid #ffffff25;border-radius:13px;
padding:11px 17px;font-size:15px;font-weight:800;z-index:95;animation:up .3s;max-width:90vw;text-align:center;box-shadow:0 12px 35px #0005}
@keyframes up{from{transform:translate(-50%,12px)}to{transform:translate(-50%,0)}}
.hide{display:none}.center{text-align:center}
.rowb{display:flex;gap:8px}.rowb>*{flex:1}
.quick-actions{border:2px solid #cfe0fb;background:#f7faff;border-radius:14px;padding:11px 12px;margin:11px 0}
.quick-actions .btn{margin-top:0}.quick-actions a{display:block;text-align:center;margin-top:8px;color:var(--blue);font-weight:800;font-size:14px}
.btn[href]{text-decoration:none;text-align:center}
.past-hero{background:linear-gradient(145deg,#173b75,#2f6bff);color:#fff;border:0;box-shadow:0 8px 22px #173b7533}
.past-hero .sub,.past-hero .mini{color:#dbe8ff}.past-hero .bar{background:#ffffff3b}.past-hero .bar>i{background:#ffd479}
.past-session{display:flex;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.past-session:last-child{border-bottom:0}.past-session .meta{min-width:0;flex:1}.past-session .btn{width:auto;min-width:76px;margin:0;padding:9px 12px}
.past-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px;margin:12px 0}
.past-no{border:2px solid var(--line);border-radius:10px;background:#fff;color:var(--ink2);font-weight:900;padding:9px 2px;cursor:pointer;text-align:center;min-height:44px}
.past-no.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok)}.past-no.ng{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}
.past-answer{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin:12px 0}
.past-answer button{border:2px solid var(--line);background:#fff;color:var(--ink);border-radius:15px;padding:20px 6px;font-size:22px;font-weight:900;cursor:pointer}
.past-answer button:active{transform:translateY(1px)}.past-answer button.correct{border-color:var(--ok);background:var(--okbg);color:var(--ok)}
.past-answer button.wrong{border-color:var(--ng);background:var(--ngbg);color:var(--ng)}
.past-source{font-size:12px;color:var(--sub);word-break:break-word}.past-source a{color:var(--blue)}
/* ===== QUEST UI v4：集中しやすさと達成感を両立する高コントラスト設計 ===== */
button,input,select,textarea{font:inherit}
button.chip{border:0;cursor:pointer;min-height:44px}
button.opt{display:block;width:100%;text-align:left;color:var(--ink)}
.card.main:before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,#4f7cff,#8a5cff,#ff7a45)}
.btn:after{content:"";position:absolute;top:-80%;left:-35%;width:28%;height:240%;transform:rotate(24deg);
background:linear-gradient(90deg,transparent,#fff8,transparent);animation:btnshine 4.8s ease-in-out infinite}
.btn.ghost:after{display:none}.btn[disabled],button[disabled]{opacity:.45;cursor:not-allowed}
@keyframes btnshine{0%,72%,100%{left:-35%}84%{left:120%}}
.choice:hover{border-color:#9eb4d6;box-shadow:0 8px 20px #17234217}.choice:active{transform:scale(.99)}
.choice.pick.correct{border-color:var(--ok);background:var(--okbg)}.choice.pick.wrong{border-color:var(--ng);background:var(--ngbg)}
.choice:focus-visible,.btn:focus-visible,.opt:focus-visible,.past-no:focus-visible,[role="button"]:focus-visible,nav button:focus-visible,
details>summary:focus-visible{outline:4px solid #ffbf47;outline-offset:3px}
.quest-hero{position:relative;overflow:hidden;background:radial-gradient(circle at 85% 15%,#8b5cf655,transparent 35%),
linear-gradient(145deg,#121b3c,#182a60 60%,#153b74);color:#fff;border:1px solid #ffffff24}
.quest-hero:after{content:"";position:absolute;width:150px;height:150px;right:-70px;bottom:-90px;border-radius:50%;
border:24px solid #ffffff0a;box-shadow:0 0 0 22px #ffffff08}
.quest-hero .sub,.quest-hero .mini{color:#d9e4ff}.quest-hero .bar{background:#ffffff25}.quest-hero .bar>i{background:linear-gradient(90deg,#5de1ff,#9cffc9)}
.quest-kicker{display:flex;justify-content:space-between;align-items:center;gap:10px}
.rank-badge{display:inline-flex;align-items:center;gap:6px;background:#ffffff17;border:1px solid #ffffff24;border-radius:999px;
padding:5px 10px;color:#fff;font-size:12px;font-weight:900}
.mission-title{font-size:24px;line-height:1.35;font-weight:900;margin:8px 0 2px;letter-spacing:-.035em}
.mission-meter{display:flex;align-items:center;gap:12px;margin:13px 0}
.xp-ring{--p:0;width:68px;height:68px;border-radius:50%;display:grid;place-items:center;flex:0 0 auto;position:relative;
background:conic-gradient(#64e9ff calc(var(--p)*1%),#ffffff1b 0);box-shadow:0 0 26px #4bcfff44}
.xp-ring:before{content:"";position:absolute;width:52px;height:52px;border-radius:50%;background:#142450}
.xp-ring b{position:relative;color:#fff;font-size:17px}.mission-copy{flex:1}
.combo-banner{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:5px 10px;background:#fff0cf;color:#8c5100;
font-size:12px;font-weight:900;animation:firepulse 1.2s ease-in-out infinite}
@keyframes firepulse{50%{transform:scale(1.04);box-shadow:0 0 18px #ff9e3044}}
.boss-arena{background:linear-gradient(145deg,#12172b,#261a45);color:#fff;border:1px solid #ffffff1b}
.boss-arena .sub,.boss-arena .mini{color:#cdd5ee}.boss-face{font-size:42px;filter:drop-shadow(0 6px 8px #0008)}
.boss-head{display:flex;align-items:center;gap:12px}.boss-copy{flex:1}
.daily-track{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;margin:13px 0 4px}
.daily-dot{height:7px;border-radius:99px;background:#ccd6e5}.daily-dot.done{background:linear-gradient(90deg,#1d4ed8,#8b5cf6);box-shadow:0 0 9px #5e64ed66}
.question-text{white-space:pre-line}
.bank-hero{position:relative;overflow:hidden;background:
radial-gradient(circle at 90% 0,#5de1ff55,transparent 38%),
linear-gradient(145deg,#101b3f,#283b8c 62%,#4e2fa7);color:#fff;border:1px solid #ffffff2b}
.bank-hero:after{content:"";position:absolute;width:145px;height:145px;right:-72px;bottom:-84px;border-radius:50%;
border:23px solid #ffffff0a;box-shadow:0 0 0 20px #ffffff07;pointer-events:none}
.bank-hero .mini,.bank-hero .sub{color:#dbe7ff}.bank-total{font-size:44px;line-height:1;font-weight:950;letter-spacing:-.055em;margin:8px 0 3px}
.bank-total small{font-size:15px;letter-spacing:0;margin-left:5px}.bank-split{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:13px 0}
.bank-stat{position:relative;z-index:1;background:#ffffff12;border:1px solid #ffffff22;border-radius:13px;padding:10px}
.bank-stat b{display:block;font-size:20px}.bank-stat span{display:block;color:#dbe7ff;font-size:12px;font-weight:800}
.bank-hero .bar{background:#ffffff2b}.bank-hero .bar>i{background:linear-gradient(90deg,#5de1ff,#85ffbd)}
.achievement-pop{border:1px solid #eac169;background:linear-gradient(135deg,#fff9e9,#ffedb9);box-shadow:0 8px 24px #ac761b25}
.fine-weak{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.fine-weak:last-child{border-bottom:0}.fine-weak strong{display:block}
.shop-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px;margin-top:10px}
.shop-item{border:1px solid var(--line);background:#f8faff;border-radius:15px;padding:12px;min-width:0}
.shop-item .preview{font-size:28px}.shop-item .btn{min-height:44px;padding:9px;font-size:13px;margin-top:8px}
.setting-row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.toggle{border:0;border-radius:999px;padding:7px 12px;min-height:44px;font-weight:900;cursor:pointer}.toggle.on{background:var(--okbg);color:var(--ok)}.toggle.off{background:#e9edf3;color:var(--sub)}
.buddy .aura{position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle,#fff0 45%,#80dfff35 70%,transparent 72%);
animation:aurapulse 2s ease-in-out infinite;z-index:-1}.buddy .buddy-wing{filter:drop-shadow(0 2px 3px #3055a944)}
.center>.buddy{margin-left:auto;margin-right:auto}
@keyframes aurapulse{50%{transform:scale(1.12);opacity:.6}}
.confetti{position:fixed;width:9px;height:14px;border-radius:2px;z-index:110;pointer-events:none;animation:confettiFall 1.35s ease-out forwards}
@keyframes confettiFall{to{transform:translate(var(--dx),105vh) rotate(720deg);opacity:0}}
nav button{appearance:none;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 0;
font:inherit;font-size:11.5px;font-weight:800;color:#9ba9ca;cursor:pointer}
nav button .i{font-size:20px}nav button.on{color:#7fe5ff}nav button.on:after{content:"";width:22px;height:3px;border-radius:9px;background:#71e3ff}
.hm>button{border:0;border-radius:9px;padding:7px 4px;min-height:44px;font-size:12px;text-align:center;font-weight:800;line-height:1.35;color:#fff;cursor:pointer}
.past-hero .stat>div{background:#ffffff18;border:1px solid #ffffff1f}.past-hero .stat span{color:#dbe8ff}
/* ===== v4 共通コンポーネント：ミッション・解説・分析・設定 ===== */
.mission-focus{font-size:14px;color:#cbd8fa;font-weight:800}
.mission-breakdown{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:7px;margin:13px 0 2px}
.mission-breakdown span{display:flex;min-width:0;flex-direction:column;align-items:center;padding:8px 3px;border:1px solid #ffffff20;
border-radius:12px;background:#ffffff0d;color:#dbe6ff;font-size:12px;font-weight:800}
.mission-breakdown b{font-size:18px;line-height:1.15;color:#fff}
.verdict{display:flex;align-items:center;gap:9px;border-radius:14px;padding:12px 14px;margin-bottom:12px;font-size:18px}
.verdict>span{display:grid;place-items:center;width:31px;height:31px;border-radius:50%;font-size:21px;font-weight:950}
.verdict b{flex:1}.verdict em{font-style:normal;font-size:14px;font-weight:900}
.verdict.ok{background:var(--okbg);border:2px solid var(--ok);color:var(--ok)}
.verdict.ng{background:var(--ngbg);border:2px solid var(--ng);color:var(--ng)}
.answer-first{border-left:5px solid var(--ok)}.key-rule{border-left:5px solid var(--cta);background:#fff7ed}
.key-rule strong,.decision-rule strong{font-size:17px;line-height:1.65}
.everyday-story{margin-top:10px;padding-top:10px;border-top:1px solid #d8caf7}
.formal-rule{margin-top:10px;padding:10px;border-radius:10px;background:#f1f4fa}
.strong-warn{color:var(--ng);font-weight:800;margin-top:6px}
.choice-reasons p{padding:10px;border-radius:11px;background:#f5f7fb}
.choice-reasons p.is-correct{background:var(--okbg);border-left:4px solid var(--ok)}
.choice-reasons p.is-selected{background:var(--ngbg);border-left:4px solid var(--ng)}
.decision-rule{border:2px solid #efad57;background:linear-gradient(145deg,#fff8e9,#fff)}
.learning-metrics{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.learning-metrics span{display:flex;flex-direction:column;border-radius:11px;background:#eef3fb;padding:9px;color:var(--sub);font-size:12px}
.learning-metrics b{font-size:20px;color:var(--ink)}
.break-title{font-size:23px;font-weight:950;color:var(--ok)}
.onb-progress{display:flex;gap:5px;margin:4px 0 18px}.onb-progress i{height:6px;flex:1;border-radius:10px;background:#d6deeb}
.onb-progress i.on{background:linear-gradient(90deg,var(--blue),var(--ai))}
.onb-progress~.card .mission-breakdown span{color:var(--ink2)}
.onb-progress~.card .mission-breakdown b{color:var(--ink)}
.skip-link{display:block;margin:12px auto;background:transparent;border:0;color:var(--sub);font-weight:800;min-height:44px;padding:10px;cursor:pointer}
.setting-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.setting-grid .opt{margin:0;text-align:center;padding:12px 4px}
.number-input{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:10px;font-size:16px}
.resume-card{border:2px solid var(--blue);background:var(--bl)}.resume-card .btn{margin-top:8px}
.analytics-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric-card{padding:12px;border:1px solid var(--line);border-radius:13px;background:#f8faff}
.metric-card b{display:block;font-size:22px}.metric-card span{display:block;color:var(--sub);font-size:12px;font-weight:800}
.week-row{display:grid;grid-template-columns:28px 1fr 46px;align-items:center;gap:7px;margin:7px 0;font-size:13px}
.week-row .track{height:9px;background:#dce3ef;border-radius:99px;overflow:hidden}.week-row i{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--ai))}
.past-no.flag{box-shadow:inset 0 0 0 3px #f5a623}.flag-button.on{background:#fff4d7;border-color:#d08a00;color:#7b4d00}
body[data-ui-theme="emerald"] #app{--bg:#edf8f3;--line:#cfe3da;background:#edf8f3}
body[data-ui-theme="emerald"] .quest-hero{background:radial-gradient(circle at 85% 15%,#36d39944,transparent 35%),linear-gradient(145deg,#102c2a,#14584b 60%,#1a6b62)}
body[data-ui-theme="emerald"] .btn{border-radius:18px}
body[data-ui-theme="midnight"] #app{--bg:#e9edfa}
body[data-ui-theme="midnight"] .quest-hero{background:radial-gradient(circle at 85% 15%,#8b5cf655,transparent 35%),linear-gradient(145deg,#080c22,#1b2665)}
body[data-ui-theme="midnight"] .btn{border-radius:9px}
body[data-explain-theme="focus"] .feedback-card{box-shadow:0 0 0 3px #5b21b622,0 18px 34px #171c381c}
body[data-explain-theme="focus"] .feedback-card details{border-left:4px solid var(--ai)}
body[data-explain-theme="plain"] .feedback-card{background:#fffdf7;border-color:#e3d7bd;box-shadow:0 8px 20px #6b4f2512}
body[data-explain-theme="plain"] .feedback-card .box{background-color:#fffefa}
@media(max-width:360px){.mission-breakdown{grid-template-columns:repeat(2,1fr)}.hud .u{font-size:11px}.shop-grid{grid-template-columns:1fr}.wrap{padding-left:13px;padding-right:13px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}}
body.reduce-motion *,body.reduce-motion *:before,body.reduce-motion *:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}

/* ===== QUEST UI v5：視認性・配色統一・資格攻略RPG ===== */
:root{
  --bg:#eef2f7;
  --card:#ffffff;
  --ink:#0f1b33;
  --ink2:#2f405e;
  --sub:#4d5f79;
  --line:#cfd8e6;
  --cta:#c64a0a;
  --blue:#1f55c9;
  --ok:#08734c;
  --ng:#b92939;
  --ai:#315fc7;
  --gold:#8a5a00;
  --okbg:#e8f6ef;
  --ngbg:#fdebed;
  --aibg:#edf3ff;
  --bl:#edf4ff;
  --warn:#fff3e6;
}

html{background:#071124}
body{
  background:
    radial-gradient(circle at 18% -10%,#1f55c944,transparent 31rem),
    radial-gradient(circle at 92% 16%,#c64a0a22,transparent 27rem),
    #071124;
}
#app{background:var(--bg);box-shadow:0 0 70px #0008}

h1,h2{color:var(--ink)}
.sub{color:var(--sub)}
.mini{color:var(--sub);letter-spacing:.22px}

.card{
  border:1px solid #d8e0eb;
  box-shadow:0 8px 22px #10213a0d,0 1px 2px #10213a12;
}
.card.main{
  background:#fff;
  border-color:#cdd8e8;
  box-shadow:0 12px 28px #17345f14;
}
.card.main:before{background:linear-gradient(90deg,var(--blue),#5b7fd5,var(--cta))}
.card.info{background:#f8fafc;border-color:#d5deea}
.card.analysis{
  background:#f7f9fd;
  border:1px solid #d5deed;
  border-left:5px solid var(--blue);
}
.card.urgent{background:var(--warn);border-left-color:var(--cta)}
.card.reward{background:#fff8e9;border-color:#dfbf72}

.btn{
  background:linear-gradient(180deg,#df621d,#bd4208);
  box-shadow:0 4px 0 #8e2e06,0 8px 18px #a73b0c20;
  text-shadow:0 1px 1px #6e220733;
}
.btn:after{display:none}
.btn:active{box-shadow:0 2px 0 #8e2e06}
.btn.blue{
  background:linear-gradient(180deg,#2d66df,#1747ae);
  box-shadow:0 4px 0 #103787,0 8px 18px #1f55c924;
}
.btn.ok{
  background:linear-gradient(180deg,#0b8a5c,#066442);
  box-shadow:0 4px 0 #054a31;
}
.btn.ghost{
  background:#fff;
  color:#203553;
  border-color:#b9c6d9;
  text-shadow:none;
}

.choice,.opt,details{border-color:var(--line)}
.choice:hover{border-color:#8ea6c9}
.choice .lab{background:#e8eef6;color:#253956}
.choice.pick,.opt.sel{border-color:var(--blue);background:var(--bl)}

/* 薄い背景は、親が暗色でも必ず濃い文字に戻す */
.box{color:var(--ink)}
.box .h{color:var(--ink)}
.box.ai{background:var(--aibg);color:var(--ink)}
.box.ok{background:var(--okbg);color:var(--ink)}
.box.ng{background:var(--ngbg);color:var(--ink)}
.box.bl{background:var(--bl);color:var(--ink)}
.box.gd{background:#fff4d8;color:var(--ink)}
.box .sub,.box.bl .sub,.box.ai .sub,.box.ok .sub,.box.ng .sub,.box.gd .sub{color:var(--ink2)}

.chip.ai{background:var(--aibg);color:var(--blue)}
.chip.gy{background:#e8edf4;color:#44556f}

.bar{background:#cbd5e3}
.bar>i{background:linear-gradient(90deg,#1f55c9,#4f78d5);box-shadow:none}
.bar.gold>i{background:linear-gradient(90deg,#d2a126,#b57a08)}

.hud{
  background:#0a1730f2;
  border-bottom-color:#ffffff18;
  box-shadow:0 7px 20px #050b1838;
}
.hud .u{background:#ffffff0d;border-color:#ffffff1f;color:#f7f9ff}

/* メインクエスト：濃紺を主役にして装飾色を抑える */
.quest-hero{
  background:
    radial-gradient(circle at 88% 8%,#2d66df3d,transparent 32%),
    linear-gradient(145deg,#0c1933,#11284d 62%,#163862);
  color:#fff;
  border-color:#28496f;
  box-shadow:0 14px 30px #0c21452b;
}
.quest-hero:before{
  content:"";
  position:absolute;
  inset:0 0 auto;
  height:4px;
  background:linear-gradient(90deg,#2f68dd 0 72%,#df621d 72% 100%);
  z-index:2;
}
.quest-hero:after{border-color:#ffffff08;box-shadow:0 0 0 22px #ffffff05}
.quest-hero h1,.quest-hero h2,.quest-hero .b{color:#fff}
.quest-hero .sub,.quest-hero .mini{color:#d9e3f2}
.mission-focus{color:#d8e4f6}
.rank-badge{background:#ffffff0d;border-color:#ffffff25;color:#fff}
.combo-banner{background:#fff0d8;color:#7a4300}

.xp-ring{
  background:conic-gradient(#4c7ee8 calc(var(--p)*1%),#ffffff1a 0);
  box-shadow:none;
}
.xp-ring:before{background:#10264a}
.daily-dot{background:#9aa9bf66}
.daily-dot.done{background:#4c7ee8;box-shadow:none}

/* mission-breakdown は明背景を標準、Hero内だけ暗背景仕様 */
.mission-breakdown span{
  border:1px solid var(--line);
  background:#f6f8fb;
  color:var(--ink2);
}
.mission-breakdown b{color:var(--ink)}
.quest-hero .mission-breakdown span{
  border-color:#ffffff20;
  background:#ffffff0d;
  color:#dfe7f4;
}
.quest-hero .mission-breakdown b{color:#fff}
.onb-progress~.card .mission-breakdown span{color:var(--ink2)}
.onb-progress~.card .mission-breakdown b{color:var(--ink)}

/* オンボーディング：薄青ボックスの白文字継承を完全に防止 */
.quest-hero .box.bl{
  background:#f2f6fd;
  color:var(--ink);
  border:1px solid #cbd8ea;
  box-shadow:none;
}
.quest-hero .box.bl b{color:var(--ink)}
.quest-hero .box.bl .sub{color:var(--ink2)}
.onb-progress i.on{background:var(--blue)}
.skip-link{color:#485a73}

/* 学習・分析画面も青系に集約 */
.learning-metrics span{background:#f0f4fa;color:#4a5b73}
.week-row i{background:var(--blue)}
.resume-card{border-color:var(--blue);background:var(--bl)}
body[data-explain-theme="focus"] .feedback-card{box-shadow:0 0 0 3px #1f55c91f,0 16px 30px #142b5015}
body[data-explain-theme="focus"] .feedback-card details{border-left-color:var(--blue)}

/* 過去問・問題バンクも同じ濃紺＋青へ */
.past-hero{
  background:linear-gradient(145deg,#10244a,#1b4d98);
  box-shadow:0 8px 22px #10244a2b;
}
.past-hero .sub,.past-hero .mini{color:#dce7f7}
.past-hero .bar>i{background:#d8aa36}
.bank-hero{
  background:
    radial-gradient(circle at 90% 0,#2d66df40,transparent 36%),
    linear-gradient(145deg,#0d1c3b,#173b72 65%,#1f55a7);
  border-color:#2b4e7d;
}
.bank-hero .mini,.bank-hero .sub,.bank-stat span{color:#dce7f7}
.bank-hero .bar>i{background:#4c7ee8}

/* ボスも紫ベースをやめてダークネイビーへ */
.boss-arena{background:linear-gradient(145deg,#11182a,#1b2944);border-color:#34445f}
.bossbox{background:linear-gradient(180deg,#16243d,#101a2e)}

/* ナビ：未選択も読める。選択は青だけで示す */
nav{background:#09162ef4;border-top-color:#ffffff1b}
nav button{color:#aebbd0}
nav button.on{color:#86aef8}
nav button.on:after{background:#5d8df0;box-shadow:none}

.shop-item{background:#f8fafc;border-color:#d3dce9}
.metric-card{background:#f8fafc;border-color:#d4ddea}
.toggle.off{background:#e6ebf2;color:#4e6079}

/* テーマ選択時も最低限の視認性ルールは維持 */
body[data-ui-theme="emerald"] .quest-hero .box.bl,
body[data-ui-theme="midnight"] .quest-hero .box.bl{background:#f2f6fd;color:var(--ink)}
body[data-ui-theme="emerald"] .quest-hero .box.bl b,
body[data-ui-theme="midnight"] .quest-hero .box.bl b{color:var(--ink)}



/* ===== QUEST UI v6：販売準備・バックアップ・プラン導線 ===== */
.value-stack{display:grid;gap:8px;margin:12px 0}
.value-row{display:flex;gap:10px;align-items:flex-start;padding:11px 12px;border:1px solid var(--line);border-radius:13px;background:#fff}
.value-row .ico{display:grid;place-items:center;width:34px;height:34px;flex:0 0 auto;border-radius:10px;background:var(--bl);font-size:18px}
.value-row b{display:block;line-height:1.4}.value-row .sub{margin-top:2px}
.plan-grid{display:grid;gap:10px;margin:12px 0}
.plan-card{position:relative;border:2px solid var(--line);border-radius:16px;padding:14px;background:#fff}
.plan-card.featured{border-color:var(--cta);box-shadow:0 8px 22px #c64a0a18}
.plan-card .plan-price{font-size:26px;line-height:1.2;font-weight:950;letter-spacing:-.04em;color:var(--ink)}
.plan-card .plan-price small{font-size:13px;letter-spacing:0;color:var(--sub);font-weight:800}
.plan-card .badge{position:absolute;top:-10px;right:12px;border-radius:99px;background:var(--cta);color:#fff;padding:3px 9px;font-size:11px;font-weight:900}
.plan-status{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px;border-radius:14px;background:#f6f8fc;border:1px solid var(--line)}
.plan-status .status-pill{display:inline-flex;align-items:center;border-radius:99px;padding:4px 10px;font-size:12px;font-weight:900;background:#e9eef6;color:var(--ink2)}
.plan-status .status-pill.on{background:var(--okbg);color:var(--ok)}
.data-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.data-actions .btn{margin-top:0}
.backup-note{padding:10px 12px;border-radius:12px;background:#f5f7fb;color:var(--sub);font-size:13px;line-height:1.6}
.premium-lock{position:relative;border:2px solid #d8e0ec;border-radius:16px;padding:15px;background:linear-gradient(145deg,#fff,#f7f9fd);overflow:hidden}
.premium-lock:before{content:"PREMIUM";position:absolute;top:10px;right:10px;border-radius:99px;background:#0d2a55;color:#fff;padding:3px 9px;font-size:10px;font-weight:950;letter-spacing:.08em}
.premium-lock .lock-icon{font-size:28px;line-height:1;margin-bottom:7px}
.premium-lock .sub{max-width:420px}
.feature-compare{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}
.feature-compare>div{border:1px solid var(--line);border-radius:13px;padding:11px;background:#fff}
.feature-compare b{display:block;margin-bottom:5px}
.feature-compare .yes{color:var(--ok);font-weight:900}
.feature-compare .premium{color:var(--cta);font-weight:900}
.locked-opt{opacity:.62}
.locked-opt:after{content:" 🔒";font-size:11px}
.plan-disclosure{font-size:12px;color:var(--sub);line-height:1.65;margin-top:9px}
@media(max-width:390px){.feature-compare{grid-template-columns:1fr}}

.file-pick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
@media(max-width:360px){.data-actions{grid-template-columns:1fr}}
.legal-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.legal-actions .btn{margin-top:0}
.legal-doc h2{margin-top:18px}.legal-doc p,.legal-doc li{font-size:14px;color:var(--ink2);line-height:1.8}
.legal-doc ul{padding-left:20px}.legal-doc .updated{font-size:12px;color:var(--sub)}
.subscription-note{padding:11px 12px;border-radius:12px;background:#f7f9fc;border:1px solid var(--line);font-size:12px;line-height:1.7;color:var(--ink2);margin-top:10px}
@media(max-width:360px){.legal-actions{grid-template-columns:1fr}}

</style>
</head>
