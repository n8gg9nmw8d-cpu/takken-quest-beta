<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07182b">
<title>宅建QUEST v9 DEPTH & REWARD</title>
<style>
html,body{margin:0;min-height:100%;background:#07182b;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
#boot{min-height:100svh;display:grid;place-items:center;padding:28px;text-align:center;box-sizing:border-box;background:radial-gradient(circle at 50% 38%,#123b69 0,#07182b 55%,#030912 100%)}
.card{width:min(88vw,430px);padding:28px 20px;border:1px solid rgba(255,255,255,.18);border-radius:24px;background:rgba(3,12,25,.78);box-shadow:0 24px 70px rgba(0,0,0,.35)}
.logo{font-size:32px;font-weight:900;color:#ffd65c}.sub{margin-top:8px;opacity:.8;font-weight:700}
.bar{height:10px;margin:24px 4px 12px;border-radius:999px;background:#152841;overflow:hidden}.bar>i{display:block;width:15%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#48e083,#ffdb57);animation:load 1.15s ease-in-out infinite alternate}.msg{font-size:14px;opacity:.82;line-height:1.6}@keyframes load{to{width:94%}}
</style>
</head>
<body>
<div id="boot"><div class="card"><div class="logo">宅建 QUEST</div><div class="sub">v9 DEPTH & REWARD</div><div class="bar"><i></i></div><div class="msg" id="msg">ゲームデータを読み込み中…</div></div></div>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script>
(async()=>{
 const msg=document.getElementById('msg');
 try{
   const res=await fetch('./takken-quest-asset-ui-v9-depth.zip?v=9',{cache:'no-store'});
   if(!res.ok)throw new Error('ZIP取得失敗 HTTP '+res.status);
   msg.textContent='ゲームを展開中…';
   const zip=await JSZip.loadAsync(await res.arrayBuffer());
   const idx=Object.values(zip.files).find(f=>!f.dir&&/(^|\/)index\.html$/i.test(f.name));
   if(!idx)throw new Error('ZIP内に index.html がありません');
   const base=idx.name.slice(0,idx.name.lastIndexOf('/')+1);
   let page=await idx.async('string');
   const refs=[...new Set(page.match(/assets\/[A-Za-z0-9._-]+/g)||[])];
   const urls=[];
   for(const ref of refs){
     const entry=zip.file(base+ref); if(!entry)throw new Error('アセット不足: '+ref);
     const ext=(ref.split('.').pop()||'').toLowerCase();
     const mime={png:'image/png',jpg:'image/jpeg',jpeg:'image/jpeg',gif:'image/gif',webp:'image/webp',svg:'image/svg+xml',mp3:'audio/mpeg',wav:'audio/wav'}[ext]||'application/octet-stream';
     const bytes=await entry.async('uint8array');
     const url=URL.createObjectURL(new Blob([bytes],{type:mime})); urls.push(url);
     page=page.split(ref).join(url);
   }
   window.__TQ_ASSET_URLS__=urls;
   document.open(); document.write(page); document.close();
 }catch(err){
   console.error(err);
   msg.innerHTML='起動エラー<br><small style="color:#ff9e9e">'+String(err.message||err)+'</small><br><br><button onclick="location.reload()" style="font:inherit;font-weight:800;padding:12px 20px;border:0;border-radius:14px;background:#ffd65c;color:#182238">再読み込み</button>';
 }
})();
</script>
</body></html>
